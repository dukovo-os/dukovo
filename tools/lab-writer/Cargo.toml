[package]
name = "lab-writer"
description = "The Dukovo Lab's disk writer: writes the image under test to a real lab machine's disk, booted from the lab network (ADR 0429)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The C library's calls behind safe functions, so that this program
# forbids unsafe code (ADR 0730).
sysapi = { path = "../../userspace/programs/sysapi" }
# MIT OR Apache-2.0: the constants the calls of sysapi take (errno numbers,
# `O_*` open flags).
libc = "0.2"
# MIT OR Apache-2.0: the lab's plan is JSON.
serde_json = "1"
# MIT OR Apache-2.0: the hash of what is read back from the disk.
sha2 = "0.10"

[lints]
workspace = true
