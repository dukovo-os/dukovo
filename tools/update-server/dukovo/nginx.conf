#
# nginx's settings on Dukovo's update server (ADR 0542):
# dukovo-update-server setup writes this file as nginx.conf in nginx's
# data folder, in place of the bundle's, and writes it again when it runs
# again. It serves the catalog under /catalog/ and the system's releases
# under /system/ with the paths, the cache headers and the refusals Caddy
# has on an Ubuntu server (tools/update-server/Caddyfile). The places
# themselves are in update-server.conf, which each server block includes.
#
# `setup` keeps the lines between the BEGIN and END markers it needs and
# takes away the others, and puts HOST for @HOST@:
#
#   PLAIN     the site over HTTP, until certd has given HOST a certificate;
#   REDIRECT  port 80 sends everyone to HTTPS, once it has;
#   TLS       the site over HTTPS, with the certificate nginx's service
#             file names (`certificates`), which Spark copies and, when
#             certd renews it, has nginx read again.

worker_processes auto;

# nginx's log goes to the system's: `log nginx` reads it.
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # A line for each request, in the system's log too.
    access_log stderr;

    keepalive_timeout 65;

    # What a client may keep. The files a client asks for first change,
    # and are never kept stale; every other file is named by its version
    # or its hash and never changes.
    map $uri $update_cache {
        default "";
        ~^/(catalog|system)/metadata/(timestamp|root)\.json$ "no-cache";
        ~^/(catalog|system)/metadata/[^/]+\.[^/]+\.json$ "public, max-age=31536000, immutable";
        ~^/(catalog|system)/targets/ "public, max-age=31536000, immutable";
        ~^/system/files/ "public, max-age=31536000, immutable";
    }

    server {
        listen 80;
        listen [::]:80;
        server_name @HOST@;

        # The answers to the authority's check of the name, which certd
        # puts in a folder while it gets or renews the certificate (ADR
        # 0513): the location the bundle's acme-challenge.conf has, here
        # so that this file does not depend on the bundle's version.
        location ^~ /.well-known/acme-challenge/ {
            alias /system/live/certd/acme-challenge/;
            default_type application/octet-stream;
        }

        # BEGIN-PLAIN
        include update-server.conf;
        # END-PLAIN

        # BEGIN-REDIRECT
        location / {
            return 301 https://@HOST@$request_uri;
        }
        # END-REDIRECT
    }

    # BEGIN-TLS
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name @HOST@;

        ssl_certificate /system/live/certificates/nginx/@HOST@/fullchain.pem;
        ssl_certificate_key /system/live/certificates/nginx/@HOST@/key.pem;

        include update-server.conf;
    }
    # END-TLS
}
