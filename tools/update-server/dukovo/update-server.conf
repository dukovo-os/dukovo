#
# What nginx serves on the update server (ADR 0542).
# dukovo-update-server setup writes this file beside nginx.conf, and
# writes it again when it runs again. Each server block of nginx.conf
# includes it, and nginx.conf sets $update_cache. The catalog is at
# /catalog/ and the system's releases at /system/, as the links `catalog`
# and `system` that the publish jobs move point at the folders served now
# (site.sh, system-site.sh).

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# An empty value sends no header.
add_header Cache-Control $update_cache always;

# The bare address is for people, who want the project's site; clients
# only ask for paths under /catalog/ and /system/.
location = / {
    return 302 https://dukovo.org/;
}

location /catalog/ {
    alias /system/state/lib/dukovo-catalog-site/catalog/;
}

location /system/ {
    alias /system/state/lib/dukovo-system-site/system/;
}

# No listing of a folder, and nothing else of nginx's folders.
location ~ /$ {
    return 404;
}

location / {
    return 404;
}
