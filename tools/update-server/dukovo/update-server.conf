#
# What nginx serves on the update server (ADR 0542).
# dukovo-update-server setup writes this file beside nginx.conf, and
# writes it again when it runs again. Each server block of nginx.conf
# includes it, and nginx.conf sets $update_cache. The catalog is at
# /catalog/ and the system's releases at /system/, as the links `catalog`
# and `system` that the publish jobs move point at the folders served now
# (site.sh, system-site.sh), and takes the canaries' reports at
# /canary/v1/report.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# An empty value sends no header.
add_header Cache-Control $update_cache always;

# The bare address is for people, who want the project's site; clients
# only ask for paths under /catalog/ and /system/.
location = / {
    return 302 https://dukovo.org/;
}

location /catalog/ {
    alias /system/state/lib/dukovo-catalog-site/catalog/;
}

location /system/ {
    alias /system/state/lib/dukovo-system-site/system/;
}

# The canaries' reports (ADR 0533): this one path with this one method, at
# most 16 KB, to the receiver (dukovo-canary-receive), which holds no key
# and checks every signature. Any other method is refused here, and nginx
# sends the body whole with its length, as the receiver asks.
location = /canary/v1/report {
    limit_except POST {
        deny all;
    }
    client_max_body_size 16k;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_pass http://unix:/system/live/dukovo-canary-receive/receive.sock:/canary/v1/report;
}

# No listing of a folder, and nothing else of nginx's folders.
location ~ /$ {
    return 404;
}

location / {
    return 404;
}
