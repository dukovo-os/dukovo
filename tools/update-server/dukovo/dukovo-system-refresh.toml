#
# Signs the system releases' timestamp again (ADR 0467) every six hours: a
# timestamp alone while the snapshot lists the newest targets and is good
# for two more days, a snapshot and a timestamp when it is not. Each
# release a channel offers has its rollout signed too, opening its waves
# on schedule (ADR 0469), from the plan in rollout.json. Nothing until the
# first deploy brings a root. It has no network.
#
# service.toml(5) explains each setting, `service check dukovo-system-refresh` checks
# this file, and README.md says what runs and how to see it.

service_version = 1
description = "Sign the system releases' timestamp again"
program = "/system/commands/sh"
arguments = ["/system/state/lib/dukovo-update-server/system-refresh.sh"]
# It runs once for each time of its timer, and ends.
restart = "never"
# This job's own copy of the online key, as base64: a secret loses a
# trailing newline and a key is binary. `service secret set` puts it in.
secrets = ["online-key"]

[environment]
DUKOVO_SYSTEM_HOME = "/system/state/lib/dukovo-system"
DUKOVO_SYSTEM_INCOMING = "/system/state/lib/dukovo-system-incoming"
DUKOVO_SYSTEM_PROGRAM = "/system/commands/system-release"
DUKOVO_SYSTEM_SITE = "/system/state/lib/dukovo-system-site"
DUKOVO_LOCK = "/system/live/dukovo-update-server/system.lock"

[limits]
memory = "512M"

[timer]
every = "6h"
after_boot = "10m"

# What it holds beyond what every service reads (service.toml(5)): its
# script and the update server's own folders it works in, and nothing
# else of the system's.
[permissions]
files.read = ["/system/state/lib/dukovo-update-server"]
files.read-write = ["/system/state/lib/dukovo-system", "/system/state/lib/dukovo-system-site", "/system/live/dukovo-update-server"]
