[package]
name = "linux-bench"
description = "The Linux baseline for `ob bench`: system calls and IPC round trips on the host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The C library's calls behind safe functions, so that this program
# forbids unsafe code (ADR 0730).
sysapi = { path = "../../userspace/programs/sysapi" }
# MIT OR Apache-2.0: the constants the calls of sysapi take (`MS_*` mount
# flags, `O_*` open flags, errno numbers).
libc = "0.2"

[lints]
workspace = true
