[package]
name = "xtask"
description = "ob, the Dukovo build tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Kernel libraries shared with the build tool: the symbol and relocation
# table formats, the boot archive's format (to write it), the console fonts
# (to read the screen in boot tests), the microcode format (to build test
# updates), and the lists of kernel flags and kdb commands that `ob docs
# --check` compares with the manual pages.
radix-bootfs = { path = "../../kernel/lib/bootfs", features = ["write"] }
radix-fbcon = { path = "../../kernel/lib/fbcon" }
radix-hal = { path = "../../kernel/hal" }
radix-kdb = { path = "../../kernel/lib/kdb" }
radix-ksyms = { path = "../../kernel/lib/ksyms" }
radix-microcode = { path = "../../kernel/lib/microcode" }
radix-relocs = { path = "../../kernel/lib/relocs" }
# BitLocker volumes encrypted as Windows encrypts them, for the bitlocker
# boot test (ADR 0240).
radix-bitlocker = { path = "../../kernel/fs/bitlocker", features = ["make"] }
# The Dukovo root's Btrfs, made and written by the kernel's own Btrfs
# crate through the disk engine, as mkfs-btrfs makes one (ADR 0304).
disk = { path = "../../userspace/programs/disk", features = ["btrfs"] }
radix-btrfs = { path = "../../kernel/fs/btrfs", features = ["make"] }
radix-vfs = { path = "../../kernel/fs/vfs", features = ["host"] }
# An image's EFI system partition, written by the kernel's FAT crate as
# Radix writes one (ADR 0306).
radix-fat = { path = "../../kernel/fs/fat", features = ["host"] }
# The account files and Argon2id hashes, for `ob image --user` (ADR 0218).
accounts = { path = "../../userspace/programs/accounts", features = ["hash"] }
# The settings of service files and the fields and permissions of
# bundle manifests, which `ob docs --check` compares with service.toml(5)
# and manifest.json(5).
manifest = { path = "../../userspace/programs/manifest", features = ["bundle"] }
# The catalog's bundles of ports, signed and packed as bundle(1) packs them
# (ADR 0370).
dkv = { path = "../../userspace/programs/dkv" }
# WAV files and the tones' detection, for the audio boot tests' check of
# what the guest played (ADR 0320).
audio = { path = "../../userspace/programs/audio" }
# The slot state on an installed system's EFI system partition and what
# a slot says of itself, written as dukovo-install(8) and sysupdate(8)
# write them (ADRs 0451 and 0452).
slots = { path = "../../userspace/programs/slots" }
# The interface compiler, for the man(2) pages and C headers of abi/*.ridl.
ridlc = { path = "../ridlc" }
# Markdown for the support center's pages, from the handbook, the design
# notes and the decision records (ADR 0419).
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rustc-demangle = "0.1"
# SHA-256, for the restic-backup boot test's S3 server, which checks AWS's
# signatures (ADR 0465).
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[lints]
workspace = true
