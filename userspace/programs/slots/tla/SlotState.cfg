\* `ob test tla` checks the slot state with three tries, three updates
\* staged, each of any kind, and three power cuts anywhere, with GRUB
\* starting the default when it cannot write and a stage forgetting the
\* spare slot before it removes it, as the code does.
SPECIFICATION Spec

CONSTANTS
    Tries = 3
    MaxStages = 3
    MaxCuts = 3
    StartDefault = TRUE
    ForgetFirst = TRUE
    Torn = Torn
    None = None

INVARIANTS
    TypeOK
    OneWhole
    StartsASystem
    TriesCounted
    NamesHeld
