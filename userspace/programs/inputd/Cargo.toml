[package]
name = "inputd"
description = "inputd(8): hands each keyboard, mouse and tablet to the program that holds the screens, and reads no event itself (ADR 0707)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# radix-input(2)'s requests on a device's file, what kind of device each
# is, and the exchange with the programs the devices are handed to.
input = { path = "../input" }
# The libc crate with its Radix module, which ob patches in from the
# rust-std port (ADR 0070).
libc = "0.2.191"
# The poll loop, the signal that stops it, and descriptors sent over a
# socket, behind safe calls (ADR 0730).
sysapi = { path = "../sysapi" }

[lints]
workspace = true
