[package]
name = "catalog-repo"
description = "Makes and signs the catalog's TUF repository, with YubiKeys (ADR 0381)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The bundles' manifests, read from their .dkv files (ADR 0222).
dkv = { path = "../dkv" }
serde_json = "1.0.140"
# TUF's metadata, made and signed, and checked as the client checks it
# (ADR 0380).
tuf = { path = "../tuf" }

[lints]
workspace = true
