[package]
name = "window-frame"
description = "The frame the window server (windowd(1)) draws around a window: its sizes and colours, where each of its parts is, and its pixels, which the boot tests on the host make again to compare a screen with"
version.workspace = true
edition.workspace = true
# The code is the project's; the font it writes a title in is Spleen's
# (BSD-2-Clause), from radix-fbcon.
license = "(Apache-2.0 OR MIT) AND BSD-2-Clause"
repository.workspace = true
publish.workspace = true

[dependencies]
# The consoles' Spleen fonts, which a title is drawn in until the
# desktop has fonts of its own (docs/deferred.md).
radix-fbcon = { path = "../../../kernel/lib/fbcon" }

[lints]
workspace = true
