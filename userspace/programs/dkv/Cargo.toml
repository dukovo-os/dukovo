[package]
name = "dkv"
description = "Signing, packing and checking Dukovo bundles and their .dkv files (ADR 0222), for bundle(1) and for ob"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Unpacking opens each file without following a link.
libc = "0.2.191"
# The manifest a bundle's signature covers (ADR 0221).
manifest = { path = "../manifest", features = ["bundle"] }
# minisign's Ed25519 over BLAKE2b-512, the SHA-256 of each file, and the
# zip a .dkv file is.
blake2 = { version = "0.10.6", default-features = false }
ed25519-compact = { version = "2.6.0", default-features = false }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
sha2 = { version = "0.10.9", default-features = false }

[lints]
workspace = true
