[package]
name = "systools"
description = "Dukovo's native administration tools (ps, top, lsof, rtrace and the rest) as one program"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# audio(1)'s WAV files, conversion and resampling, and audio.toml(5),
# which audiod(8) keeps (ADR 0320).
audio = { path = "../audio" }
# getfacl(1)'s and setfacl(1)'s access lists, in their attributes (ADR
# 0256).
acl = { path = "../acl" }
# authd(8)'s account files and Argon2id hashes, and what it is asked
# (ADR 0218).
accounts = { path = "../accounts", features = ["hash", "ntlm"] }
# rdisk(8)'s tables, the mkfs tools' FAT and exFAT (ADR 0300), and
# mkfs-btrfs(8) and fsck-btrfs(8) on the kernel's Btrfs crate (ADRs 0304
# and 0305), rgrub-setup(8)'s GRUB on disks and EFI system partitions
# on its FAT crate (ADR 0306), and resize-ntfs(8) on its NTFS crate (ADR
# 0312).
disk = { path = "../disk", features = ["btrfs", "fat", "ntfs"] }
# kinit(1), klist(1) and kdestroy(1): Kerberos's exchanges, krb5.conf,
# keytabs and tickets in the keyring (ADR 0397).
kerberos = { path = "../kerberos" }
# keymap(1)'s layouts and their setting (ADR 0149).
keymap = { path = "../keymap" }
libc = "0.2.191"
# resolved(8)'s DNS messages (ADR 0193), and timed(8)'s NTP and Network
# Time Security (ADR 0194).
netproto = { path = "../netproto" }
# service(8)'s check, new and edit read service files as Spark does
# (ADR 0216); bundle(1) reads bundle manifests and prints their schema
# (ADR 0221).
manifest = { path = "../manifest", features = ["schema"] }
# service(8), sysupdate's health check and bundled(8) read what Spark
# says of the services, its `show` answer (ADR 0470).
spark-api = { path = "../spark-api" }
# bundle(1)'s signatures (ADR 0222): minisign's Ed25519 over BLAKE2b-512,
# the SHA-256 of each file, and the zip a .dkv file is, in the dkv crate
# that ob shares (ADR 0370).
dkv = { path = "../dkv" }
# bundled(8) reads the catalogs with Dukovo's TUF client (ADRs 0380 and
# 0383).
tuf = { path = "../tuf" }
# system-release(8) checks a signed system release, such as an install
# stick's, with the crate ob signs releases with (ADR 0308).
system-release = { path = "../system-release" }
# The slot state, versions and update snapshots sysupdate(8) works with,
# as GRUB's menu and Spark read them (ADRs 0451 to 0454).
slots = { path = "../slots" }
# health.toml(5).
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
# bundle feed signs a bundle's own update feed, a small TUF repository, as
# the catalog's is signed (ADRs 0381 and 0390).
catalog-repo = { path = "../catalog-repo" }
# The system call interface, generated from abi/*.ridl, for what the C
# library does not wrap: affinity, I/O priority, tracing.
radix-abi = { path = "../../../kernel/abi" }
# BitLocker volumes' metadata, and their keys unwrapped with a password
# or recovery key, for unlock(8) (ADR 0240).
radix-bitlocker = { path = "../../../kernel/fs/bitlocker", features = ["keys"] }
# subvolume(8)'s send and receive: Linux's send streams, made from the
# kernel's comparison of two snapshots and read back, by the kernel's own
# Btrfs crate (ADR 0462).
radix-btrfs = { path = "../../../kernel/fs/btrfs", features = ["send"] }
# e1000d(8) runs the kernel's own e1000 and e1000e driver as a program
# (ADR 0198), over registers and DMA memory the kernel maps for it.
radix-hw = { path = "../../../kernel/lib/hw" }
radix-intel-net = { path = "../../../kernel/drivers/intel" }
radix-nic = { path = "../../../kernel/drivers/nic" }
# The firmware's SMBIOS tables, as the kernel reads them, for hwinfo(8)
# (ADR 0231).
radix-smbios = { path = "../../../kernel/lib/smbios" }
radix-spd = { path = "../../../kernel/lib/spd" }
# TLS for resolved(8)'s DNS over TLS and HTTPS (ADR 0193), rustls on
# ring, which ob patches in from the rust-crates port (ADR 0192), and for
# timed's NTS key establishment; ring's random numbers for both.
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# The reference ID timed serves for a server it synced from over IPv6:
# the start of the address's MD5 (RFC 5905 §7.3, ADR 0487).
md-5 = "0.11.0"
# cert(8) and certd(8) (ADR 0512): rcgen on ring makes the machine's own
# certificate, with the times `time` gives it, x509-cert (RustCrypto's)
# reads names, dates and issuers, and webpki checks a chain against the
# system's roots, as rustls does for a connection.
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
time = { version = "0.3.55", default-features = false }
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false, features = ["ring", "std"] }
x509-cert = { version = "0.3.0", default-features = false, features = ["std"] }
# cert(8) and certd(8) get certificates from ACME authorities (ADR 0513):
# instant-acme (Apache-2.0) on ring, without its own HTTP client, whose
# requests go through tuf's, so that the system's roots and its resolver
# serve them; http and http-body-util are the types it hands that client,
# and tokio's current-thread runtime and timer drive its polling.
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "time"] }
http = "1.4.0"
http-body-util = "0.1.3"
tokio = { version = "1.54.1", features = ["rt", "time"] }
# discoverd(8)'s multicast DNS and DNS-SD (ADR 0338), without the async
# half of its channels, and the machine's addresses for its own name;
# ob patches if-addrs in from the rust-crates port.
if-addrs = "0.15.0"
mdns-sd = { version = "0.21.7", default-features = false, features = ["logging"] }
# ping(8)'s ping sockets (ADR 0336); ob patches it in from the
# rust-crates port.
socket2 = "0.6.5"
# wgd(8)'s WireGuard (ADR 0340): Cloudflare's boringtun, its noise
# protocol and sessions alone, without its device and its threads; wg(8)
# writes keys in base64, as wireguard-tools does.
base64 = "0.22.1"
boringtun = { version = "0.7.1", default-features = false }
# ssh-askpass-keyring(1) checks that a passphrase opens an OpenSSH key
# before it gives or keeps it (ADR 0395): RustCrypto's ssh-key (Apache-2.0
# OR MIT), which sshd(8) has through russh, with bcrypt-pbkdf and AES.
ssh-key = { version = "0.7.0-rc.11", default-features = false, features = ["encryption"] }
# backup(8)'s encryption (ADR 0463): the age format through rage's own
# library (Apache-2.0 OR MIT), with X25519 keys, without its command
# line, plugins or SSH keys.
age = { version = "0.11.5", default-features = false }
# backup(8)'s restic repositories (ADR 0465): rustic's library, which
# reads and writes restic's format, through backup's own stores; bytes
# for the buffers its stores trade in.
rustic_core = { version = "0.13.0", default-features = false }
bytes = "1.12.1"
# logd(8)'s records and requests, as lines of JSON (ADR 0210).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
# The network stack's DHCP messages (0BSD), which netd(8) reads and
# writes with it (ADR 0191); the socket feature only for the crate to
# build.
smoltcp = { version = "=0.14.0", default-features = false, features = [
    "std",
    "medium-ethernet",
    "proto-dhcpv4",
    "socket-udp",
] }

[lints]
workspace = true
