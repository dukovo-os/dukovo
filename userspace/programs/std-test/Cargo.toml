[package]
name = "std-test"
description = "Tests Rust's standard library on Radix, in the posix boot test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The libc crate with its Radix module, which ob patches in from the
# rust-std port (ADR 0070).
libc = "0.2.189"
# mio with its poll(2) selector, as tokio uses it on Radix (ADR 0070).
mio = { version = "1.2.4", features = ["os-poll", "os-ext"] }
# The process group, the environment, a thread's name as the kernel keeps
# it, behind safe calls (ADR 0730).
sysapi = { path = "../sysapi" }

[lints]
workspace = true
