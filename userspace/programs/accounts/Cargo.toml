[package]
name = "accounts"
description = "Dukovo's accounts (ADR 0218): the passwd, group and password files, the rules for names, Argon2id hashes, and what authd(8) is asked"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Argon2id hashes, for authd(8), and for `ob image --user`, which makes
# an account in an image.
hash = ["dep:argon2", "dep:base64ct"]
# NTLMv2 as a server checks it, for the sharing passwords that Windows PCs
# sign in to shares with (ADR 0228): authd(8)'s.
ntlm = ["dep:hmac", "dep:md4", "dep:md-5"]

[dependencies]
# RustCrypto's Argon2 (MIT OR Apache-2.0), without its PHC string types:
# the hashes are written and read here (RFC 9106, the PHC string format).
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"], optional = true }
base64ct = { version = "1.8", features = ["alloc"], optional = true }
# RustCrypto's HMAC, MD4 and MD5 (MIT OR Apache-2.0), the versions smb2
# uses: NTLM's NT hash is an MD4, and its proofs HMAC-MD5s.
hmac = { version = "0.13.0", optional = true }
md4 = { version = "0.11.0", optional = true }
md-5 = { version = "0.11.0", optional = true }

[lints]
workspace = true
