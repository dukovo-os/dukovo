[package]
name = "smb"
description = "smb(1): mounts a share of a Windows network (SMB 2 and 3) as a filesystem it serves through /devices/fuse, and lists shares and folders (ADR 0227)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The filesystem's side of Linux's FUSE protocol, which ob patches in
# from the rust-crates port (ADR 0226), at the protocol's version 7.31.
fuser = { version = "0.16.0", default-features = false, features = ["abi-7-31"] }
# The libc crate with its Radix module, which ob patches in from the
# rust-std port (ADR 0070).
libc = "0.2.191"
# The system call interface, generated from abi/*.ridl: radix-directory(2)'s
# mount_fuse, which the C library does not wrap.
radix-abi = { path = "../../../kernel/abi" }
# SMB 2 and 3: signing, encryption, NTLM, on tokio (ADR 0227).
smb2 = { version = "0.39.0", default-features = false, features = ["tokio"] }
# What smb2 runs on: a runtime of one thread, its sockets and timers.
# ob patches tokio and socket2 in from the rust-crates port.
tokio = { version = "1.54.1", features = ["rt", "net", "time"] }

[lints]
workspace = true
