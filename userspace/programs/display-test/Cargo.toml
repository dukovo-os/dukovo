[package]
name = "display-test"
description = "Tests the display layer (radix-display(2)) on real cards and the input that follows it in the display and input boot tests: it draws pictures the host knows pixel for pixel, says in the log what each screen shows, and says who heard each key"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The test patterns and the lines that say what each screen shows, which
# the boot tests on the host read (tools/xtask/src/test/screens.rs).
display-pattern = { path = "../display-pattern" }
# The display layer's records and requests (radix-display(2)).
display = { path = "../display" }
# The input files' records and requests (radix-input(2)), what each
# device is, and inputd(8)'s exchange.
input = { path = "../input" }
# The right a copy of a holder's description keeps when it is sent to
# inputd: to be passed on, and no other.
radix-abi = { path = "../../../kernel/abi" }
# The libc crate with its Radix module, which ob patches in from the
# rust-std port (ADR 0070).
libc = "0.2.191"
# The display layer's requests, memory files and their pages, the clock,
# the wait for an event and the descriptor consoled lends, behind safe
# calls (ADR 0730).
sysapi = { path = "../sysapi" }

[lints]
workspace = true
