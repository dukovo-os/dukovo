[package]
name = "dukovo-install"
description = "dukovo-install(8): Dukovo installed onto a disk from the install stick's signed release, as an answers file says"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The accounts' files, and checks of the password hashes an answers file
# gives (ADR 0218).
accounts = { path = "../accounts", features = ["hash"] }
# Every message the installer shows, in Fluent files, one folder a
# language (Apache-2.0 OR MIT).
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
# The installer's screens, drawn on the console through crossterm, which
# ob patches in from the rust-crates port (MIT).
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# Partition tables, read and planned with the engine rdisk(8) writes
# them with (ADR 0300); and next to Windows, its NTFS volume checked by
# the kernel's own crate and Windows Boot Manager found on its EFI system
# partition (ADR 0314).
disk = { path = "../disk", features = ["ntfs", "fat"] }
# The features the Software page offers (feature.toml(5)), and the
# service files their services are turned on in.
manifest = { path = "../manifest" }
# The keyboard layouts the screens offer (keymap(1)).
keymap = { path = "../keymap" }
# ttyname(3), which tells whether the installer runs on the serial port
# (MIT OR Apache-2.0).
libc = "0.2.191"
# The SHA-256 of each file as it is copied, ring's, which ob patches in
# from the rust-crates port (ADR 0192).
ring = "0.17.14"
# The answers file, in JSON.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
# The slot state the menu starts the system by, both copies written on
# each EFI system partition (ADR 0452).
slots = { path = "../slots" }
# The signed release on the install stick, read from the root the system
# trusts (ADR 0308).
system-release = { path = "../system-release" }
# The consoles' settings file and reader.toml, read to show the live
# system's accessibility (Apache-2.0 OR MIT).
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
# Setup files from the web, fetched over https only by the update
# client's HTTP (ADR 0319).
tuf = { path = "../tuf" }

[lints]
workspace = true
