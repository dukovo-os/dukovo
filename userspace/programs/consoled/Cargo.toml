[package]
name = "consoled"
description = "Dukovo's virtual consoles: terminals on the screen and keyboard, with a shell on each"
version.workspace = true
edition.workspace = true
# The code is the project's; the fonts it draws with are Spleen's
# (BSD-2-Clause), from radix-fbcon.
license = "(Apache-2.0 OR MIT) AND BSD-2-Clause"
repository.workspace = true
publish.workspace = true

[dependencies]
accounts = { path = "../accounts" }
# The display layer's records and requests (radix-display(2)).
display = { path = "../display" }
# The keyboard layouts (ADR 0149).
keymap = { path = "../keymap" }
libc = "0.2.191"
# The system call interface, generated from abi/*.ridl: `control`, for
# the display layer's requests and the keyboard's own.
radix-abi = { path = "../../../kernel/abi" }
# Pseudo-terminals, the sessions' processes, signals, the poll loop and
# the devices' requests, behind safe calls (ADR 0730).
sysapi = { path = "../sysapi" }
# notifyd's notifications are lines of JSON (ADR 0212).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
# The kernel console's Spleen fonts and the choice between them, so that
# the consoles look as the kernel's log did.
radix-fbcon = { path = "../../../kernel/lib/fbcon" }
# welcome.toml(5) (Apache-2.0 OR MIT).
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
# Alacritty's parser of terminal escape sequences (Apache-2.0 OR MIT).
vte = { version = "0.14.1", default-features = false }

[dev-dependencies]
# The display layer itself, which the screens' tests draw through with
# stand-in cards.
radix-display = { path = "../../../kernel/lib/display" }

[lints]
workspace = true
