#
# The limits boot test's memory hog: it takes memory a MiB at a time until
# its domain's limit refuses a page, which ends it, and Spark says it was
# stopped at its memory limit (ADR 0476).

service_version = 1
description = "Takes memory until its limit stops it"
program = "/system/tests/posix/hog"
# It ends at its limit and stays ended, for `service status` to say so.
restart = "never"

[limits]
memory = "64M"
