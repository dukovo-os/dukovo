#
# The limits boot test's open files: Spark sets the soft and the hard
# limit of the program's open files to 10000 before it starts, and the
# shell says them (ADR 0476).

service_version = 1
description = "Says its open files limits"
program = "/system/commands/sh"
arguments = ["-c", 'echo "soft $(ulimit -n) hard $(ulimit -Hn)"; sleep 1000']
restart = "never"

[limits]
open_files = 10000
