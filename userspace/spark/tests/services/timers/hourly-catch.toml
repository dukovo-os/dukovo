#
# The timers boot test's hourly service with catch-up: a time that passes
# while the machine is off makes it run once at the next start.

service_version = 1
description = "Adds a line to a file every hour, with catch-up"
program = "/system/commands/sh"
arguments = ["-c", 'mkdir -p /system/state/timers; echo run >> /system/state/timers/hourly-catch']
enabled = false
restart = "never"

[timer]
at = ["hourly"]
catch_up = true

[permissions]
files.read-write = ["/system/state/timers"]
