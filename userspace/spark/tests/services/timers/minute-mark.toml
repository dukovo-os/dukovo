#
# The timers boot test's service that runs at each minute's start: each
# run adds a line to a file.

service_version = 1
description = "Adds a line to a file each minute"
program = "/system/commands/sh"
arguments = ["-c", 'mkdir -p /system/state/timers; echo run >> /system/state/timers/minute-mark']
enabled = false
restart = "never"

[timer]
at = ["* * * * *"]

[permissions]
files.read-write = ["/system/state/timers"]
