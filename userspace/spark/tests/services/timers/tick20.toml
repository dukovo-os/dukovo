#
# The timers boot test's service that runs every 20 seconds: each run
# adds a line to a file and ends.

service_version = 1
description = "Adds a line to a file every 20 seconds"
program = "/system/commands/sh"
arguments = ["-c", 'mkdir -p /system/state/timers; echo run >> /system/state/timers/tick20']
enabled = false
restart = "never"

[timer]
every = "20s"

[permissions]
files.read-write = ["/system/state/timers"]
