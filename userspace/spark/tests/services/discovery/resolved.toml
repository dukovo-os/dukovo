#
# A service of the network-discovery boot test: resolved(8) as the
# system's own file has it, which asks discoverd for the .local names
# that ping and resolvectl look up.

service_version = 1
description = "DNS resolver"
program = "/system/commands/resolved"
order = 21
restart = "always"

[limits]
memory = "32M"

[permissions]
network.outbound = true
network.listen = [53]
files.read = ["/system/live/netd", "/system/live/discoverd"]
files.read-write = ["/system/live/resolved"]
