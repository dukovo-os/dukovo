#
# A service of the network-discovery boot test: discoverd(8) as the
# system's own file has it, but off until discotest has named the
# machine and put it on the cable, which then starts it.

service_version = 1
description = "Local network discovery"
program = "/system/commands/discoverd"
enabled = false
order = 24
restart = "always"

[limits]
memory = "32M"

[permissions]
network.outbound = true
network.listen = [5353]
files.read-write = ["/system/live/discoverd"]
