#
# A service of the network-discovery boot test: netd(8) as the system's
# own file has it, which puts each machine at the address on the cable
# that its discotest writes into network(5).

service_version = 1
description = "Network setup"
program = "/system/commands/netd"
order = 20
restart = "always"

[limits]
memory = "16M"

[permissions]
network.outbound = true
network.listen = [68, 546]
admin.network = true
files.read-write = ["/system/state/netd", "/system/live/netd"]
