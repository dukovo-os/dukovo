#
# The updater (updated(8), ADR 0502): ten minutes after each start, then
# once a day, it checks the update server for a newer system, firmware
# set and apps, and does what updates.toml(5) says: by default it tells
# whoever is signed in. It never restarts the machine, unless the owner
# made it unattended and gave it a restart time. While netd(8) says the
# connection is metered, it tells of updates but downloads none, unless
# updates.toml(5) says `metered = "download"`.
#
# service.toml(5) explains each setting. `service check updated` checks
# this file, and `service edit updated` checks it as you save.

service_version = 1
description = "Updates: check and tell"
program = "/system/commands/updated"
# After networking and the health check.
order = 91
restart = "always"

[limits]
memory = "64M"

# What it holds beyond what every service reads (service.toml(5)): the
# whole tree, to update the apps for everyone when the owner asks for
# that, as bundled(8) does, to unstage a release and go back to the
# version before it, and to read the slot back against its signed list,
# as sysupdate(8) does, and the network, to reach the update server. It
# stages a system update through the sysupdate-stage service, which holds
# no home folder (ADR 0473).
[permissions]
runs-with-your-access = true
network.outbound = true
