#
# The health check of atomic updates (sysupdate(8), ADR 0453): at every
# boot it removes a slot a stage left half built, then watches the
# essential services that health.toml(5) names. An update being tried
# proves itself when they run for two minutes without a restart and the
# required checks pass, and becomes the default; one that fails restarts
# the machine into the version before it. Any other start is seen
# through once they run, and the boot menu stays hidden at the next.
#
# service.toml(5) explains each setting. `service check sysupdate`
# checks this file, and `service edit sysupdate` checks it as you
# save.

service_version = 1
description = "Update health check"
program = "/system/commands/sysupdate"
arguments = ["health"]
# After every other service, which it watches.
order = 90
# It gives its result and ends.
restart = "never"

# Naming a failed start's likely cause reads up to 20,000 lines of its
# log (ADR 0474).
[limits]
memory = "64M"

# What it holds beyond what every service reads (service.toml(5)), and why
# (ADR 0473); health.toml's checks run with the same view, so a check that
# needs more is a service of its own that the check asks about with
# `service NAME status --quiet`.
#
# - The root's system slots, the slot a stage left half built, which it
#   removes, and the firmware store, which it reads for this start's
#   record; no other name at the top of the root, so no home folder.
# - The EFI system partitions, where the slot state is written, and no
#   other disk: where the root is comes from Spark's record of it.
# - Its own state and the starts' records, and /system/live/sysupdate,
#   where the lock, the failure notice and this start's record number
#   are.
# - The list of installed apps, which each start's record names, and
#   every process, since the stage that holds the lock may be a process
#   of another service.
# - Spark's control socket, to watch the essential services and to ask
#   for a restart, and the log's query socket and the troubleshoot
#   signatures, to name the likely cause of a failed start in its notice
#   (ADR 0474). Spark leaves out of the view a socket or signatures that
#   are not there yet (service.toml(5)), and the notice goes without the
#   likely cause then.
[permissions]
files.root-subvolumes = ["@system.a", "@system.b", "@system.new", "@firmware"]
files.efi-system = "read-write"
files.read-write = [
    "/system/state/sysupdate",
    "/system/state/starts",
    "/system/live/sysupdate",
    "/system/live/spark/control",
    "/system/live/log/query",
]
files.read = [
    "/system/live/spark/root",
    "/system/state/bundled/installed",
    "/system/state/troubleshoot",
    "/processes",
]
