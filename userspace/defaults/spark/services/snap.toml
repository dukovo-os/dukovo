#
# Snapshots: snap(1) makes a read-only snapshot of each place that
# snap.toml(5) names when it starts and then once a day, and removes those
# the retention there no longer keeps (ADR 0461). Snapshots of the root
# are in /snapshots.
#
# service.toml(5) explains each setting. `service check snap` checks
# this file, and `service edit snap` checks it as you save.

service_version = 1
description = "Snapshots"
program = "/system/commands/snap"
arguments = ["auto", "--watch"]
# After the disks are mounted and the consoles are up.
order = 55
# Started again if it fails: always, on-failure or never.
restart = "on-failure"

[limits]
memory = "32M"

# What it holds beyond what every service reads (service.toml(5)), and why
# (ADR 0473): the places snap.toml names by default, which it reads and
# snapshots (a snapshot needs the place's subvolume, not the right to
# change it); /snapshots, where it reads the snapshots made; and
# @snapshots alone at the top of the root, where it makes and removes them.
# A place of snap.toml that is not here is skipped and logged: add it with
# `service edit snap`, and for one on another disk, that disk's top as
# files.read-write = ["/volumes/LABEL"] (snap.toml(5)).
[permissions]
files.root-subvolumes = ["@snapshots"]
files.read = ["/users", "/shared", "/snapshots"]
