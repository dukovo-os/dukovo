#
# The machine's history and early warnings (metrics.toml(5), metricsd(8),
# ADR 0484). Every setting below is at its default, as a comment: take the
# `#` off the lines you want to change, then run `service metricsd reload`.
# A setting with a mistake in it keeps its default, and `log metricsd`
# says which.

# The Prometheus endpoint, plain HTTP: off while `listen` is empty or
# missing. `allow` is needed with `listen`, and a connection from any
# other address is closed at once. It has no password, so name the
# monitoring server's addresses and no others. The service file lets
# metricsd listen on port 9100 only.
#
# [prometheus]
# listen = ["192.168.1.10:9100"]
# allow = ["192.168.1.0/24", "fd00::/8"]

# When the warnings come.
#
# [warnings]
# The percent of a filesystem in use that is a warning, from 20 to 96. It
# is critical from 97.
# filesystem = 90
# A filesystem that is half full and fills within this many days at the
# last 6 hours' rate is a warning, from 1 to 30.
# filling-days = 3
# The degrees Celsius below a sensor's critical temperature that are a
# warning, from 1 to 30.
# temperature-margin = 5
# The days before a certificate in /system/settings/ssl ends that are a
# warning, from 4 to 365. It is critical within 3.
# certificate-days = 14
