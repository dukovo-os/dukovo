# Rescue's boot menu entry (ADRs 0459 and 0460), on an installed Dukovo
# Server's EFI system partition as boot/grub/rescue.cfg, which the menu
# there (image/grub/installed.cfg.in) sources after the slot's entries,
# with what it read set:
#
#   slot_boot       the slot whose last start was not seen through, if any
#   slot_try        the update being tried, if any
#   rescue_now      1 when neither slot's menu could be read
#   dukovo_root, dukovo_console, dukovo_cmdline and dukovo_modules, as
#                   the slot's menu has them (image/grub/menu.cfg)
#
# Rescue is the live system of a release, kept in boot/rescue beside
# this file: its startup folder, with the kernel, and its boot archive,
# `system`, which the kernel loads whole and runs from memory. A new
# copy is switched in by two renames; between them only boot/rescue.old
# is whole, and starts.
#
# The menu counts the starts that were not seen through, in a row, in
# rescue.env beside this file: each start the health check has not yet
# cleared (sysupdate(8)), but an update's own try, which its tries count.
# After three, or with no slot to start, Rescue is the entry that starts
# by itself, and the menu shows first.

unset rescue_dir
set rescue_esp="(${root})"
if [ -f "${rescue_esp}/boot/rescue/system" -a -f "${rescue_esp}/boot/rescue/startup/radix" ]; then
    set rescue_dir="${rescue_esp}/boot/rescue"
elif [ -f "${rescue_esp}/boot/rescue.old/system" -a -f "${rescue_esp}/boot/rescue.old/startup/radix" ]; then
    set rescue_dir="${rescue_esp}/boot/rescue.old"
fi

set rescue_starts=0
if [ -f "${prefix}/rescue.env" ]; then
    load_env --file "${prefix}/rescue.env" rescue_starts
fi
if [ -n "${slot_boot}" -a "${slot_boot}" != "${slot_try}" ]; then
    if [ "${rescue_starts}" = 0 ]; then
        set rescue_starts=1
    elif [ "${rescue_starts}" = 1 ]; then
        set rescue_starts=2
    else
        set rescue_starts=3
    fi
    if [ -f "${prefix}/rescue.env" ]; then
        save_env --file "${prefix}/rescue.env" rescue_starts
    fi
fi

if [ -n "${rescue_dir}" ]; then
    unset slot_version
    if [ -f "${rescue_dir}/startup/slot.env" ]; then
        load_env --file "${rescue_dir}/startup/slot.env" slot_version
    fi
    if [ -n "${slot_version}" ]; then
        set rescue_title="Rescue (Dukovo ${slot_version})"
    else
        set rescue_title="Rescue"
    fi

    # The live system for the root this menu starts, with the machine's
    # own flags and its serial console, if it keeps one. Not quiet: the
    # kernel's log shows until Rescue's screens do.
    menuentry "${rescue_title}" --id rescue {
        multiboot2 ${rescue_dir}/startup/radix live rescue=${dukovo_root} ${dukovo_console} ${dukovo_cmdline}
        module2 ${rescue_dir}/system bootfs
        dukovo_modules
        boot
    }

    if [ "${rescue_now}" = 1 -o "${rescue_starts}" = 3 ]; then
        set default=rescue
        set timeout_style=menu
        if [ "${dukovo_timeout}" -eq 0 ]; then
            set timeout=1
        elif [ "${dukovo_timeout}" -lt 10 ]; then
            set timeout=10
        else
            set timeout="${dukovo_timeout}"
        fi
        if [ "${rescue_now}" = 1 ]; then
            echo "Rescue starts, to repair the system or copy data off."
        else
            echo "Dukovo did not finish starting three times in a row: Rescue starts, to repair it."
        fi
    fi
fi
