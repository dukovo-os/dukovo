# The boot menu of an installed Dukovo Server, in each slot as
# startup/menu.cfg beside the slot's kernel and startup archive (ADR
# 0451). The GRUB configuration on the EFI system partition
# (image/grub/installed.cfg.in) reads the slot state and sources the
# default slot's copy of this file, with these set:
#
#   system          the Dukovo root, found by its Btrfs UUID
#   dukovo_root     that UUID
#   dukovo_console  ` console=ttyS0` on a system with a serial console,
#                   or nothing (ADR 0318)
#   dukovo_cmdline  the machine's own kernel flags
#   dukovo_timeout  the menu's timeout, in seconds
#   dukovo_modules  a function that adds the modules on the partition,
#                   such as the CPU's microcode
#   slot_ok         1 when a whole copy of the slot state was read
#   slot_gen, slot_default, slot_previous, slot_try, slot_tries and
#   slot_boot       the newest whole copy, or slot A's start with none
#   slot_older      the copy the next state is written over: the older,
#                   or the one that is not whole
#
# The menu starts the update being tried while it has tries left, and
# takes one before it starts it; with none left, the default starts,
# told which update fell back. Every start marks itself as not yet seen
# through, which the health check clears once the system has proved
# itself (sysupdate(8)); until then, the menu shows at the next start.
# userspace/programs/slots models every write here, the boot tests check
# this file against it, and userspace/programs/slots/tla/SlotState.tla
# checks the writes against power cuts.

# What each slot says of itself (startup/slot.env): its version, and the
# kernel flags it always starts with, which a release leaves empty.
function slot_about {
    unset slot_version
    unset slot_flags
    if [ -f "($system)/@system.$1/startup/slot.env" ]; then
        load_env --file "($system)/@system.$1/startup/slot.env" slot_version slot_flags
    fi
    if [ -n "${slot_version}" ]; then
        set slot_name="Dukovo Server ${slot_version}"
    else
        set slot_name="Dukovo Server"
    fi
}
slot_about a
set slot_a_name="${slot_name}"
set slot_a_version="${slot_version}"
set slot_a_flags="${slot_flags}"
slot_about b
set slot_b_name="${slot_name}"
set slot_b_version="${slot_version}"
set slot_b_flags="${slot_flags}"

# Writes the state over the older copy, as the next generation, so that
# it becomes the newer, and a second write from this menu, after a start
# that failed to load, goes over the other. GRUB changes a copy in place,
# and writes nothing when it cannot: then slot_written stays 0.
function slot_write {
    set slot_written=0
    if [ "${slot_gen}" = 0 ]; then
        set slot_gen=1
    elif [ "${slot_gen}" = 1 ]; then
        set slot_gen=2
    else
        set slot_gen=0
    fi
    set slot_check="${slot_gen}:${slot_default}:${slot_previous}:${slot_try}:${slot_tries}:${slot_boot}"
    if save_env --file "${slot_older}" slot_gen slot_default slot_previous slot_try slot_tries slot_boot slot_check; then
        set slot_written=1
        set slot_was_older="${slot_older}"
        set slot_older="${slot_newer}"
        set slot_newer="${slot_was_older}"
    fi
}

# What the Dukovo entry writes before it starts its slot (the slots
# crate's State::started): a try taken from the update being tried, and
# the start marked. A try that could not be counted is not started: the
# default starts in its place, and the update waits.
function slot_started {
    set slot_written=0
    if [ "${slot_ok}" = 1 ]; then
        if [ -n "${slot_try}" ]; then
            if [ "${slot_tries}" = 3 ]; then
                set slot_tries=2
            elif [ "${slot_tries}" = 2 ]; then
                set slot_tries=1
            elif [ "${slot_tries}" = 1 ]; then
                set slot_tries=0
            fi
        fi
        set slot_boot="${slot_start}"
        slot_write
    fi
    if [ "${slot_written}" != 1 ]; then
        set slot_start="${slot_default}"
    fi
}

# What an entry chosen by hand writes before it starts the slot $1
# (State::chose): only the start marked.
function slot_chose {
    if [ "${slot_ok}" = 1 ]; then
        set slot_boot="$1"
        slot_write
    fi
}

# Starts the slot $1, with $2 first on the kernel's command line and $3,
# `quiet` or nothing, after its own flags. An installed system restarts
# 10 seconds after a panic, so that a machine nobody is at comes back by
# itself, and onto the next try. `quiet` shows the startup screen in place
# of the kernel's log, which Esc brings back (ADR 0426). The slot's own
# flags come before the machine's, which can hold a lone `--`.
function dukovo_start {
    if [ "$1" = b ]; then
        set slot_flags="${slot_b_flags}"
    else
        set slot_flags="${slot_a_flags}"
    fi
    multiboot2 ($system)/@system.$1/startup/radix $2 root=UUID=${dukovo_root} slot=$1 panic=10 $3${dukovo_console} ${slot_flags} ${dukovo_cmdline}
    module2 ($system)/@system.$1/startup/archive bootfs
    dukovo_modules
    boot
}

# What the Dukovo entry starts (State::starts): the update being tried,
# while it has tries left, and the default otherwise, told which update
# failed: it ran out of tries, or the health check gave them up.
if [ "${slot_default}" = b ]; then
    set slot_default_name="${slot_b_name}"
else
    set slot_default_name="${slot_a_name}"
fi
set slot_start="${slot_default}"
set slot_fallback=""
set slot_title="${slot_default_name}"
if [ -n "${slot_try}" ]; then
    if [ "${slot_try}" = b ]; then
        set slot_try_name="${slot_b_name}"
        set slot_try_version="${slot_b_version}"
    else
        set slot_try_name="${slot_a_name}"
        set slot_try_version="${slot_a_version}"
    fi
    if [ "${slot_tries}" = 0 ]; then
        set slot_fallback="fallback=${slot_try}"
        if [ -n "${slot_try_version}" ]; then
            set slot_title="${slot_default_name} (the update to ${slot_try_version} failed)"
        else
            set slot_title="${slot_default_name} (the update failed)"
        fi
    else
        set slot_start="${slot_try}"
        if [ "${slot_tries}" = 3 ]; then
            set slot_title="${slot_try_name} (update, first try)"
        elif [ "${slot_tries}" = 2 ]; then
            set slot_title="${slot_try_name} (update, second try)"
        else
            set slot_title="${slot_try_name} (update, last try)"
        fi
    fi
fi

# After a start that was not seen through, the menu shows, so that a
# machine that stopped on its way up can be started otherwise: for 10
# seconds, or the menu's timeout if longer, and for 1 where the timeout
# is 0, as in the boot tests. The Dukovo entry starts by itself after it.
if [ -n "${slot_boot}" ]; then
    set timeout_style=menu
    if [ "${dukovo_timeout}" -eq 0 ]; then
        set timeout=1
    elif [ "${dukovo_timeout}" -lt 10 ]; then
        set timeout=10
    else
        set timeout="${dukovo_timeout}"
    fi
fi

menuentry "${slot_title}" --id dukovo {
    if [ -f "${prefix}/grubenv" -a "${saved_entry}" != dukovo ]; then
        set saved_entry=dukovo
        save_env saved_entry
    fi
    slot_started
    dukovo_start "${slot_start}" "${slot_fallback}" quiet
}

# While an update is being tried, the version it updates, which leaves
# the update's tries as they are.
if [ -n "${slot_try}" -a "${slot_tries}" != 0 ]; then
    menuentry "${slot_default_name} (without the update)" --id dukovo-current {
        slot_chose "${slot_default}"
        dukovo_start "${slot_default}" "" quiet
    }
fi

# The version before the default, kept until the next update, which the
# default stays after.
if [ -n "${slot_previous}" -a "${slot_previous}" != "${slot_default}" ]; then
    if [ "${slot_previous}" = b ]; then
        set slot_previous_name="${slot_b_name}"
    else
        set slot_previous_name="${slot_a_name}"
    fi
    if [ -f "($system)/@system.${slot_previous}/startup/radix" ]; then
        menuentry "${slot_previous_name} (previous version)" --id dukovo-previous {
            slot_chose "${slot_previous}"
            dukovo_start "${slot_previous}" "" quiet
        }
    fi
fi

# Windows, when this computer has it: Windows Boot Manager on Windows'
# own EFI system partition, which GRUB starts as the firmware would, and
# Windows' boot files are left as they are. With Windows here the menu
# always shows, long enough to choose (ADR 0314), quiet boot or not. The
# entry chosen last, Dukovo or Windows, is chosen again.
if [ "${grub_platform}" = "efi" ]; then
    if search --no-floppy --file --set=windows /EFI/Microsoft/Boot/bootmgfw.efi; then
        set timeout_style=menu
        if [ "${timeout}" -lt 5 ]; then
            set timeout=5
        fi
        menuentry "Windows Boot Manager" --id windows {
            if [ -f "${prefix}/grubenv" -a "${saved_entry}" != windows ]; then
                set saved_entry=windows
                save_env saved_entry
            fi
            chainloader ($windows)/EFI/Microsoft/Boot/bootmgfw.efi
            boot
        }
    fi
fi

# For a lost administrator's password (ADR 0253), on the default slot,
# with the kernel's log. The flag comes first, so it is the kernel's
# whatever the command line holds after a lone `--`. It writes nothing.
menuentry "${slot_default_name}: startup trouble" --id startup-trouble {
    dukovo_start "${slot_default}" startup-trouble ""
}
