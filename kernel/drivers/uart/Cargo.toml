[package]
name = "radix-uart"
description = "16550-compatible serial ports for the Radix kernel: serial cards on PCI such as the ASIX AX99100's, Intel AMT's Serial-over-LAN port, and the registers that set any 16550's line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
radix-hw = { path = "../../lib/hw" }
# What a terminal's settings say of a serial line (ADR 0318).
radix-tty = { path = "../../lib/tty" }

[dev-dependencies]
radix-hw = { path = "../../lib/hw", features = ["fake"] }

[lints]
workspace = true
