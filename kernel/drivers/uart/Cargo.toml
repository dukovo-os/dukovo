[package]
name = "radix-uart"
description = "16550-compatible serial ports on PCI for the Radix kernel: serial cards such as the ASIX AX99100's, and Intel AMT's Serial-over-LAN port"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
radix-hw = { path = "../../lib/hw" }

[dev-dependencies]
radix-hw = { path = "../../lib/hw", features = ["fake"] }

[lints]
workspace = true
