[package]
name = "radix-usb"
description = "USB for the Radix kernel: speeds, the standard requests and the descriptors of USB 2.0 and 3.2's chapter 9, and the classes' own"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
radix-scsi = { path = "../scsi" }
# What a terminal's settings say of a serial line (ADR 0318).
radix-tty = { path = "../../lib/tty" }

[dev-dependencies]
proptest = { version = "1.7", default-features = false, features = ["std"] }

[lints]
workspace = true
