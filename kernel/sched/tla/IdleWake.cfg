\* `ob test tla` checks every property of the idle wake-up protocol with
\* two wakers, each queuing its thread or handing it over, for idle CPUs
\* that poll or not and sleep in MWAIT's states, HLT's, or any mix.
SPECIFICATION Spec

CONSTANTS
    Wakers = {w1, w2}
    None = None

INVARIANTS
    TypeOK
    NoLostWakeup
    InboxPending
    TakenUnwatched
    RequestHonoured
    OnePlace

PROPERTIES
    EventuallyTaken
    EveryThreadRuns
