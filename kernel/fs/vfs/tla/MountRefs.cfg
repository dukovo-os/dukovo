\* `ob test tla` checks how a mount's references are counted with the
\* unmounting thread and two others on two CPUs, each holding up to two
\* references, so references move between CPUs, are dropped on CPUs other
\* than made them, and are made and dropped while `U` adds them up.
SPECIFICATION Spec

CONSTANTS
    Threads = {u, t1, t2}
    U = u
    CPUs = {c1, c2}
    Wrap = 8
    Max = 2
    None = None

INVARIANTS
    TypeOK
    NoUseAfterFree
    UnmountSeesAll
    CountsRight
    ArcRight
    CleanLine
