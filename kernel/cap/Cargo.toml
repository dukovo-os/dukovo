[package]
name = "radix-cap"
description = "The Radix capability core: capability spaces, rights, badges, sealing, and the derivation tree with delegation and revocation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
# The store's locks (ADR 0369): the kernel's own mutexes, which the
# lock-order checker sees, and which spin on the host.
radix-sync = { path = "../lib/sync" }

[dev-dependencies]
# Host-side property tests (ADR 0019). Without default features it needs
# neither forking nor timeouts.
proptest = { version = "1.7", default-features = false, features = ["std"] }

[lints]
workspace = true
