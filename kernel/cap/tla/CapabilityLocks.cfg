\* `ob test tla` checks the store's locks with this configuration: two
\* threads, two spaces (s1 and s2 in one, s3 in the other), two objects
\* and derivations two deep. That is enough for a derive across spaces, a
\* move across spaces, and a revoke deleting a leaf in one space while a
\* fast path runs in the other. Deadlock checking is on: no thread may
\* wait for a lock forever. About 7.9 million distinct states, a minute and
\* a half on 4 CPUs.
SPECIFICATION Spec

CONSTANTS
    Slots = {s1, s2, s3}
    Low = {s1, s2}
    Objects = {o1, o2}
    Rights = {"copy"}
    MaxDepth = 2
    Threads = {t1, t2}
    None = None
    NoCap = NoCap

INVARIANTS
    TypeOK
    EmptySlotsAreBlank
    TreeWellFormed
    TreeIsDerivation
    RightsNeverWiden
    SameOrInnerObject
    ParentCovers
    OriginsAcyclic
    LinkedIsSound
    FastPathAlone
    LeafStays
    LockOrder

PROPERTIES
    CapsImmutable
    NoDerivationUnderRevoke
    RevokeIsComplete
    FastPathTouchesOnlyItsSlots
