\* `ob test tla` checks every property of an event queue's waits with two
\* waiters and two watches, one level-triggered and one with `clear`, each
\* changed twice, one call reporting one event at most, so that a call
\* leaves watches on the ring for the next, and a deleter that deletes
\* either watch.
SPECIFICATION Spec

CONSTANTS
    Watches = {w1, w2}
    Level = {w1}
    Waiters = {a, b}
    Changes = 2
    Capacity = 1

INVARIANTS
    TypeOK
    NoLostWakeup
    NoReportAfterDelete
    AtMostOnce
    RingMarked
    RoomExact

PROPERTIES
    EveryChangeLooked
