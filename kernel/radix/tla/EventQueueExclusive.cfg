\* `ob test tla` checks one description watched by two queues, each with an
\* exclusive watch, changed twice, with a thread waiting on either queue,
\* both or neither.
SPECIFICATION Spec

CONSTANTS
    Order <- TwoQueues
    Exclusive = {"q1", "q2"}
    Changes = 2
    Reports = 1

INVARIANTS
    TypeOK
    NoLostWakeup
    NoQueueAfterStop
    WalkQueues

PROPERTIES
    SomeThreadReports
