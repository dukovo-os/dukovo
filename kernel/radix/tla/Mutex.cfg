\* `ob test tla` checks the mutex with three threads that take it twice
\* each, one of them real-time, and a waiter handed the mutex after two
\* losses: spinners take it from woken waiters, real-time waiters get it
\* handed over, and fair ones after their losses.
SPECIFICATION Spec

CONSTANTS
    Threads = {t1, t2, t3}
    RealTime = {t3}
    Rounds = 2
    MaxLosses = 2
    None = None

INVARIANTS
    TypeOK
    MutualExclusion
    BitMeansWaiters
    SleepersAreQueued
    OwnerIsComing
    HandoffToRealTime
    BoundedLosses

PROPERTIES
    EveryRoundEnds
