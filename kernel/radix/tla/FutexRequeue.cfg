\* `ob test tla` checks futex requeues with three waiters in A's list, one
\* of which may be interrupted at any moment, a requeuer that wakes one and
\* moves up to two others to B, and a waker of B that wakes up to three.
\* Each moved waiter may be woken instead, for want of memory.
SPECIFICATION Spec

CONSTANTS
    Waiters = {a, b, c}
    StartB = {}
    WakersA = {}
    WakersB = {kb}
    Requeuers = {r}
    Count = 3
    Wakes = 1
    Move = 2
    Signalled = {b}

INVARIANTS
    TypeOK
    NoLostWakeup
    WakesCount
    AtMostOneList
    BucketIsCurrent

PROPERTIES
    EveryWaitEnds
