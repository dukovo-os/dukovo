\* `ob test tla` checks one description watched by three queues, the
\* first and the last exclusive and the one between not, changed twice,
\* with a thread on each queue that may wait.
SPECIFICATION Spec

CONSTANTS
    Order <- ThreeQueues
    Exclusive = {"q1", "q3"}
    Changes = 2
    Reports = 1

INVARIANTS
    TypeOK
    NoLostWakeup
    NoQueueAfterStop
    WalkQueues

PROPERTIES
    SomeThreadReports
