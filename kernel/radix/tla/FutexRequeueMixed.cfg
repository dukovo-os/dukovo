\* `ob test tla` checks futex requeues with a waiter already in B's list,
\* two in A's that may both be interrupted, a requeuer that moves up to
\* two to B, a waker of A and a waker of B.
SPECIFICATION Spec

CONSTANTS
    Waiters = {a, b, c}
    StartB = {c}
    WakersA = {ka}
    WakersB = {kb}
    Requeuers = {r}
    Count = 3
    Wakes = 0
    Move = 2
    Signalled = {a, b}

INVARIANTS
    TypeOK
    NoLostWakeup
    WakesCount
    AtMostOneList
    BucketIsCurrent

PROPERTIES
    EveryWaitEnds
