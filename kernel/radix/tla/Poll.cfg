\* `ob test tla` checks every property of poll's waits with two pollers and
\* two objects, each poller looking at one or both: a list may hold both
\* pollers, a change finds pollers on its own list only, and a poller that
\* looks at both may be told by both changers. A third poller makes some
\* four million states, too many for every pull request, and adds no case.
SPECIFICATION Spec

CONSTANTS
    Pollers = {p1, p2}
    Objects = {o1, o2}

INVARIANTS
    TypeOK
    NoLostWakeup
    Added
    OnlyListed

PROPERTIES
    EveryPollEnds
