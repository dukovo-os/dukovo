\* `ob test tla` checks a sequence-locked page with two writers that write
\* two snapshots each, three fields to a snapshot, and a reader that may
\* have to start again several times.
SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2}
    Rounds = 2
    Fields = 3

INVARIANTS
    TypeOK
    WholeSnapshot
    NotStale

PROPERTIES
    ReaderReturns
