# libxkbcommon (ADR 0712): the library that reads the XKB keyboard data
# (the xkeyboard-config port's) and turns key codes into characters, as
# every Wayland compositor and program does. windowd gives the programs
# their keyboard layout with it, through Smithay. Only the static library
# and its headers, in the sysroot: no X11 or Wayland helpers, no layout
# registry, no tools.
#
# It looks for the data in /system/resources/xkb, and before it in
# /system/settings/xkb, where a system's own layouts may be put.
#
# 1.13.1 is the last release Meson 1.3 builds, which is the Meson of the
# oldest build host (Ubuntu 24.04): 1.13.2 asks for Meson 1.4, and adds
# key names and a tool, with no fix in the library windowd needs.
name = "libxkbcommon"
version = "1.13.1"
summary = "the library that reads XKB keyboard layouts"
license = "MIT AND MIT-open-group AND HPND AND HPND-sell-variant AND LicenseRef-digital-equipment-corporation"
homepage = "https://xkbcommon.org"
depends = ["mlibc"]

[source]
git = "https://github.com/xkbcommon/libxkbcommon.git"
