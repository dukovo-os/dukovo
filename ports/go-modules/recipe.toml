# Go modules from Go's module proxy that programs in Go need and that do
# not build or work on Radix as they are (ADR 0600): each patched in
# patches/<path, / as _>@<version>.patch and installed into the toolchain,
# where Go for Radix (x86_64-radix-go, ob(1), PORTS) gives a program the
# patched module in place of the proxy's when its go.sum names that
# version. golang.org/x/sys and x/term take the place of every version a
# program names: they require no other module, and their code is newer.
# Any other module is patched at each version a program names.
name = "go-modules"
version = "1"
summary = "Go modules patched for Radix, for programs in Go"
license = "BSD-3-Clause AND MIT AND Apache-2.0"
homepage = "https://proxy.golang.org"
toolchain = true

