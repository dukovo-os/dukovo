;
; PHP-FPM's settings on Dukovo: /shared/services/net.php.php/php/conf/php-fpm.conf
; The php.ini PHP-FPM reads, for the pages it runs, is beside this file.
;
; After a change, check the settings, have PHP-FPM read them again, which
; drops no request in flight, and see what it said:
;
;     elevate php-fpm -t
;     elevate service php-fpm reload
;     elevate log php-fpm | tail
;
; Settings that do not read stop a reload: run the check first. An update
; of the bundle leaves a file you changed as it is and writes its own
; version beside it as php-fpm.conf.default. php-fpm(8) and
; https://www.php.net/manual/en/install.fpm.configuration.php say what
; each setting does; only those that differ from PHP-FPM's own, or that
; an administrator needs to see, are here.

[global]

; PHP-FPM's log goes to the system's: `log php-fpm` reads it.
error_log = /dev/stderr
log_level = notice

; PHP-FPM waits for requests with poll(2), the only way Dukovo has; saying
; so has its log name it.
events.mechanism = poll

; How long a reload lets a worker finish the request it is running.
process_control_timeout = 10s

[www]

; The account the pool's workers run as. The service runs as it already,
; and PHP-FPM then says it ignores these; the check, `elevate php-fpm -t`,
; runs as root, which PHP-FPM does not accept a pool with no user for.
user = php
group = php

; Where nginx and other web servers on this computer pass pages: any
; program on this computer may connect, as with any FastCGI server on
; TCP. A Unix socket, which only the web server's account could reach,
; will replace this when bundles can have them between each other.
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

; Workers are started as pages come, from 2 up to 8, and each ends after
; 500 requests, which keeps a leak in a page from growing. A worker may use
; up to php.ini's memory_limit, 128M, so 8 of them can reach the service's
; limit of 1G, though most pages use far less. Raise the service's memory
; limit when you raise pm.max_children or memory_limit.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; What pages print to their standard error output, and PHP's errors, go
; to the log as they are.
catch_workers_output = yes
decorate_workers_output = no

; Sessions and uploads are kept in the service's data folder, which the
; account php owns.
php_admin_value[session.save_path] = /shared/services/net.php.php/php/sessions
php_admin_value[upload_tmp_dir] = /shared/services/net.php.php/php/temp
php_admin_value[sys_temp_dir] = /shared/services/net.php.php/php/temp
