# iperf3 (ADR 0342): measures how fast TCP and UDP go between two
# machines, one running `iperf3 -s` and the other `iperf3 -c`. ESnet's
# and Lawrence Berkeley National Laboratory's code is BSD-3-Clause, with
# what it keeps from others: Dave Gamble's cJSON (MIT), Russ Cox's
# net.c (MIT) with parts of Rob Pike's, Sape Mullender's and his library
# for Lucent, under the notice SPDX names dtoa, Eric Jackson's net.c and
# Berkeley's queue.h (BSD-3-Clause), the University of Illinois's units.c
# from the first iperf (NCSA), and Mathias Panzenböck's
# portable_endian.h, in the public domain. Its LICENSE holds them all. It
# is built without OpenSSL, which only its sign-in with a password needs.
name = "iperf3"
version = "3.19.1"
summary = "iperf3, which measures the network's throughput"
license = "BSD-3-Clause AND MIT AND NCSA AND dtoa AND LicenseRef-iperf3-public-domain"
homepage = "https://software.es.net/iperf/"
depends = ["mlibc"]
image = ["system/commands/iperf3", "system/resources/man/man1/iperf3.1"]

[source]
url = "https://github.com/esnet/iperf/releases/download/3.19.1/iperf-3.19.1.tar.gz"
sha256 = "dc63f89ec581ea99f8b558d8eb35109de06383010db5a1906c208a562ba0c270"
