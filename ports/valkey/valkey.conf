#
# Valkey's settings on Dukovo: /shared/services/io.valkey.valkey/valkey/conf/valkey.conf
#
# After a change, restart Valkey, which saves its data as it stops, and
# see what it said:
#
#     elevate service valkey restart
#     elevate log valkey | tail
#
# `valkey-cli config set` changes a setting while Valkey runs, and
# `valkey-cli config rewrite` writes it here. An update of the bundle
# leaves a file you changed as it is and writes its own version beside
# it as valkey.conf.default. Every setting, with Valkey's own words on
# each, is in /applications/io.valkey.valkey/doc/valkey.conf.

# Clients on this machine alone. To serve others, name the addresses to
# listen on, and give the default user a password or set up users first
# (requirepass, or aclfile and ACL SETUSER): protected mode refuses
# clients from elsewhere while the default user has none.
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# In the foreground, as Spark's services are; its log on its standard
# output, which goes to the system's: `log valkey` reads it.
daemonize no
supervised no
logfile ""
loglevel notice

# Its data, in its data folder: snapshots of the whole store, taken after
# an hour if a key changed, five minutes if 100 did and a minute if 10,000
# did, and when it stops.
dir /shared/services/io.valkey.valkey/valkey/data
dbfilename dump.rdb
save 3600 1 300 100 60 10000

# The append-only file logs every write, so that a crash loses a second
# of writes at most rather than those since the last snapshot. Turn it on
# for data you keep; it uses more disk.
appendonly no
appenddirname appendonly
appendfsync everysec

# A cap on the memory its data uses, and what goes when it is reached:
# with none, it grows until the machine has no more. For a cache, set a
# cap and allkeys-lru.
# maxmemory 256mb
# maxmemory-policy noeviction

# TLS, with a certificate and key the account valkey reads, in place of
# plain TCP on the same port:
# port 0
# tls-port 6379
# tls-cert-file /shared/services/io.valkey.valkey/valkey/conf/cert.pem
# tls-key-file /shared/services/io.valkey.valkey/valkey/conf/key.pem
# tls-auth-clients no
