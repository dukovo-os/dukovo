# the Unicode character data built into it is under Unicode's license.
# The pin is a commit of master after 1.52.0, for fixes of memory-safety
# flaws that no release holds yet: its version is the CMake project's,
# 1.53.0, with the commit's date. It moves to the 1.53.0 release once that
# is tagged.
