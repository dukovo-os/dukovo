#
# Which accounts may connect as which roles, for the lines of pg_hba.conf
# that name a map (ADR 0522). The service's script copies this file into
# the cluster when it makes it, and the server reads the copy:
# /shared/services/org.postgresql.postgresql/postgres/data/pg_ident.conf.
# After a change, ask the server to read it again:
#
#     elevate service reload postgresql

# MAPNAME        SYSTEM-USERNAME   DATABASE-USERNAME

# Root is an administrator inside elevate (elevate(8)); the account
# postgres is the service's own, which runs the hooks around a backup.
administrators   root              postgres
administrators   postgres          postgres
