#
# Who may connect to PostgreSQL on Dukovo, and how each proves who it is
# (ADR 0522). The service's script copies this file into the cluster when
# it makes it, and the server reads the copy:
# /shared/services/org.postgresql.postgresql/postgres/data/pg_hba.conf.
# An update of the bundle leaves that copy as it is. After a change, ask
# the server to read it again:
#
#     elevate service reload postgresql
#
# A line says which connections it is for, by TYPE, DATABASE, USER and
# ADDRESS, and how they prove themselves, by METHOD; the first line that
# fits a connection decides it. PostgreSQL's own words on every setting
# are in its documentation, "Client Authentication".
#
# "peer" takes the account that connects, which the kernel tells the
# server, as the role of the same name. "map=administrators" has the
# accounts that pg_ident.conf maps to the role instead.

# TYPE  DATABASE     USER      ADDRESS         METHOD

# The superuser, on the socket in the service's live folder: root, which
# is who elevate runs a command as, and the account postgres, which runs
# the service and the hooks around a backup. No password is set or asked.
local   all          postgres                  peer map=administrators

# Every other account, on the socket, is the role of its own name, made
# with createuser: a person runs psql as themselves.
local   all          all                       peer

# Programs on this machine over TCP, which have no account to prove, with
# the role's password; SCRAM-SHA-256 sends none that could be replayed. The
# server listens on localhost only (listen_addresses).
host    all          all       127.0.0.1/32    scram-sha-256
host    all          all       ::1/128         scram-sha-256

# Replication, for pg_basebackup and a standby: the same as above.
local   replication  postgres                  peer map=administrators
host    replication  all       127.0.0.1/32    scram-sha-256
host    replication  all       ::1/128         scram-sha-256
