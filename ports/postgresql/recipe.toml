# PostgreSQL, the relational database server, with its client and
# administration programs, its contrib modules and its test suites: a
# bundle of the Dukovo catalog, not of the image (ADRs 0370, 0521 and
# 0522). Its service, postgresql, runs the server as the account postgres
# once an administrator enables it. The server loads its modules (PL/pgSQL,
# the encoding conversions, the Snowball dictionaries and the contrib
# modules) with dlopen, so its programs are linked dynamically (ADR 0071)
# and the modules are shared libraries in lib/postgresql. The time zones
# are the system's, read from /system/resources/zoneinfo when the programs
# run: tzdata is not built against, so it is not in depends.
name = "postgresql"
version = "19.0-rc.2"
summary = "the PostgreSQL database server and its client programs"
# PostgreSQL's code is under the PostgreSQL License. What its tree has from
# others: Henry Spencer's regular expression package, with parts under
# Tcl's license (src/backend/regex/COPYRIGHT), the notices of Philip
# Warner on pg_dump's archiver and of Darrell Whitley on the genetic
# query optimizer's recombination operators, the Internet Software
# Consortium's and OpenBSD's ISC-licensed files (inet_net_pton.c,
# inet_cidr_ntop.c, inet_net_ntop.c, strlcat.c, timingsafe_bcmp.c), the
# BSD-licensed files of the University of California, NetBSD and
# FreeBSD (snprintf, getopt, the SHA and MD5 code, strftime, sorting),
# Ulf Adams' Ryu, which prints floating point numbers, from a file that
# offers the Apache License 2.0 or the Boost Software License and which
# PostgreSQL takes under the second, the Snowball stemmers (BSD-3-Clause),
# pgcrypto's files by Marko Kreen (BSD-2-Clause) and David Burren
# (BSD-3-Clause) and Solar Designer's crypt_blowfish, the IANA's time zone
# code that src/timezone has, and the double metaphone code of
# fuzzystrmatch, which is under the terms of Perl itself: the Artistic
# License or the GPL.
# Linked in from other ports: OpenSSL (Apache-2.0), zlib, lz4 (its
# library, BSD-2-Clause), zstd, libxml2 (MIT), libedit and ncurses, each
# under what its own port says. A few files, among them Bob Jenkins'
# hash functions and Drepper's SHA-crypt, are in the public domain and ask
# for no notice.
license = "PostgreSQL AND Spencer-99 AND TCL AND LicenseRef-pg-dump-Warner AND LicenseRef-geqo-Whitley AND ISC AND BSD-2-Clause AND BSD-3-Clause AND BSL-1.0 AND LicenseRef-crypt-blowfish-public-domain AND LicenseRef-tz-public-domain AND (Artistic-1.0-Perl OR GPL-1.0-or-later)"
homepage = "https://www.postgresql.org"
depends = ["mlibc", "openssl", "zlib", "lz4", "zstd", "libxml2", "libedit", "ncurses"]
# The tree's COPYRIGHT, the file of the regular expression package that
# names Spencer's and Tcl's terms, and the two files whose headers carry
# the terms of others in full: Ryu's and the double metaphone's.
notices = [
	"COPYRIGHT",
	"src/backend/regex/COPYRIGHT",
	"src/common/d2s.c",
	"contrib/fuzzystrmatch/dmetaphone.c",
]

# From git, as ftp.postgresql.org and postgresql.org, which serve
# PostgreSQL's release archives, are not reachable from the build
# machines; a tree from git has no generated parsers or catalogs, which
# bison, flex and Perl, which the build machine has, write (see
# build.sh). This is the release candidate REL_19_RC2, so the bundle's
# version is the pre-release 19.0-rc.2, which a catalog orders before
# 19.0, until the pin moves to REL_19_0, planned for 2026-11-19; the tag
# is a lightweight one, so this is its commit.
[source]
git = "https://github.com/postgres/postgres.git"
commit = "dffcca2e3c81178c64d4c1f44543a3507d0b7508"
tag = "REL_19_RC2"

[bundle]
id = "org.postgresql.postgresql"
name = "PostgreSQL"
commands = [
	"clusterdb",
	"createdb",
	"createuser",
	"dropdb",
	"dropuser",
	"initdb",
	"oid2name",
	"pg_amcheck",
	"pg_archivecleanup",
	"pg_basebackup",
	"pg_checksums",
	"pg_combinebackup",
	"pg_config",
	"pg_controldata",
	"pg_createsubscriber",
	"pg_ctl",
	"pg_dump",
	"pg_dumpall",
	"pg_isready",
	"pg_receivewal",
	"pg_recvlogical",
	"pg_resetwal",
	"pg_restore",
	"pg_rewind",
	"pg_test_fsync",
	"pg_test_timing",
	"pg_upgrade",
	"pg_verifybackup",
	"pg_waldump",
	"pg_walsummary",
	"pgbench",
	"postgres",
	"psql",
	"reindexdb",
	"vacuumdb",
	"vacuumlo",
]
# pg_isready and psql, which the service's health check and its backup hook
# run, are commands above, and so programs of the manifest.
programs = ["postgresql-service"]
links = ["mlibc", "openssl", "zlib", "lz4", "zstd", "libxml2", "libedit", "ncurses"]

# postgresql-service makes the cluster at its first start and runs the
# server in the foreground, as Spark's service (ADR 0522).
# - It is ready once pg_isready says the server takes connections, which
#   also holds with every connection in use. Spark checks such a service
#   as it starts and each second until a check passes, so it is ready
#   about a second after the server is, not a check interval later. The
#   ready time is the longest allowed, 3600 seconds: a start after a crash
#   replays the log first, with pg_isready failing meanwhile, and must not
#   be ended half way (the upstream unit has TimeoutSec=infinity).
# - It names no health socket. The server's is .s.PGSQL.5432, which a
#   name in a manifest cannot be (it starts with a letter or a digit), and
#   a socket named in health must be one the service provides to others,
#   which waits for the sockets a bundle offers (docs/deferred.md). After
#   an update, bundled therefore asks Spark: the new version must be
#   running with its last pg_isready passed, within 60 seconds, or the
#   version before comes back with its data (ADR 0386, 0522). Started
#   after a clean stop the server takes connections in a few seconds.
# - It stops on SIGINT, the fast shutdown that ends the sessions, rolls
#   back what they had open and writes a checkpoint; SIGTERM, which the
#   other services stop on, would wait for every client to leave. The
#   checkpoint writes every changed buffer, which can take minutes, so it
#   has 300 seconds in place of 5 (PostgreSQL's own unit says
#   TimeoutSec=infinity, and Debian's gives an hour).
# - Before a backup it checkpoints, so that the snapshot of /shared holds
#   the cluster a moment after one and a restored copy starts with a short
#   recovery.
# - No memory limit: the database is the machine's main tenant and sizes
#   its own memory, and an administrator who wants a limit sets one in an
#   override file.
[[bundle.services]]
name = "postgresql"
program = "postgresql-service"
account = "postgres"
restart = "on-failure"
start = "when-enabled"
ready = { when = "healthy", timeout = 3600 }
health = { command = { program = "pg_isready", arguments = ["-q"], every = 30, timeout = 10, failures = 3 } }
stop = { signal = "SIGINT", timeout = 300 }
backup = { before = { program = "psql", arguments = ["-X", "-q", "-c", "CHECKPOINT"] } }

[bundle.permissions."network.listen"]
ports = [5432]
need = "required"
why = "Takes connections from programs on this computer, and from other machines once an administrator allows them"

[bundle.permissions."network.outbound"]
need = "optional"
why = "Lets the database reach other database servers: postgres_fdw, dblink and replication"

# The cluster, with the settings it keeps in its folder (postgresql.conf,
# pg_hba.conf), is the account's data folder's.
[bundle.data]
settings = true
data = true
