#
# nginx's settings on Dukovo: /shared/services/org.nginx.nginx/nginx/conf/nginx.conf
#
# After a change, check them, have nginx read them again, which drops
# no request, and see what it said:
#
#     elevate nginx -t
#     elevate service nginx reload
#     elevate log nginx | tail
#
# Settings that do not read leave nginx running as it was, and its log
# names the line that is wrong.
#
# An update of the bundle leaves a file you changed as it is and writes
# its own version beside it as nginx.conf.default. nginx(8) and
# https://nginx.org/en/docs/ say what each setting does.

worker_processes auto;

# Each worker may have up to 4096 files and connections open.
worker_rlimit_nofile 4096;

# nginx's log goes to the system's: `log nginx` reads it.
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # A line for each request, in the system's log too.
    access_log stderr;

    keepalive_timeout 65;
    gzip on;

    # The sites in /shared/www, which the account nginx reads, over
    # HTTP. Until /shared/www has an index file, it shows nginx's welcome
    # page.
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /shared/www;
        index index.html index.htm index.php;

        # The answers to a certificate authority's check of a name, which
        # certd(8) puts in a folder while it gets a certificate (ADR
        # 0513): see acme-challenge.conf.
        include acme-challenge.conf;

        # The front page: the site's index file, or nginx's welcome page
        # while /shared/www has none (the index module answers 403 then).
        location = / {
            error_page 403 = @welcome;
        }

        # PHP pages. Until PHP is set up here none is served, so a PHP
        # file's code is never sent as text. To pass them to PHP-FPM
        # (the bundle net.php.php, service php-fpm), put a # before
        # `return 404;` and remove the # signs of the lines after it.
        location ~ \.php$ {
            return 404;
            #try_files $uri =404;
            #fastcgi_pass 127.0.0.1:9000;
            #include fastcgi.conf;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location @welcome {
            root /applications/org.nginx.nginx/html;
            try_files /index.html =404;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /applications/org.nginx.nginx/html;
        }
    }

    # The same sites over HTTPS, with the machine's own certificate, which
    # certd(8) makes and keeps. Name it in nginx's service file, remove
    # the # signs below, and restart nginx (a certificate that changes
    # later is read again without a restart):
    #
    #     elevate service edit nginx      # add certificates = ["this-machine"]
    #     elevate service nginx restart
    #
    # A certificate from Let's Encrypt or another ACME authority goes in
    # with `elevate cert get NAME --name example.com`, and one you have
    # from elsewhere with `elevate cert add NAME --chain FILE --key FILE`;
    # name it in the service file instead of this-machine, and in
    # ssl_certificate and ssl_certificate_key below. For `cert get` to answer
    # the authority while nginx holds port 80, nginx's service file reads
    # /system/live/certd, as acme-challenge.conf says.
    # `cert list` shows what there is, and cert(8) the rest.
    #
    #server {
    #    listen 443 ssl;
    #    listen [::]:443 ssl;
    #    http2 on;
    #    server_name _;
    #
    #    ssl_certificate /system/live/spark/certificates/nginx/this-machine/fullchain.pem;
    #    ssl_certificate_key /system/live/spark/certificates/nginx/this-machine/key.pem;
    #
    #    root /shared/www;
    #    index index.html index.htm index.php;
    #
    #    include acme-challenge.conf;
    #
    #    location = / {
    #        error_page 403 = @welcome;
    #    }
    #
    #    location ~ \.php$ {
    #        return 404;
    #        #try_files $uri =404;
    #        #fastcgi_pass 127.0.0.1:9000;
    #        #include fastcgi.conf;
    #    }
    #
    #    location / {
    #        try_files $uri $uri/ =404;
    #    }
    #
    #    location @welcome {
    #        root /applications/org.nginx.nginx/html;
    #        try_files /index.html =404;
    #    }
    #}
}
