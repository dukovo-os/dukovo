#
# nginx's settings on Dukovo: /shared/services/org.nginx.nginx/nginx/conf/nginx.conf
#
# After a change, check them, have nginx read them again, which drops
# no request, and see what it said:
#
#     elevate nginx -t
#     elevate service nginx reload
#     elevate log nginx | tail
#
# Settings that do not read leave nginx running as it was, and its log
# names the line that is wrong.
#
# An update of the bundle leaves a file you changed as it is and writes
# its own version beside it as nginx.conf.default. nginx(8) and
# https://nginx.org/en/docs/ say what each setting does.

worker_processes auto;

# Each worker may have up to 4096 files and connections open.
worker_rlimit_nofile 4096;

# nginx's log goes to the system's: `log nginx` reads it.
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # A line for each request, in the system's log too.
    access_log stderr;

    keepalive_timeout 65;
    gzip on;

    # The sites in /shared/www, which the account nginx reads, over
    # HTTP. Until /shared/www has an index.html, it shows nginx's welcome
    # page.
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /shared/www;
        index index.html index.htm;

        location = / {
            try_files /index.html /index.htm @welcome;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location @welcome {
            root /applications/org.nginx.nginx/html;
            try_files /index.html =404;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /applications/org.nginx.nginx/html;
        }
    }

    # The same sites over HTTPS. Put the certificate and its key beside
    # this file, readable by the account nginx, and remove the # signs.
    # For a test, a certificate of its own:
    #
    #     conf=/shared/services/org.nginx.nginx/nginx/conf
    #     elevate openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 \
    #         -nodes -days 365 -subj /CN=$(hostname) \
    #         -keyout $conf/key.pem -out $conf/cert.pem
    #     elevate chown nginx:nginx $conf/key.pem $conf/cert.pem
    #
    #server {
    #    listen 443 ssl;
    #    listen [::]:443 ssl;
    #    http2 on;
    #    server_name _;
    #
    #    ssl_certificate cert.pem;
    #    ssl_certificate_key key.pem;
    #
    #    root /shared/www;
    #    index index.html index.htm;
    #
    #    location / {
    #        try_files $uri $uri/ =404;
    #    }
    #}
}
