#
# The answers to an ACME authority's check of a name (ADR 0513). When
# `cert get` or certd gets or renews a certificate for a site and nginx
# holds port 80, it writes the answer to the authority's check into a file
# of /system/live/certd/acme-challenge, and the authority asks for it at
# http://NAME/.well-known/acme-challenge/TOKEN, which this serves for every
# site that includes it, then certd takes the file away.
#
# nginx's service file has to let nginx read the folder; add it once, and
# restart nginx:
#
#     elevate service edit nginx      # add files.read = ["/system/live/certd"]
#     elevate service nginx restart
#
# Each server block that answers for a name an authority checks includes
# this file; the default server in nginx.conf does, and a site's does the
# same: `include acme-challenge.conf;`.

location ^~ /.well-known/acme-challenge/ {
    alias /system/live/certd/acme-challenge/;
    default_type application/octet-stream;
}
