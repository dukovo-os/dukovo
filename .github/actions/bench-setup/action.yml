# Readies a runner for `./ob bench`: KVM for QEMU, the host packages, the
# caches of GRUB, Rust, the built ports and the pinned Linux baseline.
# bench.yml's two jobs share it, so that the run of the gate on a second
# runner (ADR 0559) measures what the first one did, set up the same way.

name: Ready a runner for the benchmarks
description: KVM, the host packages and the caches ./ob bench needs
inputs:
  ports-key:
    description: The ports cache ci.yml's ports job left for the run (ADR 0560); empty for the nightly run
    default: ""
  ports-prefix:
    description: The start of the ports cache keys to fall back on
    default: ""
  std-stamp:
    description: The rust-std port's stamp, which keys the Rust cache (ADR 0560)
    default: ""
runs:
  using: composite
  steps:
    - name: Allow QEMU to use KVM
      shell: bash
      run: |
        if [ -e /dev/kvm ]; then
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        fi

    - name: Install host packages
      uses: ./.github/actions/apt-install
      with:
        packages: >-
          qemu-system-x86 ovmf gcc flex gawk
          xorriso mtools dosfstools exfatprogs sleuthkit btrfs-progs e2fsprogs ntfs-3g dislocker libbde-utils scdoc mandoc
          udftools udfclient genisoimage
          clang-20 lld-20 llvm-20 libclang-rt-20-dev meson ninja-build cmake bison pkgconf autoconf zlib1g-dev

    # GRUB, which ./ob builds from its pinned source for the images
    # (ADR 0306): built once for each change to its recipe.
    - name: Cache GRUB
      uses: actions/cache@v4
      with:
        path: .cache/grub
        key: grub-${{ hashFiles('tools/xtask/src/grub.rs') }}

    - name: Install the pinned Rust toolchain
      shell: bash
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ". -> target"
        key: ${{ inputs.std-stamp && format('std-{0}', inputs.std-stamp) || '' }}

    - name: Note the port toolchain's version
      id: ports-key
      shell: bash
      run: echo "clang=$(clang-20 --version | head -n1 | tr -c 'A-Za-z0-9.\n' -)" >> "$GITHUB_OUTPUT"

    # The ports as ci.yml's ports job left them, or, in the nightly run,
    # the newest that main saved: ./ob bench builds whatever they lack.
    - name: Restore the built ports
      uses: actions/cache/restore@v4
      with:
        path: |
          out/sysroot
          out/toolchain
          out/ports
          target/ports/sources
        key: ${{ inputs.ports-key || format('ports-host-{0}-', steps.ports-key.outputs.clang) }}
        restore-keys: ${{ inputs.ports-prefix || format('ports-host-{0}-', steps.ports-key.outputs.clang) }}

    # The baseline Radix is held to is Linux in the same kind of virtual
    # machine (ADR 0039): one release of Ubuntu's kernel, pinned in
    # tools/xtask/src/baseline.rs (ADR 0290), not the runner's own, so
    # that an update of the runners' kernel cannot move the bar. Its
    # packages are kept between runs.
    - name: Restore the Linux baseline's packages
      uses: actions/cache@v4
      with:
        path: .cache/linux-baseline/*.deb
        key: linux-baseline-${{ hashFiles('tools/xtask/src/baseline.rs') }}

    # The Linux desktop the desktop's rows are measured beside (ADR
    # 0724): Ubuntu's packages, pinned in
    # tools/xtask/src/linux_desktop.pins, kept between runs.
    - name: Restore the Linux desktop's packages
      uses: actions/cache@v4
      with:
        path: .cache/linux-desktop/debs/*.deb
        key: linux-desktop-${{ hashFiles('tools/xtask/src/linux_desktop.pins') }}
