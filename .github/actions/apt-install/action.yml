# Installs Ubuntu packages on a GitHub runner, for every CI job that needs
# some.
#
# The runner's own mirror, azure.archive.ubuntu.com, is now and then so
# slow that a download of under a minute takes an hour: on 2026-11-06 it
# sent a boot job's 77 MB at 22 kB/s, for 59 minutes. apt only moves on
# from a mirror that fails, not from one that is slow, so the download
# gets 90 seconds there, against the 30 or less it takes from a mirror
# that is well. Past that, it starts again from Ubuntu's own
# archive.ubuntu.com, keeping the files it already has, and if that does
# not answer either, from kernel.org's mirror of it, over HTTPS: on
# 2026-11-11 the runners reached neither of Ubuntu's own for hours, while
# HTTPS to other hosts worked. Only then does dpkg install them, so a
# download that is cut off never leaves a package half installed. apt
# checks every mirror's files against Ubuntu's signing keys, so a mirror
# can only fail to give them, not change them.
#
# Troubleshooting: "The runner's Ubuntu mirror was slow" in a job's
# warnings means the second download ran, and "Ubuntu's archive did not
# answer" the third; a job that still fails here has all three mirrors
# failing, and a rerun is the fix.

name: Install Ubuntu packages
description: apt-get install, moving to archive.ubuntu.com when the runner's mirror is slow, then to kernel.org's mirror of it
inputs:
  packages:
    description: The packages, separated by spaces or new lines
    required: true
runs:
  using: composite
  steps:
    - name: apt-get install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        # A connection that sends nothing for 30 seconds is retried, three
        # times, before apt calls the mirror failed.
        apt=(sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3
             -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        # Unquoted on purpose: one word per package.
        # shellcheck disable=SC2086
        download() {
          timeout 120 "${apt[@]}" update &&
            timeout "$1" "${apt[@]}" install -y --no-install-recommends --download-only $PACKAGES
        }
        if ! download 90; then
          echo "::warning::The runner's Ubuntu mirror was slow; downloading from archive.ubuntu.com instead"
          # The mirror list where the runner has one, and the sources.
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources /etc/apt/sources.list \
            2>/dev/null || true
          if ! download 1200; then
            echo "::warning::Ubuntu's archive did not answer; downloading from mirrors.edge.kernel.org instead"
            # Every Ubuntu host, the security archive's too, over HTTP or
            # HTTPS, becomes kernel.org's mirror over HTTPS.
            sudo sed -i 's#https\?://[a-z.]*ubuntu\.com/ubuntu#https://mirrors.edge.kernel.org/ubuntu#g' \
              /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources /etc/apt/sources.list \
              2>/dev/null || true
            download 1200
          fi
        fi
        # shellcheck disable=SC2086
        "${apt[@]}" install -y --no-install-recommends $PACKAGES
