# The backport bot (ADR 0534). A merged pull request labelled `backport` is
# cherry-picked onto the newest release branch, and one labelled
# `backport-previous` onto the one before it, for a Critical or High fix.
# The bot pushes `backport/<number>-to-<X.Y>`, opens a pull request to the
# release branch, and starts CI on it with a dispatch of ci.yml, since a
# push by this workflow's own token starts no workflow. On a conflict it
# labels the original `backport-conflict` and writes the commands to do it
# by hand in the job summary.
#
# This runs on `pull_request_target`, with write access, so it never
# checks out or runs the pull request's code: it works in a checkout of
# the default branch and cherry-picks the commit the merge made on it. The
# pull request's title is text from outside and is never part of a script
# or a command line. The logic is in .github/scripts/backport.js, which CI
# tests against real repositories.
name: Backport

on:
  pull_request_target:
    types: [closed, labeled]

permissions: {}

concurrency:
  group: backport-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  backport:
    name: Backport
    if: >-
      github.event.pull_request.merged == true
      && (github.event.action == 'closed'
        || github.event.label.name == 'backport'
        || github.event.label.name == 'backport-previous')
      && (contains(github.event.pull_request.labels.*.name, 'backport')
        || contains(github.event.pull_request.labels.*.name, 'backport-previous'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Push the backport branch.
      contents: write
      # Open the backport's pull request.
      pull-requests: write
      # Label and comment on the original pull request.
      issues: write
      # Start CI on the backport branch.
      actions: write
    steps:
      # The default branch, trusted. The full history is needed: a
      # cherry-pick merges against the commits around the one it takes.
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Backport
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { run } = require('./.github/scripts/backport.js');
            await run({ github, context, core });
