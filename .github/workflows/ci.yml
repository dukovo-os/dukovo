# Every step is an ./ob command, so anything CI does can be run locally the
# same way. See CONTRIBUTING.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Every boot test, and every other job, on main each night (ADR 0421):
  # pull requests run only the boot tests their changes reach.
  schedule:
    - cron: "11 3 * * *"

permissions:
  contents: read

# A pull request's new push cancels its run before. Main's runs are not
# cancelled: each runs every boot test (ADR 0421), so a merge waits for
# the run before it rather than ending it, and only the newest of those
# waiting is kept, as it holds the others' changes. Merges never wait
# for main's run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in step with tools/container/Containerfile and tools/xtask/src/doctor.rs,
  # as the host packages below are (Clang 20 is ports::CLANG_MIN).
  MDBOOK_VERSION: 0.4.52
  # Keep in step with tools/xtask/src/doctor.rs (ADR 0019).
  KANI_VERSION: 0.68.0
  # Keep in step with tools/xtask/src/tla.rs (ADR 0024).
  TLA_VERSION: 1.7.4

jobs:
  build:
    name: Lint, build, docs and image
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Allow QEMU to use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Install host packages
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            qemu-system-x86 ovmf gcc flex gawk
            xorriso mtools dosfstools exfatprogs gdisk fdisk sleuthkit btrfs-progs e2fsprogs ntfs-3g dislocker libbde-utils openssh-server samba smbclient scdoc mandoc
            udftools udfclient genisoimage qemu-system-misc qemu-utils
            clang-20 lld-20 llvm-20 libclang-rt-20-dev meson ninja-build cmake bison pkgconf autoconf

      # GRUB, which ./ob builds from its pinned source for the images
      # (ADR 0306): built once for each change to its recipe.
      - name: Cache GRUB
        uses: actions/cache@v4
        with:
          path: .cache/grub
          key: grub-${{ hashFiles('tools/xtask/src/grub.rs') }}

      - name: Install mdBook
        run: |
          # GitHub's release downloads sometimes answer 504 for a while;
          # build the same pinned version from crates.io when they do.
          if ! curl --proto '=https' --tlsv1.2 -sSfL --retry 3 --retry-all-errors --retry-delay 10 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin mdbook; then
            cargo install mdbook --version "${MDBOOK_VERSION}" --locked --root "$RUNNER_TEMP/mdbook"
            sudo install "$RUNNER_TEMP/mdbook/bin/mdbook" /usr/local/bin/mdbook
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # The ports' builds come from main's last run, so a pull request
      # rebuilds only the ports its changes reach: ob's stamps decide, as
      # they do in a local tree. Main always builds them from scratch, and
      # saves them for the pull requests after it. The cache holds every
      # folder a port installs into: out/toolchain too, where Rust's
      # standard library, the patched crates and the C++ headers go, or a
      # stamp would call a port built whose files are missing.
      - name: Note the port toolchain's version
        id: ports-key
        run: echo "clang=$(clang-20 --version | head -n1 | tr -c 'A-Za-z0-9.\n' -)" >> "$GITHUB_OUTPUT"

      - name: Restore the built ports
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/ports/sources
          key: ports-host-${{ steps.ports-key.outputs.clang }}-${{ hashFiles('ports/**', 'abi/**', 'tools/**', 'rust-toolchain.toml') }}
          restore-keys: ports-host-${{ steps.ports-key.outputs.clang }}-

      - name: ./ob setup
        run: ./ob setup

      - name: ./ob lint
        run: ./ob lint

      - name: ./ob test riscv
        run: ./ob test riscv

      - name: ./ob docs --check
        run: ./ob docs --check

      - name: ./ob docs site --check
        run: ./ob docs site --check

      - name: ./ob image
        run: ./ob image

      - name: Save the built ports
        if: github.event_name == 'push' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/ports/sources
          key: ports-host-${{ steps.ports-key.outputs.clang }}-${{ hashFiles('ports/**', 'abi/**', 'tools/**', 'rust-toolchain.toml') }}

      # `ob image` already refuses components outside their area's
      # allow-list; this checks the SPDX document itself (ADR 0021).
      - name: Validate the license manifest
        run: |
          python3 -m venv "$RUNNER_TEMP/spdx"
          "$RUNNER_TEMP/spdx/bin/pip" install --quiet spdx-tools==0.8.3
          "$RUNNER_TEMP/spdx/bin/pyspdxtools" -i out/dukovo-*-x86_64.spdx

      - name: Upload the boot image
        uses: actions/upload-artifact@v4
        with:
          name: dukovo-image
          path: |
            out/dukovo-*-x86_64.img
            out/dukovo-*-x86_64.spdx
          retention-days: 14

      # The smbd boot test's image, its command line in place, which the
      # Windows file sharing job boots.
      - name: ./ob test boot --case smbd --image-only
        run: ./ob test boot --case smbd --image-only

      - name: Upload the smbd test image
        uses: actions/upload-artifact@v4
        with:
          name: smbd-image
          path: out/test/smbd.img
          retention-days: 3

      # The cloud image, whose VMDK the VirtualBox job boots (ADR 0329).
      - name: ./ob image --cloud
        if: needs.scope.outputs.virtualbox == 'true'
        run: ./ob image --cloud

      - name: Upload the cloud image's VMDK
        if: needs.scope.outputs.virtualbox == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-vmdk
          path: out/dukovo-*-x86_64-cloud.vmdk
          if-no-files-found: error
          retention-days: 3

  # A pull request that changes only documentation runs this job in place
  # of the build job above: the same doc checks, without building the
  # system or its image.
  docs:
    name: Docs
    needs: scope
    if: needs.scope.outputs.code == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host packages
        uses: ./.github/actions/apt-install
        with:
          packages: scdoc mandoc

      - name: Install mdBook
        run: |
          # GitHub's release downloads sometimes answer 504 for a while;
          # build the same pinned version from crates.io when they do.
          if ! curl --proto '=https' --tlsv1.2 -sSfL --retry 3 --retry-all-errors --retry-delay 10 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin mdbook; then
            cargo install mdbook --version "${MDBOOK_VERSION}" --locked --root "$RUNNER_TEMP/mdbook"
            sudo install "$RUNNER_TEMP/mdbook/bin/mdbook" /usr/local/bin/mdbook
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: ./ob docs --check
        run: ./ob docs --check

      - name: ./ob docs site --check
        run: ./ob docs site --check

  # The host unit tests and the boot tests run beside the lint job, the
  # boot tests split between several machines, so that a pull request's CI
  # takes the time of its slowest job rather than of all of them in turn.
  unit:
    name: Unit tests
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Allow QEMU to use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Install host packages
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            qemu-system-x86 ovmf gcc flex gawk
            xorriso mtools dosfstools exfatprogs gdisk fdisk sleuthkit btrfs-progs e2fsprogs ntfs-3g dislocker libbde-utils openssh-server samba smbclient scdoc mandoc
            udftools udfclient genisoimage
            clang-20 lld-20 llvm-20 libclang-rt-20-dev meson ninja-build cmake bison pkgconf autoconf

      # smbcacls has no -p: smbd's unit test and boot test listen on
      # SMB's own port, 445, for it (ADR 0229). Installing samba started
      # Samba's own server there, which the tests do not use.
      - name: Let the tests listen on port 445
        run: |
          sudo systemctl stop smbd.service
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=445

      # GRUB, which ./ob builds from its pinned source for the images
      # (ADR 0306): built once for each change to its recipe.
      - name: Cache GRUB
        uses: actions/cache@v4
        with:
          path: .cache/grub
          key: grub-${{ hashFiles('tools/xtask/src/grub.rs') }}

      # ./ob setup runs ./ob doctor, which asks for mdBook too.
      - name: Install mdBook
        run: |
          # GitHub's release downloads sometimes answer 504 for a while;
          # build the same pinned version from crates.io when they do.
          if ! curl --proto '=https' --tlsv1.2 -sSfL --retry 3 --retry-all-errors --retry-delay 10 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin mdbook; then
            cargo install mdbook --version "${MDBOOK_VERSION}" --locked --root "$RUNNER_TEMP/mdbook"
            sudo install "$RUNNER_TEMP/mdbook/bin/mdbook" /usr/local/bin/mdbook
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # The ports main built last, as in the build job.
      - name: Note the port toolchain's version
        id: ports-key
        run: echo "clang=$(clang-20 --version | head -n1 | tr -c 'A-Za-z0-9.\n' -)" >> "$GITHUB_OUTPUT"

      - name: Restore the built ports
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/ports/sources
          key: ports-host-${{ steps.ports-key.outputs.clang }}-${{ hashFiles('ports/**', 'abi/**', 'tools/**', 'rust-toolchain.toml') }}
          restore-keys: ports-host-${{ steps.ports-key.outputs.clang }}-

      - name: ./ob setup
        run: ./ob setup

      # NTFS's host tests keep each volume they write for the Windows job
      # (kernel/fs/ntfs/src/windows_tests.rs).
      - name: ./ob test unit
        run: ./ob test unit
        env:
          NTFS_IMAGES: ${{ github.workspace }}/out/ntfs-volumes

      - name: Upload the NTFS volumes for Windows' chkdsk
        uses: actions/upload-artifact@v4
        with:
          name: ntfs-volumes
          path: out/ntfs-volumes
          if-no-files-found: error
          retention-days: 3

  # Windows' chkdsk on each NTFS volume the unit job's host tests wrote,
  # and their files read back as Windows reads them (ADR 0238). ./ob does
  # not run on Windows, so this job runs a script of its own.
  chkdsk:
    name: Windows chkdsk
    needs: unit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/windows

      - uses: actions/download-artifact@v4
        with:
          name: ntfs-volumes
          path: ntfs-volumes

      - name: chkdsk each volume, and read its files back
        shell: pwsh
        run: ./tools/windows/chkdsk.ps1 ntfs-volumes

  # Windows' own SMB client against smbd (ADRs 0228, 0229): QEMU boots
  # the smbd boot test's image, which the build job writes, without KVM,
  # and Windows maps its shares through a port QEMU forwards, copies
  # files both ways and changes an access list.
  smb-windows:
    name: Windows file sharing
    needs: [build, scope]
    if: needs.scope.outputs.code == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/windows

      - uses: actions/download-artifact@v4
        with:
          name: smbd-image
          path: smbd-image

      - name: Install QEMU
        run: choco install qemu --version=2026.8.11 --no-progress -y

      - name: Windows' client against smbd
        shell: pwsh
        run: ./tools/windows/smbd.ps1 smbd-image/smbd.img

      - name: Keep the guest's serial log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smbd-windows-log
          path: ${{ runner.temp }}/smbd/serial.log
          retention-days: 14

  # The cloud image in VirtualBox (ADR 0329): its UEFI, its SATA
  # controller and disc drive, its Intel card on NAT and its ACPI power
  # button, with a NoCloud config disc in ISO 9660, which the boot tests
  # leave to the FAT one. VirtualBox needs the CPU's virtualization, which
  # KVM holds while its modules are loaded, so they are unloaded first.
  # VirtualBox comes from Oracle's repository, as 7.2: Ubuntu 24.04's 7.0
  # does not build its driver for the runners' Linux 7.0 kernels, which
  # 7.2.8 and later do. Its package builds the driver for the runner's
  # kernel, with that kernel's headers.
  virtualbox:
    name: VirtualBox
    needs: [build, scope]
    if: needs.scope.outputs.code == 'true' && needs.scope.outputs.virtualbox == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            tools/virtualbox

      - uses: actions/download-artifact@v4
        with:
          name: cloud-vmdk
          path: cloud-vmdk

      - name: Note the kernel's release
        id: kernel
        run: echo "release=$(uname -r)" >> "$GITHUB_OUTPUT"

      - name: Take the CPU's virtualization from KVM
        run: |
          sudo modprobe -r kvm_amd kvm_intel kvm || true
          if lsmod | grep -q '^kvm'; then
            echo "::error::KVM's modules are still loaded"
            lsmod | grep '^kvm'
            exit 1
          fi

      # Oracle's signing key, checked by the fingerprint Oracle publishes
      # on virtualbox.org's Linux downloads page.
      - name: Add Oracle's VirtualBox repository
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/oracle_vbox_2016.asc" \
            https://www.virtualbox.org/download/oracle_vbox_2016.asc
          gpg --show-keys --with-colons "$RUNNER_TEMP/oracle_vbox_2016.asc" \
            | grep -qx 'fpr:::::::::B9F8D658297AF3EFC18D5CDFA2F683C52980AECF:'
          sudo gpg --dearmor -o /usr/share/keyrings/oracle-virtualbox-2016.gpg \
            "$RUNNER_TEMP/oracle_vbox_2016.asc"
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/oracle-virtualbox-2016.gpg] https://download.virtualbox.org/virtualbox/debian $(lsb_release -cs) contrib" \
            | sudo tee /etc/apt/sources.list.d/virtualbox.list

      - name: Install VirtualBox
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            linux-headers-${{ steps.kernel.outputs.release }}
            virtualbox-7.2 genisoimage

      # The package's installer builds and loads the driver; its log says
      # why when it could not.
      - name: Load VirtualBox's driver
        run: |
          if ! sudo modprobe vboxdrv; then
            sudo cat /var/log/vbox-setup.log || true
            exit 1
          fi
          VBoxManage --version

      - name: The cloud image in VirtualBox
        run: tools/virtualbox/cloud-boot.sh cloud-vmdk/dukovo-*-x86_64-cloud.vmdk

      - name: Keep the machine's serial log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: virtualbox-serial-log
          path: ${{ runner.temp }}/virtualbox/serial.log
          retention-days: 14

  # A pull request runs the boot tests its changes reach (ADR 0421), on
  # as many machines as they need; main and the nightly run run them all
  # on five. --shard gives each the same amount of work by the times in
  # tools/xtask/src/test/times.txt.
  boot:
    name: Boot tests (${{ matrix.shard }}/${{ needs.scope.outputs.boot-parts }})
    needs: scope
    if: needs.scope.outputs.boot-parts != '0'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.boot-shards) }}
    steps:
      # The merge commit and main's commit under it, which --affected
      # compares.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Allow QEMU to use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Install host packages
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            qemu-system-x86 ovmf gcc flex gawk
            xorriso mtools dosfstools exfatprogs gdisk fdisk sleuthkit btrfs-progs e2fsprogs ntfs-3g dislocker libbde-utils openssh-server samba smbclient nfs-kernel-server krb5-kdc krb5-admin-server krb5-user scdoc mandoc
            udftools udfclient genisoimage
            clang-20 lld-20 llvm-20 libclang-rt-20-dev meson ninja-build cmake bison pkgconf autoconf

      # smbcacls has no -p: smbd's unit test and boot test listen on
      # SMB's own port, 445, for it (ADR 0229). Installing samba started
      # Samba's own server there, which the tests do not use.
      - name: Let the tests listen on port 445
        run: |
          sudo systemctl stop smbd.service
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=445

      # The nfs boot test's server (ADR 0344): Linux's own, which the
      # test exports its folders from, as root, to QEMU's network.
      - name: Start Linux's NFS server
        run: sudo systemctl start nfs-server.service

      # GRUB, which ./ob builds from its pinned source for the images
      # (ADR 0306): built once for each change to its recipe.
      - name: Cache GRUB
        uses: actions/cache@v4
        with:
          path: .cache/grub
          key: grub-${{ hashFiles('tools/xtask/src/grub.rs') }}

      # ./ob setup runs ./ob doctor, which asks for mdBook too.
      - name: Install mdBook
        run: |
          # GitHub's release downloads sometimes answer 504 for a while;
          # build the same pinned version from crates.io when they do.
          if ! curl --proto '=https' --tlsv1.2 -sSfL --retry 3 --retry-all-errors --retry-delay 10 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin mdbook; then
            cargo install mdbook --version "${MDBOOK_VERSION}" --locked --root "$RUNNER_TEMP/mdbook"
            sudo install "$RUNNER_TEMP/mdbook/bin/mdbook" /usr/local/bin/mdbook
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: boot
          save-if: ${{ matrix.shard == 1 }}

      # The ports main built last, as in the build job.
      - name: Note the port toolchain's version
        id: ports-key
        run: echo "clang=$(clang-20 --version | head -n1 | tr -c 'A-Za-z0-9.\n' -)" >> "$GITHUB_OUTPUT"

      # On main too: this job saves nothing, so the build job's rule that
      # main builds the ports from scratch does not need it to.
      - name: Restore the built ports
        uses: actions/cache/restore@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/ports/sources
          key: ports-host-${{ steps.ports-key.outputs.clang }}-${{ hashFiles('ports/**', 'abi/**', 'tools/**', 'rust-toolchain.toml') }}
          restore-keys: ports-host-${{ steps.ports-key.outputs.clang }}-

      - name: ./ob setup
        run: ./ob setup

      # The ports, on their own: a change to one that every port builds
      # on, such as the C library, builds them all again, which takes
      # about 25 minutes and must not count against the shard's timeout.
      - name: ./ob ports
        timeout-minutes: 45
        run: ./ob ports

      - name: ./ob test boot --shard ${{ matrix.shard }}/${{ needs.scope.outputs.boot-parts }}
        # A shard takes about 25 minutes once the ports are built, a few
        # of them building the system; one that hangs fails here, with
        # its logs, instead of running until the job's six hours.
        timeout-minutes: 45
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.scope.outputs.boot-parts }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            ./ob test boot --affected HEAD^1 --shard "$SHARD"
          else
            ./ob test boot --shard "$SHARD"
          fi

      - name: Show the host's processes and kernel log
        if: failure()
        run: |
          ps -eo pid,stat,etime,wchan:32,args | grep -v ' \[' || true
          sudo dmesg | tail -n 60 || true

      - name: Upload boot test logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-logs-${{ matrix.shard }}
          path: |
            out/test/*.log
            out/test/*.ppm
          if-no-files-found: ignore

  # The cost of system calls and IPC round trips on Radix, held to Linux
  # in the same kind of virtual machine (ADR 0039): the job is
  # bench.yml's, which also runs every night on main (ADR 0290).
  # bench.yml runs on its own each night, so the nightly run of this
  # workflow leaves it out.
  bench:
    name: Benchmarks
    needs: scope
    if: github.event_name != 'schedule' && needs.scope.outputs.code == 'true'
    uses: ./.github/workflows/bench.yml

  # Instructions per operation, counted by QEMU (`ob bench --instructions`,
  # ADR 0045): the same on every runner, so a hot path that grows fails
  # here even when the timings above are within their noise.
  instructions:
    name: Instruction budgets
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host packages
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            qemu-system-x86 ovmf gcc flex gawk
            xorriso mtools dosfstools exfatprogs gdisk fdisk sleuthkit btrfs-progs e2fsprogs ntfs-3g dislocker libbde-utils openssh-server samba smbclient scdoc mandoc
            udftools udfclient genisoimage
            clang-20 lld-20 llvm-20 libclang-rt-20-dev meson ninja-build cmake bison pkgconf autoconf

      # GRUB, which ./ob builds from its pinned source for the images
      # (ADR 0306): built once for each change to its recipe.
      - name: Cache GRUB
        uses: actions/cache@v4
        with:
          path: .cache/grub
          key: grub-${{ hashFiles('tools/xtask/src/grub.rs') }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # The ports main built last, as in the build job.
      - name: Note the port toolchain's version
        id: ports-key
        run: echo "clang=$(clang-20 --version | head -n1 | tr -c 'A-Za-z0-9.\n' -)" >> "$GITHUB_OUTPUT"

      # On main too: this job saves nothing, so the build job's rule that
      # main builds the ports from scratch does not need it to. Building
      # them there made this job 38 minutes long, as it did the benchmarks.
      - name: Restore the built ports
        uses: actions/cache/restore@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/ports/sources
          key: ports-host-${{ steps.ports-key.outputs.clang }}-${{ hashFiles('ports/**', 'abi/**', 'tools/**', 'rust-toolchain.toml') }}
          restore-keys: ports-host-${{ steps.ports-key.outputs.clang }}-

      - name: ./ob bench --instructions
        run: ./ob bench --instructions --gate --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the instruction counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instructions
          path: |
            out/bench/instructions.md
            out/bench/boot-bench.log
          if-no-files-found: ignore
          retention-days: 90

  # Only the commits a pull request adds: history already on main is left
  # as it is (ADR 0025).
  # Which of the slower checks below a pull request needs, from the files
  # it changes. The account's runners are shared by every run, about 20
  # jobs at once, so a check a pull request cannot affect leaves its
  # runner to the runs waiting behind it. Main, and every other event,
  # runs them all, so whatever a pull request skips is still checked when
  # it merges.
  scope:
    name: Choose the checks
    runs-on: ubuntu-24.04
    outputs:
      kani: ${{ steps.scope.outputs.kani }}
      tla: ${{ steps.scope.outputs.tla }}
      container: ${{ steps.scope.outputs.container }}
      code: ${{ steps.scope.outputs.code }}
      virtualbox: ${{ steps.scope.outputs.virtualbox }}
      boot-parts: ${{ steps.boot.outputs.parts }}
      boot-shards: ${{ steps.boot.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide from the changed files
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # `needs <pattern>` says true unless this is a pull request none
          # of whose files match the pattern. Workflow changes run all.
          needs() {
            if [ "$GITHUB_EVENT_NAME" != pull_request ] \
              || git diff --name-only "$BASE" HEAD | grep -qE "$1|^\.github/"; then
              echo true
            else
              echo false
            fi
          }
          # `needs_code` says false only for a pull request whose files
          # are all documentation that no build or test reads. Markdown
          # with examples marked as tests counts as code: the
          # docs-examples boot test runs them (ADR 0420).
          needs_code() {
            if [ "$GITHUB_EVENT_NAME" = pull_request ] \
              && ! git diff --name-only "$BASE" HEAD \
                | grep -qvE '^[^/]+\.md$|^docs/(handbook|adr|design|images)/|^docs/roadmap\.md$|^LICENSES/|^REUSE\.toml$' \
              && ! git diff --name-only --diff-filter=d "$BASE" HEAD -- \
                  docs/handbook/src docs/guides docs/tutorials docs/runbooks \
                | xargs -r -d '\n' grep -lE '^\s*```console test\s*$' | grep -q .; then
              echo false
            else
              echo true
            fi
          }
          {
            # The Kani proofs are in the kernel's libraries, which build
            # from kernel/ and tools/ridlc/ alone; doctor.rs pins Kani.
            echo "kani=$(needs '^(kernel/|tools/ridlc/|tools/xtask/src/doctor\.rs|rust-toolchain\.toml)')"
            # TLC checks the models in the tla/ folders, not the code.
            echo "tla=$(needs '(^|/)tla/|^tools/xtask/src/tla\.rs')"
            echo "container=$(needs '^(tools/container/|tools/xtask/src/(doctor|ports)\.rs|ports/|rust-toolchain\.toml)')"
            # A pull request that changes only documentation skips the
            # jobs that test code: the build job still checks the docs.
            # Man pages count as code, since they ship in the image.
            echo "code=$(needs_code)"
            # VirtualBox boots the cloud image: cloud-setup, the guest
            # agent, the image, and the drivers VirtualBox's machine uses.
            echo "virtualbox=$(needs '^(userspace/programs/systools/src/(cloud|guest_agent)|userspace/defaults/spark/services/(cloud-setup|guest-agent)\.toml|tools/xtask/src/image\.rs|tools/virtualbox/|kernel/drivers/(ahci|intel)/)')"
          } | tee -a "$GITHUB_OUTPUT"

      # ob chooses a pull request's boot tests (ADR 0421), so this job
      # builds it; its own cache keeps that to a minute or so.
      - name: Install the pinned Rust toolchain
        if: github.event_name == 'pull_request' && steps.scope.outputs.code == 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'pull_request' && steps.scope.outputs.code == 'true'
        with:
          workspaces: ". -> target"
          shared-key: scope

      # A pull request's boot tests are those its changes reach, compared
      # with main's commit under the merge commit, and the number of
      # machines they need; ob lists each changed file and what it adds.
      # Everything else runs all of them on five, and a pull request of
      # documentation alone runs none.
      - name: Choose the boot tests
        id: boot
        env:
          CODE: ${{ steps.scope.outputs.code }}
        run: |
          if [ "$CODE" = false ]; then
            printf 'parts=0\nshards=[0]\n' | tee -a "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            ./ob test boot --affected HEAD^1 --plan | tee -a "$GITHUB_OUTPUT"
          else
            printf 'parts=5\nshards=[1,2,3,4,5]\n' | tee -a "$GITHUB_OUTPUT"
          fi

  kani:
    name: Kani proofs
    needs: scope
    if: needs.scope.outputs.kani == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # Kani's binaries go outside ~/.cargo/bin, which rust-cache prunes of
      # anything it did not restore before the Kani cache is saved.
      - name: Cache Kani
        id: kani-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.kani-bin
          key: kani-${{ env.KANI_VERSION }}-${{ runner.os }}-v2

      - name: Install Kani
        if: steps.kani-cache.outputs.cache-hit != 'true'
        run: |
          cargo +stable install --locked --root ~/.kani-bin kani-verifier --version "$KANI_VERSION"
          PATH="$HOME/.kani-bin/bin:$PATH" cargo kani setup

      - name: Put Kani on the PATH
        run: echo "$HOME/.kani-bin/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: ./ob test kani
        run: ./ob test kani

  tla:
    name: TLA+ models
    needs: scope
    if: needs.scope.outputs.tla == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache the TLA+ tools
        uses: actions/cache@v4
        with:
          path: .cache/tla
          key: tla-${{ env.TLA_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: ./ob test tla
        run: ./ob test tla

  corpus:
    name: Shell corpus
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The corpus's sandbox is a user namespace, which Ubuntu's AppArmor
      # otherwise refuses to unprivileged users (ADR 0103).
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install host packages
        uses: ./.github/actions/apt-install
        with:
          packages: dash bash util-linux

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: ./ob test corpus
        run: ./ob test corpus

  # The container builds every port, the kernel, the programs and the
  # image with its own toolchain, and boots a few of them (ADR 0330):
  # what differs from the jobs above is the toolchain, not the code, and
  # the ports are where it showed (OpenSSH needed Automake, #163). The
  # whole of `ob --container test` runs every night instead
  # (container.yml). A pull request runs this job only when it changes
  # that toolchain or what builds with it (the scope job decides); main
  # runs it on every merge.
  container:
    name: Build container
    needs: scope
    if: needs.scope.outputs.container == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Allow QEMU to use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      # The ports main built last, as in the build job, keyed by the
      # container's definition, which holds its Clang.
      - name: Note the build container's version
        id: ports-key
        run: echo "toolchain=$(sha256sum tools/container/Containerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore the built ports
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/container/ports/sources
          key: ports-container-${{ steps.ports-key.outputs.toolchain }}-${{ hashFiles('ports/**', 'abi/**', 'tools/**', 'rust-toolchain.toml') }}
          restore-keys: ports-container-${{ steps.ports-key.outputs.toolchain }}-

      - name: ./ob --container doctor
        run: ./ob --container doctor

      # One case each for UEFI and BIOS, the C ports on mlibc, storage,
      # TLS on ring, and the git, curl and OpenSSH ports: about 3 minutes.
      - name: ./ob --container test boot (smoke cases)
        run: >-
          ./ob --container test boot
          --case uefi-usb --case bios-cdrom --case posix --case storage
          --case tls --case git-https --case ssh

      - name: ./ob --container image
        run: ./ob --container image

      - name: Save the built ports
        if: github.event_name == 'push' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/container/ports/sources
          key: ports-container-${{ steps.ports-key.outputs.toolchain }}-${{ hashFiles('ports/**', 'abi/**', 'tools/**', 'rust-toolchain.toml') }}

  # The quick checks, in one job instead of one each, so that they hold
  # one runner instead of four. Each runs even when one before it failed,
  # so a failure here names every check that failed.
  checks:
    name: Licenses, sign-off and TUF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Some of the TUF suite's tests run the client under faketime;
      # Python and its venv module come with the runner.
      - name: Install faketime
        uses: ./.github/actions/apt-install
        with:
          packages: faketime

      - name: Cache the conformance suite
        uses: actions/cache@v4
        with:
          path: .cache/tuf-conformance
          key: tuf-conformance-${{ hashFiles('tools/xtask/src/tuf.rs') }}

      # The kernel takes the crates it patches from kernel/patched (ADR 0182).
      - name: Patch the kernel's crates
        run: ./ob crates

      - name: cargo deny (build tool)
        if: ${{ !cancelled() }}
        run: cargo deny --manifest-path Cargo.toml check
      # cargo-deny reads ./deny.toml unless told otherwise; the kernel has
      # its own, permissive-only policy.
      - name: cargo deny (kernel)
        if: ${{ !cancelled() }}
        run: cargo deny --manifest-path kernel/Cargo.toml --config kernel/deny.toml check
      # The user programs go into /system, so they get the kernel's policy.
      - name: cargo deny (user programs)
        if: ${{ !cancelled() }}
        run: cargo deny --manifest-path userspace/Cargo.toml --config kernel/deny.toml check

      # Every file needs copyright and license information (ADR 0026). The
      # REUSE tool is GPL-3.0-or-later and only checks the repository.
      - name: reuse lint
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install --quiet reuse==6.2.0
          "$RUNNER_TEMP/reuse/bin/reuse" lint

      - name: ./ob signoff
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: ./ob signoff "${{ github.event.pull_request.base.sha }}"

      # The TUF client against tuf-conformance (ADR 0380).
      - name: ./ob test tuf
        if: ${{ !cancelled() }}
        run: ./ob test tuf

  # The one check main's ruleset requires: it passes when every job above
  # passed, or was skipped on purpose, so that a job can be added, renamed
  # or split without changing the ruleset. The benchmarks are left out, as
  # they were from the required checks: their numbers move with the
  # runner, and a red one is read by hand.
  passed:
    name: CI passed
    if: always()
    needs: [build, docs, unit, chkdsk, smb-windows, virtualbox, boot, instructions, scope, kani, tla, corpus, container, checks]
    runs-on: ubuntu-24.04
    steps:
      - name: Check that every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::These jobs did not pass: $failed"
            exit 1
          fi
