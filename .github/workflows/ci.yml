# Every step is an ./ob command, so anything CI does can be run locally the
# same way. See CONTRIBUTING.md.
name: CI

on:
  push:
    # A release branch (ADR 0534) gets CI on each fix that lands in it, so
    # that the release-train bot finds `CI passed` on its head.
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:
  # Every boot test, and every other job, on main each night (ADR 0421):
  # pull requests run only the boot tests their changes reach.
  schedule:
    - cron: "11 3 * * *"

permissions:
  contents: read

# A pull request's new push cancels its run before. Main's runs are not
# cancelled: each runs every boot test (ADR 0421), so a merge waits for
# the run before it rather than ending it, and only the newest of those
# waiting is kept, as it holds the others' changes. Merges never wait
# for main's run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in step with tools/container/Containerfile and tools/xtask/src/doctor.rs,
  # as the host packages below are (Clang 20 is ports::CLANG_MIN).
  MDBOOK_VERSION: 0.4.52
  # Keep in step with tools/xtask/src/doctor.rs (ADR 0019).
  KANI_VERSION: 0.68.0
  # Keep in step with tools/xtask/src/tla.rs (ADR 0024).
  TLA_VERSION: 1.7.4

jobs:
  # The ports, built once for the whole run (ADR 0560): every job below
  # that builds on them restores what this one leaves, instead of each
  # building the ports a stale cache lacks. A change to the system call
  # interface or the C library builds every port again, about 50
  # minutes with Go's toolchain and its bundle, and before this job each
  # of seven jobs did that at once on every run until main's next run had
  # saved the ports.
  #
  # The cache holds every folder a port installs into: out/toolchain
  # too, where Rust's standard library, the patched crates and the C++
  # headers go, or a stamp would call a port built whose files are
  # missing. Its key names the ports, abi/ and the toolchain first, so
  # that a run takes a cache of the same ports over a newer one of
  # others; ob's stamps then decide what to build again. A pull request
  # whose ports are built here saves them for its own next push and
  # re-runs. The nightly run builds them from scratch, so that a port
  # that builds only on top of an older build of itself is found.
  ports:
    name: Ports
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.chosen.outputs.key }}
      prefix: ${{ steps.name.outputs.prefix }}
      std: ${{ steps.chosen.outputs.std }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host packages
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            gcc flex gawk scdoc mandoc
            clang-20 lld-20 llvm-20 libclang-rt-20-dev meson ninja-build cmake bison pkgconf autoconf

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Name the ports' cache
        id: name
        env:
          PORTS: ${{ hashFiles('ports/**', 'abi/**', 'rust-toolchain.toml') }}
          TOOLS: ${{ hashFiles('tools/**') }}
        run: |
          prefix="ports-host-$(clang-20 --version | head -n1 | tr -c 'A-Za-z0-9.\n' -)-"
          {
            echo "prefix=$prefix"
            echo "ports=$prefix$PORTS-"
            echo "key=$prefix$PORTS-$TOOLS"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Restore the ports built last
        id: restore
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/ports/sources
          key: ${{ steps.name.outputs.key }}
          restore-keys: |
            ${{ steps.name.outputs.ports }}
            ${{ steps.name.outputs.prefix }}

      - name: Note the ports' stamps
        id: before
        run: echo "stamps=$(cat out/ports/*.stamp 2>/dev/null | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # A port that hangs fails here, not at the job's six hours; a build
      # of every port, after a change to the C library, takes about 50
      # minutes.
      - name: ./ob ports
        timeout-minutes: 75
        run: ./ob ports

      # A restored cache whose ports were all up to date is the one the
      # jobs below take; one that had to change, or none, is saved anew.
      - name: Choose the cache the jobs below restore
        id: chosen
        env:
          HIT: ${{ steps.restore.outputs.cache-hit }}
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
          BEFORE: ${{ steps.before.outputs.stamps }}
          KEY: ${{ steps.name.outputs.key }}
        run: |
          after=$(cat out/ports/*.stamp 2>/dev/null | sha256sum | cut -c1-16)
          if [ -n "$MATCHED" ] && [ "$after" = "$BEFORE" ]; then
            printf 'key=%s\nsave=false\n' "$MATCHED" | tee -a "$GITHUB_OUTPUT"
          elif [ "$HIT" = true ]; then
            echo "::warning::The ports changed under the cache $KEY, which already exists; each job below builds them again"
            printf 'key=%s\nsave=false\n' "$KEY" | tee -a "$GITHUB_OUTPUT"
          else
            printf 'key=%s\nsave=true\n' "$KEY" | tee -a "$GITHUB_OUTPUT"
          fi
          # The rust-std port's stamp keys the Rust caches of the jobs
          # below, whose programs on Rust's standard library are built
          # against it: under a key that ignored it, a restored build
          # against an older std was thrown away and built afresh in each
          # job, about six minutes (ADR 0560).
          echo "std=$(cat out/ports/rust-std.stamp)" | tee -a "$GITHUB_OUTPUT"

      - name: Save the built ports
        if: steps.chosen.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/ports/sources
          key: ${{ steps.name.outputs.key }}

  build:
    name: Lint, build, docs and image
    needs: [scope, ports]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Allow QEMU to use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Install host packages
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            qemu-system-x86 ovmf gcc flex gawk musl-tools
            xorriso mtools dosfstools exfatprogs gdisk fdisk sleuthkit btrfs-progs e2fsprogs ntfs-3g dislocker libbde-utils openssh-server samba smbclient scdoc mandoc
            udftools udfclient genisoimage qemu-system-misc qemu-utils
            clang-20 lld-20 llvm-20 libclang-rt-20-dev meson ninja-build cmake bison pkgconf autoconf

      # GRUB, which ./ob builds from its pinned source for the images
      # (ADR 0306): built once for each change to its recipe.
      - name: Cache GRUB
        uses: actions/cache@v4
        with:
          path: .cache/grub
          key: grub-${{ hashFiles('tools/xtask/src/grub.rs') }}

      # memtest86+, the start menu's memory test, which ./ob builds
      # from its pinned source (ADR 0488): once for each change to its
      # recipe.
      - name: Cache memtest86+
        uses: actions/cache@v4
        with:
          path: .cache/memtest
          key: memtest-${{ hashFiles('tools/xtask/src/memtest.rs') }}

      - name: Install mdBook
        run: |
          # GitHub's release downloads sometimes answer 504 for a while;
          # build the same pinned version from crates.io when they do.
          if ! curl --proto '=https' --tlsv1.2 -sSfL --retry 3 --retry-all-errors --retry-delay 10 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin mdbook; then
            cargo install mdbook --version "${MDBOOK_VERSION}" --locked --root "$RUNNER_TEMP/mdbook"
            sudo install "$RUNNER_TEMP/mdbook/bin/mdbook" /usr/local/bin/mdbook
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: std-${{ needs.ports.outputs.std }}

      # The ports as the ports job left them for this run.
      - name: Restore the built ports
        uses: actions/cache/restore@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/ports/sources
          key: ${{ needs.ports.outputs.key }}
          restore-keys: ${{ needs.ports.outputs.prefix }}

      - name: ./ob setup
        run: ./ob setup

      - name: ./ob lint
        run: ./ob lint

      - name: ./ob test riscv
        run: ./ob test riscv

      - name: ./ob docs --check
        run: ./ob docs --check

      - name: ./ob docs site --check
        run: ./ob docs site --check

      # Every security advisory in security/advisories reads as the release
      # keys' signing reads it (ADR 0534).
      - name: ./ob security check
        run: ./ob security check

      - name: ./ob image
        run: ./ob image

      # `ob image` already refuses components outside their area's
      # allow-list; this checks the SPDX document itself (ADR 0021).
      - name: Validate the license manifest
        run: |
          python3 -m venv "$RUNNER_TEMP/spdx"
          "$RUNNER_TEMP/spdx/bin/pip" install --quiet spdx-tools==0.8.3
          "$RUNNER_TEMP/spdx/bin/pyspdxtools" -i out/dukovo-*-x86_64.spdx

      - name: Upload the boot image
        uses: actions/upload-artifact@v4
        with:
          name: dukovo-image
          path: |
            out/dukovo-*-x86_64.img
            out/dukovo-*-x86_64.spdx
          retention-days: 14

      # The smbd boot test's image, its command line in place, which the
      # Windows file sharing job boots.
      - name: ./ob test boot --case smbd --image-only
        run: ./ob test boot --case smbd --image-only

      - name: Upload the smbd test image
        uses: actions/upload-artifact@v4
        with:
          name: smbd-image
          path: out/test/smbd.img
          retention-days: 3

      # The cloud image, whose VMDK the VirtualBox job boots (ADR 0329).
      - name: ./ob image --cloud
        if: needs.scope.outputs.virtualbox == 'true'
        run: ./ob image --cloud

      - name: Upload the cloud image's VMDK
        if: needs.scope.outputs.virtualbox == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-vmdk
          path: out/dukovo-*-x86_64-cloud.vmdk
          if-no-files-found: error
          retention-days: 3

  # A pull request that changes only documentation runs this job in place
  # of the build job above: the same doc checks, without building the
  # system or its image.
  docs:
    name: Docs
    needs: scope
    if: needs.scope.outputs.code == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host packages
        uses: ./.github/actions/apt-install
        with:
          packages: scdoc mandoc

      - name: Install mdBook
        run: |
          # GitHub's release downloads sometimes answer 504 for a while;
          # build the same pinned version from crates.io when they do.
          if ! curl --proto '=https' --tlsv1.2 -sSfL --retry 3 --retry-all-errors --retry-delay 10 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin mdbook; then
            cargo install mdbook --version "${MDBOOK_VERSION}" --locked --root "$RUNNER_TEMP/mdbook"
            sudo install "$RUNNER_TEMP/mdbook/bin/mdbook" /usr/local/bin/mdbook
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: ./ob docs --check
        run: ./ob docs --check

      - name: ./ob docs site --check
        run: ./ob docs site --check

  # The host unit tests and the boot tests run beside the lint job, the
  # boot tests split between several machines, so that a pull request's CI
  # takes the time of its slowest job rather than of all of them in turn.
  unit:
    name: Unit tests
    needs: [scope, ports]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Allow QEMU to use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Install host packages
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            qemu-system-x86 ovmf gcc flex gawk musl-tools
            xorriso mtools dosfstools exfatprogs gdisk fdisk sleuthkit btrfs-progs e2fsprogs ntfs-3g dislocker libbde-utils openssh-server samba smbclient scdoc mandoc
            udftools udfclient genisoimage
            clang-20 lld-20 llvm-20 libclang-rt-20-dev meson ninja-build cmake bison pkgconf autoconf libsqlite3-dev

      # smbcacls has no -p: smbd's unit test and boot test listen on
      # SMB's own port, 445, for it (ADR 0229). Installing samba started
      # Samba's own server there, which the tests do not use.
      - name: Let the tests listen on port 445
        run: |
          sudo systemctl stop smbd.service
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=445

      # GRUB, which ./ob builds from its pinned source for the images
      # (ADR 0306): built once for each change to its recipe.
      - name: Cache GRUB
        uses: actions/cache@v4
        with:
          path: .cache/grub
          key: grub-${{ hashFiles('tools/xtask/src/grub.rs') }}

      # memtest86+, the start menu's memory test, which ./ob builds
      # from its pinned source (ADR 0488): once for each change to its
      # recipe.
      - name: Cache memtest86+
        uses: actions/cache@v4
        with:
          path: .cache/memtest
          key: memtest-${{ hashFiles('tools/xtask/src/memtest.rs') }}

      # ./ob setup runs ./ob doctor, which asks for mdBook too.
      - name: Install mdBook
        run: |
          # GitHub's release downloads sometimes answer 504 for a while;
          # build the same pinned version from crates.io when they do.
          if ! curl --proto '=https' --tlsv1.2 -sSfL --retry 3 --retry-all-errors --retry-delay 10 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin mdbook; then
            cargo install mdbook --version "${MDBOOK_VERSION}" --locked --root "$RUNNER_TEMP/mdbook"
            sudo install "$RUNNER_TEMP/mdbook/bin/mdbook" /usr/local/bin/mdbook
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # The ports as the ports job left them for this run.
      - name: Restore the built ports
        uses: actions/cache/restore@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/ports/sources
          key: ${{ needs.ports.outputs.key }}
          restore-keys: ${{ needs.ports.outputs.prefix }}

      - name: ./ob setup
        run: ./ob setup

      # NTFS's host tests keep each volume they write for the Windows job
      # (kernel/fs/ntfs/src/windows_tests.rs).
      - name: ./ob test unit
        run: ./ob test unit
        env:
          NTFS_IMAGES: ${{ github.workspace }}/out/ntfs-volumes

      - name: Upload the NTFS volumes for Windows' chkdsk
        uses: actions/upload-artifact@v4
        with:
          name: ntfs-volumes
          path: out/ntfs-volumes
          if-no-files-found: error
          retention-days: 3

  # Windows' chkdsk on each NTFS volume the unit job's host tests wrote,
  # and their files read back as Windows reads them (ADR 0238). ./ob does
  # not run on Windows, so this job runs a script of its own.
  chkdsk:
    name: Windows chkdsk
    needs: unit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/windows

      - uses: actions/download-artifact@v4
        with:
          name: ntfs-volumes
          path: ntfs-volumes

      - name: chkdsk each volume, and read its files back
        shell: pwsh
        run: ./tools/windows/chkdsk.ps1 ntfs-volumes

  # Windows' own SMB client against smbd (ADRs 0228, 0229): QEMU boots
  # the smbd boot test's image, which the build job writes, without KVM,
  # and Windows maps its shares through a port QEMU forwards, copies
  # files both ways and changes an access list.
  smb-windows:
    name: Windows file sharing
    needs: [build, scope]
    if: needs.scope.outputs.code == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/windows

      - uses: actions/download-artifact@v4
        with:
          name: smbd-image
          path: smbd-image

      - name: Install QEMU
        run: choco install qemu --version=2026.8.11 --no-progress -y

      - name: Windows' client against smbd
        shell: pwsh
        run: ./tools/windows/smbd.ps1 smbd-image/smbd.img

      - name: Keep the guest's serial log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smbd-windows-log
          path: ${{ runner.temp }}/smbd/serial.log
          retention-days: 14

  # The cloud image in VirtualBox (ADR 0329): its UEFI, its SATA
  # controller and disc drive, its Intel card on NAT and its ACPI power
  # button, with a NoCloud config disc in ISO 9660, which the boot tests
  # leave to the FAT one. VirtualBox needs the CPU's virtualization, which
  # KVM holds while its modules are loaded, so they are unloaded first.
  # VirtualBox comes from Oracle's repository, as 7.2: Ubuntu 24.04's 7.0
  # does not build its driver for the runners' Linux 7.0 kernels, which
  # 7.2.8 and later do. Its package builds the driver for the runner's
  # kernel, with that kernel's headers.
  virtualbox:
    name: VirtualBox
    needs: [build, scope]
    if: needs.scope.outputs.code == 'true' && needs.scope.outputs.virtualbox == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            tools/virtualbox

      - uses: actions/download-artifact@v4
        with:
          name: cloud-vmdk
          path: cloud-vmdk

      - name: Note the kernel's release
        id: kernel
        run: echo "release=$(uname -r)" >> "$GITHUB_OUTPUT"

      - name: Take the CPU's virtualization from KVM
        run: |
          sudo modprobe -r kvm_amd kvm_intel kvm || true
          if lsmod | grep -q '^kvm'; then
            echo "::error::KVM's modules are still loaded"
            lsmod | grep '^kvm'
            exit 1
          fi

      # Oracle's signing key, checked by the fingerprint Oracle publishes
      # on virtualbox.org's Linux downloads page. Taken from virtualbox.org,
      # else from beside the repository, else from Ubuntu's key server by
      # that fingerprint: whichever answers, the fingerprint must match.
      - name: Add Oracle's VirtualBox repository
        env:
          FINGERPRINT: B9F8D658297AF3EFC18D5CDFA2F683C52980AECF
        run: |
          key="$RUNNER_TEMP/oracle_vbox_2016.asc"
          if ! curl -fsSL --retry 5 -o "$key" \
              https://www.virtualbox.org/download/oracle_vbox_2016.asc \
            && ! curl -fsSL --retry 5 -o "$key" \
              https://download.virtualbox.org/virtualbox/debian/oracle_vbox_2016.asc; then
            export GNUPGHOME="$RUNNER_TEMP/gnupg"
            mkdir -p "$GNUPGHOME"
            chmod 0700 "$GNUPGHOME"
            gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys "$FINGERPRINT"
            gpg --batch --armor --export "$FINGERPRINT" > "$key"
          fi
          gpg --show-keys --with-colons "$key" | grep -qx "fpr:::::::::$FINGERPRINT:"
          sudo gpg --dearmor -o /usr/share/keyrings/oracle-virtualbox-2016.gpg "$key"
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/oracle-virtualbox-2016.gpg] https://download.virtualbox.org/virtualbox/debian $(lsb_release -cs) contrib" \
            | sudo tee /etc/apt/sources.list.d/virtualbox.list

      - name: Install VirtualBox
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            linux-headers-${{ steps.kernel.outputs.release }}
            virtualbox-7.2 genisoimage

      # The package's installer builds and loads the driver; its log says
      # why when it could not.
      - name: Load VirtualBox's driver
        run: |
          if ! sudo modprobe vboxdrv; then
            sudo cat /var/log/vbox-setup.log || true
            exit 1
          fi
          VBoxManage --version

      - name: The cloud image in VirtualBox
        run: tools/virtualbox/cloud-boot.sh cloud-vmdk/dukovo-*-x86_64-cloud.vmdk

      - name: Keep the machine's serial log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: virtualbox-serial-log
          path: ${{ runner.temp }}/virtualbox/serial.log
          retention-days: 14

  # A pull request runs the boot tests its changes reach (ADR 0421), on
  # as many machines as they need; main and the nightly run run them all
  # on twenty. --shard gives each the same amount of work by the times in
  # tools/xtask/src/test/times.txt.
  boot:
    name: Boot tests (${{ matrix.shard }}/${{ needs.scope.outputs.boot-parts }})
    needs: [scope, ports]
    if: needs.scope.outputs.boot-parts != '0'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.boot-shards) }}
    steps:
      # The merge commit and main's commit under it, which --affected
      # compares.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Allow QEMU to use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Install host packages
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            qemu-system-x86 ovmf gcc flex gawk musl-tools
            xorriso mtools dosfstools exfatprogs gdisk fdisk sleuthkit btrfs-progs e2fsprogs ntfs-3g dislocker libbde-utils openssh-server samba smbclient nfs-kernel-server krb5-kdc krb5-admin-server krb5-user restic scdoc mandoc
            udftools udfclient genisoimage
            clang-20 lld-20 llvm-20 libclang-rt-20-dev meson ninja-build cmake bison pkgconf autoconf

      # smbcacls has no -p: smbd's unit test and boot test listen on
      # SMB's own port, 445, for it (ADR 0229). Installing samba started
      # Samba's own server there, which the tests do not use.
      - name: Let the tests listen on port 445
        run: |
          sudo systemctl stop smbd.service
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=445

      # The nfs boot test's server (ADR 0344): Linux's own, which the
      # test exports its folders from, as root, to QEMU's network.
      - name: Start Linux's NFS server
        run: sudo systemctl start nfs-server.service

      # GRUB, which ./ob builds from its pinned source for the images
      # (ADR 0306): built once for each change to its recipe.
      - name: Cache GRUB
        uses: actions/cache@v4
        with:
          path: .cache/grub
          key: grub-${{ hashFiles('tools/xtask/src/grub.rs') }}

      # memtest86+, the start menu's memory test, which ./ob builds
      # from its pinned source (ADR 0488): once for each change to its
      # recipe.
      - name: Cache memtest86+
        uses: actions/cache@v4
        with:
          path: .cache/memtest
          key: memtest-${{ hashFiles('tools/xtask/src/memtest.rs') }}

      # Go's build cache for Radix, which the go-runtime boot test fills
      # as it builds its programs with the toolchain of the go port: the
      # standard library compiled once for each change to the port, not
      # once in each run. Go's cache is addressed by what is built, so a
      # key that no longer fits costs a build and nothing else.
      - name: Cache Go's build cache
        uses: actions/cache@v4
        with:
          path: target/go/cache
          key: go-build-${{ hashFiles('ports/go/**', 'tools/xtask/src/golang.rs') }}

      # The ansible boot test's controller: ansible-core 2.22 needs Python
      # 3.13 or later, and Ubuntu 24.04's python3 is 3.12. Only the name
      # python3.13 is added to the path, where src/ansible.rs looks for it,
      # so every other test keeps the system's python3.
      - name: Install Python 3.13 for the ansible boot test
        id: python313
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          update-environment: false

      - name: Name it python3.13
        run: |
          mkdir -p "$RUNNER_TEMP/python313"
          ln -s "${{ steps.python313.outputs.python-path }}" "$RUNNER_TEMP/python313/python3.13"
          echo "$RUNNER_TEMP/python313" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/python313/python3.13" -m venv --help > /dev/null

      # ./ob setup runs ./ob doctor, which asks for mdBook too.
      - name: Install mdBook
        run: |
          # GitHub's release downloads sometimes answer 504 for a while;
          # build the same pinned version from crates.io when they do.
          if ! curl --proto '=https' --tlsv1.2 -sSfL --retry 3 --retry-all-errors --retry-delay 10 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin mdbook; then
            cargo install mdbook --version "${MDBOOK_VERSION}" --locked --root "$RUNNER_TEMP/mdbook"
            sudo install "$RUNNER_TEMP/mdbook/bin/mdbook" /usr/local/bin/mdbook
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # rust-cache leaves `key` out when given `shared-key`, so the
          # rust-std port's stamp goes in the shared key (ADR 0560).
          shared-key: boot-std-${{ needs.ports.outputs.std }}
          save-if: ${{ matrix.shard == 1 }}

      # The ports as the ports job left them for this run.
      - name: Restore the built ports
        uses: actions/cache/restore@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/ports/sources
          key: ${{ needs.ports.outputs.key }}
          restore-keys: ${{ needs.ports.outputs.prefix }}

      - name: ./ob setup
        run: ./ob setup

      # The ports, on their own: the ports job left them built, so this
      # packs the catalog's bundles, which the cache does not hold. Should
      # the cache not restore, the ports build here, in about 30 minutes
      # that must not count against the shard's timeout.
      - name: ./ob ports
        timeout-minutes: 45
        run: ./ob ports

      - name: ./ob test boot --shard ${{ matrix.shard }}/${{ needs.scope.outputs.boot-parts }}
        # A shard takes about 30 minutes once the ports are built: some 8
        # of them building the system, and at most a tenth of the boot
        # tests by times.txt, which leaves room for a failed test to run
        # once more (--retry, ADR 0560). One that hangs fails here, with
        # its logs, instead of running until the job's six hours.
        timeout-minutes: 45
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.scope.outputs.boot-parts }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            ./ob test boot --affected HEAD^1 --shard "$SHARD" --retry
          else
            ./ob test boot --shard "$SHARD" --retry
          fi

      # A test that failed once and passed when run again (--retry) fails
      # nothing, but each is named on the run's page, with its first
      # serial log among the logs below, so that a flaky test is fixed
      # rather than lived with.
      - name: Name the flaky boot tests
        if: ${{ !cancelled() && hashFiles('out/test/flaky.txt') != '' }}
        run: |
          echo '### Boot tests that failed once, then passed' >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::warning title=Flaky boot test::$line"
            echo "- $line" >> "$GITHUB_STEP_SUMMARY"
          done < out/test/flaky.txt

      - name: Show the host's processes and kernel log
        if: failure()
        run: |
          # pgrep cannot print these columns.
          # shellcheck disable=SC2009
          ps -eo pid,stat,etime,wchan:32,args | grep -v ' \[' || true
          sudo dmesg | tail -n 60 || true

      - name: Upload boot test logs and screenshots
        if: ${{ failure() || hashFiles('out/test/flaky.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-logs-${{ matrix.shard }}
          path: |
            out/test/*.log
            out/test/*.ppm
          if-no-files-found: ignore

  # The cost of system calls and IPC round trips on Radix, held to Linux
  # in the same kind of virtual machine (ADR 0039): the job is
  # bench.yml's, which also runs every night on main (ADR 0290).
  # bench.yml runs on its own each night, so the nightly run of this
  # workflow leaves it out.
  bench:
    name: Benchmarks
    needs: [scope, ports]
    if: github.event_name != 'schedule' && needs.scope.outputs.code == 'true'
    uses: ./.github/workflows/bench.yml
    with:
      ports-key: ${{ needs.ports.outputs.key }}
      ports-prefix: ${{ needs.ports.outputs.prefix }}
      std-stamp: ${{ needs.ports.outputs.std }}

  # Go's own tests of its standard library on Dukovo (`ob test go-suite`),
  # an hour or more, so a pull request runs it only when its files reach
  # Go. Main's runs and the nightly one leave it out until go-suite.yml has
  # a schedule of its own.
  go-suite:
    name: Go test suite
    needs: [scope, ports]
    if: github.event_name == 'pull_request' && needs.scope.outputs.go == 'true'
    uses: ./.github/workflows/go-suite.yml
    with:
      ports-key: ${{ needs.ports.outputs.key }}
      ports-prefix: ${{ needs.ports.outputs.prefix }}
      std-stamp: ${{ needs.ports.outputs.std }}

  # Instructions per operation, counted by QEMU (`ob bench --instructions`,
  # ADR 0045): the same on every runner, so a hot path that grows fails
  # here even when the timings above are within their noise.
  instructions:
    name: Instruction budgets
    needs: [scope, ports]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host packages
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            qemu-system-x86 ovmf gcc flex gawk musl-tools
            xorriso mtools dosfstools exfatprogs gdisk fdisk sleuthkit btrfs-progs e2fsprogs ntfs-3g dislocker libbde-utils openssh-server samba smbclient scdoc mandoc
            udftools udfclient genisoimage
            clang-20 lld-20 llvm-20 libclang-rt-20-dev meson ninja-build cmake bison pkgconf autoconf

      # GRUB, which ./ob builds from its pinned source for the images
      # (ADR 0306): built once for each change to its recipe.
      - name: Cache GRUB
        uses: actions/cache@v4
        with:
          path: .cache/grub
          key: grub-${{ hashFiles('tools/xtask/src/grub.rs') }}

      # memtest86+, the start menu's memory test, which ./ob builds
      # from its pinned source (ADR 0488): once for each change to its
      # recipe.
      - name: Cache memtest86+
        uses: actions/cache@v4
        with:
          path: .cache/memtest
          key: memtest-${{ hashFiles('tools/xtask/src/memtest.rs') }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: std-${{ needs.ports.outputs.std }}

      # The ports as the ports job left them for this run.
      - name: Restore the built ports
        uses: actions/cache/restore@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/ports/sources
          key: ${{ needs.ports.outputs.key }}
          restore-keys: ${{ needs.ports.outputs.prefix }}

      - name: ./ob bench --instructions
        run: ./ob bench --instructions --gate --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the instruction counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instructions
          path: |
            out/bench/instructions.md
            out/bench/boot-bench.log
          if-no-files-found: ignore
          retention-days: 90

  # Only the commits a pull request adds: history already on main is left
  # as it is (ADR 0025).
  # Which of the slower checks below a pull request needs, from the files
  # it changes. The account's runners are shared by every run, about 20
  # jobs at once, so a check a pull request cannot affect leaves its
  # runner to the runs waiting behind it. Main, and every other event,
  # runs them all, so whatever a pull request skips is still checked when
  # it merges.
  scope:
    name: Choose the checks
    runs-on: ubuntu-24.04
    outputs:
      kani: ${{ steps.scope.outputs.kani }}
      tla: ${{ steps.scope.outputs.tla }}
      container: ${{ steps.scope.outputs.container }}
      code: ${{ steps.scope.outputs.code }}
      virtualbox: ${{ steps.scope.outputs.virtualbox }}
      go: ${{ steps.scope.outputs.go }}
      boot-parts: ${{ steps.boot.outputs.parts }}
      boot-shards: ${{ steps.boot.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide from the changed files
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # `needs <pattern>` says true unless this is a pull request none
          # of whose files match the pattern. Workflow changes run all.
          needs() {
            if [ "$GITHUB_EVENT_NAME" != pull_request ] \
              || git diff --name-only "$BASE" HEAD | grep -qE "$1|^\.github/"; then
              echo true
            else
              echo false
            fi
          }
          # `needs_code` says false only for a pull request whose files
          # are all documentation that no build or test reads, such as
          # docs/roadmap.md and docs/deferred.md, or the catalog's signed
          # targets, which no build reads either: an image carries only
          # the first root, and `./ob catalog verify` below checks the
          # signatures (ADR 0594). Markdown
          # with examples marked as tests counts as code: the
          # docs-examples boot test runs them (ADR 0420).
          needs_code() {
            if [ "$GITHUB_EVENT_NAME" = pull_request ] \
              && ! git diff --name-only "$BASE" HEAD \
                | grep -qvE '^[^/]+\.md$|^docs/[^/]+\.md$|^docs/(handbook|adr|design|images)/|^LICENSES/|^REUSE\.toml$|^catalog/metadata/targets\.json$' \
              && ! git diff --name-only --diff-filter=d "$BASE" HEAD -- \
                  docs/handbook/src docs/guides docs/tutorials docs/runbooks \
                | xargs -r -d '\n' grep -lE '^\s*```console test\s*$' | grep -q .; then
              echo false
            else
              echo true
            fi
          }
          {
            # The Kani proofs are in the kernel's libraries, which build
            # from kernel/ and tools/ridlc/ alone, and in the slots
            # program; doctor.rs pins Kani.
            echo "kani=$(needs '^(kernel/|tools/ridlc/|userspace/programs/slots/|tools/xtask/src/doctor\.rs|rust-toolchain\.toml)')"
            # TLC checks the models in the tla/ folders, not the code.
            echo "tla=$(needs '(^|/)tla/|^tools/xtask/src/tla\.rs')"
            echo "container=$(needs '^(tools/container/|tools/xtask/src/(doctor|ports)\.rs|ports/|rust-toolchain\.toml)')"
            # A pull request that changes only documentation skips the
            # jobs that test code: the build job still checks the docs.
            # Man pages count as code, since they ship in the image.
            echo "code=$(needs_code)"
            # Go's test suite on Dukovo runs for a pull request that changes
            # Go's port or bundle, the Go programs, or the code that builds
            # the tests and runs the suite.
            echo "go=$(needs '^(ports/go/|ports/go-radix/|userspace/go/|tools/xtask/src/golang\.rs|tools/xtask/src/test/go_suite\.rs)')"
            # VirtualBox boots the cloud image: cloud-setup, the guest
            # agent, the image, and the drivers VirtualBox's machine uses.
            echo "virtualbox=$(needs '^(userspace/programs/systools/src/(cloud|guest_agent)|userspace/defaults/spark/services/(cloud-setup|guest-agent)\.toml|tools/xtask/src/image\.rs|tools/virtualbox/|kernel/drivers/(ahci|intel)/)')"
          } | tee -a "$GITHUB_OUTPUT"

      # ob chooses a pull request's boot tests (ADR 0421), so this job
      # builds it; its own cache keeps that to a minute or so.
      - name: Install the pinned Rust toolchain
        if: github.event_name == 'pull_request' && steps.scope.outputs.code == 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'pull_request' && steps.scope.outputs.code == 'true'
        with:
          workspaces: ". -> target"
          shared-key: scope

      # A pull request's boot tests are those its changes reach, compared
      # with main's commit under the merge commit, and the number of
      # machines they need; ob lists each changed file and what it adds.
      # Everything else runs all of them on twenty, and a pull request of
      # documentation alone runs none.
      - name: Choose the boot tests
        id: boot
        env:
          CODE: ${{ steps.scope.outputs.code }}
        run: |
          if [ "$CODE" = false ]; then
            printf 'parts=0\nshards=[0]\n' | tee -a "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            ./ob test boot --affected HEAD^1 --plan | tee -a "$GITHUB_OUTPUT"
          else
            printf 'parts=20\nshards=[%s]\n' "$(seq -s, 1 20)" | tee -a "$GITHUB_OUTPUT"
          fi

  kani:
    name: Kani proofs
    needs: scope
    if: needs.scope.outputs.kani == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # Kani's binaries go outside ~/.cargo/bin, which rust-cache prunes of
      # anything it did not restore before the Kani cache is saved.
      - name: Cache Kani
        id: kani-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.kani-bin
          key: kani-${{ env.KANI_VERSION }}-${{ runner.os }}-v2

      - name: Install Kani
        if: steps.kani-cache.outputs.cache-hit != 'true'
        run: |
          cargo +stable install --locked --root ~/.kani-bin kani-verifier --version "$KANI_VERSION"
          PATH="$HOME/.kani-bin/bin:$PATH" cargo kani setup

      - name: Put Kani on the PATH
        run: echo "$HOME/.kani-bin/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: ./ob test kani
        run: ./ob test kani

  tla:
    name: TLA+ models
    needs: scope
    if: needs.scope.outputs.tla == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache the TLA+ tools
        uses: actions/cache@v4
        with:
          path: .cache/tla
          key: tla-${{ env.TLA_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: ./ob test tla
        run: ./ob test tla

  corpus:
    name: Shell corpus
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The corpus's sandbox is a user namespace, which Ubuntu's AppArmor
      # otherwise refuses to unprivileged users (ADR 0103).
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install host packages
        uses: ./.github/actions/apt-install
        with:
          packages: dash bash util-linux

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: ./ob test corpus
        run: ./ob test corpus

  # The container builds every port, the kernel, the programs and the
  # image with its own toolchain, and boots a few of them (ADR 0330):
  # what differs from the jobs above is the toolchain, not the code, and
  # the ports are where it showed (OpenSSH needed Automake, #163). The
  # whole of `ob --container test` runs every night instead
  # (container.yml). A pull request runs this job only when it changes
  # that toolchain or what builds with it (the scope job decides); main
  # runs it on every merge.
  container:
    name: Build container
    needs: scope
    if: needs.scope.outputs.container == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Allow QEMU to use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      # The Containerfile's apt-get fetches from Ubuntu's archive, which
      # the install step's fallback (.github/actions/apt-install) does
      # not reach. When the archive does not answer, the base image is
      # given kernel.org's mirror under its own name, which the build
      # then uses, so the Containerfile, which keys the ports' cache,
      # stays as it is. The base image has no CA certificates, so it gets
      # the runner's for HTTPS; apt checks the files against Ubuntu's
      # signing keys, as from any mirror.
      - name: Give the build container a mirror that answers
        run: |
          if curl -sf -m 30 -o /dev/null http://archive.ubuntu.com/ubuntu/dists/noble/InRelease; then
            exit 0
          fi
          echo "::warning::Ubuntu's archive did not answer; the build container fetches from mirrors.edge.kernel.org"
          # The engine ob picks, and the image the Containerfile starts from.
          engine=podman
          command -v podman >/dev/null 2>&1 || engine=docker
          base=$(sed -n 's/^FROM //p' tools/container/Containerfile | head -n 1)
          context=$(mktemp -d)
          cp /etc/ssl/certs/ca-certificates.crt "$context/"
          cat > "$context/Containerfile" <<EOF
          FROM $base
          COPY ca-certificates.crt /etc/ssl/certs/ca-certificates.crt
          RUN sed -i 's#http://[a-z.]*ubuntu\.com/ubuntu#https://mirrors.edge.kernel.org/ubuntu#g' \\
                /etc/apt/sources.list.d/ubuntu.sources
          EOF
          "$engine" pull "$base"
          "$engine" build -t "$base" "$context"

      # The container's own ports, keyed by its definition, which holds
      # its Clang.
      - name: Note the build container's version
        id: ports-key
        run: echo "toolchain=$(sha256sum tools/container/Containerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # As in the ports job (ADR 0560): restored on main too, since
      # container.yml builds every port from nothing each night, and saved
      # whenever a port was built, on a pull request too, for its next push.
      - name: Restore the built ports
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/container/ports/sources
          key: ports-container-${{ steps.ports-key.outputs.toolchain }}-${{ hashFiles('ports/**', 'abi/**', 'tools/**', 'rust-toolchain.toml') }}
          restore-keys: ports-container-${{ steps.ports-key.outputs.toolchain }}-

      - name: Note the ports' stamps
        id: before
        run: echo "stamps=$(cat out/ports/*.stamp 2>/dev/null | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: ./ob --container doctor
        run: ./ob --container doctor

      # One case each for UEFI and BIOS, the C ports on mlibc, storage,
      # TLS on ring, and the git, curl and OpenSSH ports: about 3 minutes.
      - name: ./ob --container test boot (smoke cases)
        run: >-
          ./ob --container test boot
          --case uefi-usb --case bios-cdrom --case posix --case storage
          --case tls --case git-https --case ssh

      - name: ./ob --container image
        run: ./ob --container image

      - name: See whether a port was built
        id: built
        env:
          BEFORE: ${{ steps.before.outputs.stamps }}
        run: |
          after=$(cat out/ports/*.stamp 2>/dev/null | sha256sum | cut -c1-16)
          if [ "$after" = "$BEFORE" ]; then echo "ports=false"; else echo "ports=true"; fi | tee -a "$GITHUB_OUTPUT"

      - name: Save the built ports
        if: steps.built.outputs.ports == 'true' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/container/ports/sources
          key: ports-container-${{ steps.ports-key.outputs.toolchain }}-${{ hashFiles('ports/**', 'abi/**', 'tools/**', 'rust-toolchain.toml') }}

  # The quick checks, in one job instead of one each, so that they hold
  # one runner instead of four. Each runs even when one before it failed,
  # so a failure here names every check that failed.
  checks:
    name: Licenses, sign-off, TUF and lab coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Some of the TUF suite's tests run the client under faketime;
      # Python and its venv module come with the runner.
      - name: Install faketime
        uses: ./.github/actions/apt-install
        with:
          packages: faketime

      - name: Cache the conformance suite
        uses: actions/cache@v4
        with:
          path: .cache/tuf-conformance
          key: tuf-conformance-${{ hashFiles('tools/xtask/src/tuf.rs') }}

      # The kernel takes the crates it patches from kernel/patched (ADR 0182).
      - name: Patch the kernel's crates
        run: ./ob crates

      - name: cargo deny (build tool)
        if: ${{ !cancelled() }}
        run: cargo deny --manifest-path Cargo.toml check
      # cargo-deny reads ./deny.toml unless told otherwise; the kernel has
      # its own, permissive-only policy.
      - name: cargo deny (kernel)
        if: ${{ !cancelled() }}
        run: cargo deny --manifest-path kernel/Cargo.toml --config kernel/deny.toml check
      # The user programs go into /system, so they get the kernel's policy.
      - name: cargo deny (user programs)
        if: ${{ !cancelled() }}
        run: cargo deny --manifest-path userspace/Cargo.toml --config kernel/deny.toml check

      # Every file needs copyright and license information (ADR 0026). The
      # REUSE tool is GPL-3.0-or-later and only checks the repository.
      - name: reuse lint
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install --quiet reuse==6.2.0
          "$RUNNER_TEMP/reuse/bin/reuse" lint

      - name: ./ob signoff
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: ./ob signoff "${{ github.event.pull_request.base.sha }}"

      # Every command, service, console page and API route Phase 16 adds
      # has lab tests that cover it (lab/coverage.toml; the handbook's Lab
      # tests chapter, Coverage).
      - name: ./ob lab coverage --check
        if: ${{ !cancelled() }}
        run: ./ob lab coverage --check

      # The TUF client against tuf-conformance (ADR 0380).
      - name: ./ob test tuf
        if: ${{ !cancelled() }}
        run: ./ob test tuf

      # The catalog's signed metadata, checked offline as a computer
      # checks it: a pull request that records a signing changes nothing
      # else (ADR 0594).
      - name: ./ob catalog verify
        if: ${{ !cancelled() }}
        run: ./ob catalog verify

  # The scripts of the bots (ADR 0534), which have unit tests of their own,
  # and every workflow, read by actionlint. Neither builds anything, so this
  # job needs no toolchain.
  workflows:
    name: Bot scripts and workflows
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: 1.7.12
      # From actionlint_1.7.12_checksums.txt in the release of that version,
      # for actionlint_1.7.12_linux_amd64.tar.gz.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The files are named, not the folder: from Node 22 a folder given to
      # --test is read as a file.
      - name: node --test the bots' scripts
        run: node --test .github/scripts/*.test.js

      - name: Install actionlint
        if: ${{ !cancelled() }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint

      - name: actionlint
        if: ${{ !cancelled() }}
        run: |
          "$RUNNER_TEMP/actionlint/actionlint" -color

  # The one check main's ruleset requires: it passes when every job above
  # passed, or was skipped on purpose, so that a job can be added, renamed
  # or split without changing the ruleset. The benchmarks are left out, as
  # they were from the required checks: their numbers move with the
  # runner, and a red one is read by hand.
  passed:
    name: CI passed
    if: always()
    needs: [build, docs, unit, chkdsk, smb-windows, virtualbox, boot, instructions, go-suite, scope, ports, kani, tla, corpus, container, checks, workflows]
    runs-on: ubuntu-24.04
    steps:
      - name: Check that every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::These jobs did not pass: $failed"
            exit 1
          fi
