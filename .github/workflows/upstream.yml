# Keeps the ports up with their upstreams (ADR 0370). Each Monday,
# `./ob ports outdated` asks each port's repository for its releases, and
# an issue is opened, or brought up to date, for each port whose upstream
# has a newer one; a person moves the pin, and signs the commit off, in a
# pull request that CI tests as any other. A port pinned by a release
# archive is asked in the repository its `[upstream]` names. Each day,
# `./ob security scan` asks what the system is built from (ADR 0534):
# cargo-audit reads every Cargo.lock, including the Rust bundles' ports',
# against the RustSec advisory database, and OSV is asked about each port
# that pins a git commit, each of its extra sources, each port pinned by a
# release archive (by the commit of the tag its `[upstream]` names) and
# each crate a recipe lists. A finding opens one issue labelled `security`
# and `sbom-scan`, never a second for the same ID, and the issue is closed
# when the finding no longer matches. `./ob ports audit` stays as the
# local check of the bundles' crates.
name: Upstream releases and advisories

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: upstream
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  outdated:
    name: ./ob ports outdated
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Find newer releases
        id: find
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ "$(date -u +%u)" != 1 ]; then
            echo "Not Monday: only the scan runs today."
            exit 0
          fi
          ./ob ports outdated --tsv > outdated.tsv
          cat outdated.tsv

      - name: Open or update an issue for each
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s outdated.tsv ] || exit 0
          while IFS="$(printf '\t')" read -r name pinned newer; do
            title="Port $name: $newer is out (pinned to $pinned)"
            body="Upstream of ports/$name has released $newer; the recipe pins $pinned.

          Move the pin in ports/$name/recipe.toml (commit and tag, or for a release
          archive its url and sha256, and the tag of its [upstream]), check that the
          patches still apply and that \`./ob ports --rebuild $name\` builds, and open
          a pull request; CI tests it as any other. Found by \`./ob ports outdated\`
          (ADR 0370)."
            open=$(gh issue list --state open --search "\"Port $name:\" in:title" \
              --json number,title --jq ".[] | select(.title | startswith(\"Port $name:\")) | .number" | head -n 1)
            if [ -n "$open" ]; then
              gh issue edit "$open" --title "$title" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          done < outdated.tsv

  # The daily scan of what the system is built from (ADR 0534). It fails
  # when the scan could not run to its end, as when an advisory source
  # cannot be reached, and then the issues are left as they are: an open
  # issue is closed only by a scan that ran.
  sbom-scan:
    name: ./ob security scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install cargo-audit
        # Keep in step with ADR 0370.
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Scan the Cargo.lock files, the ports' commits and crates
        run: ./ob security scan --json > findings.json

      - name: Open, reopen and close the issues
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { run } = require('./.github/scripts/sbom-scan.js');
            await run({ github, context, core });
