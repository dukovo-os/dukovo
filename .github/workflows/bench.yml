# The cost of system calls, IPC round trips, files, POSIX calls, the
# network and disks on Radix, held to Linux in the same kind of virtual
# machine (ADR 0039), each operation's fastest of three runs on each side
# (ADR 0046), measured again while one is over (ADR 0107), and once more
# on another runner when the only rows still over are close to parity
# (ADR 0559). The report goes into the job's summary and the numbers into
# an artifact.
#
# CI runs it on every pull request and merge to main. It also runs every
# night on main (ADR 0290): a merge cancels the run of the merge before
# it, so without this main's own numbers were seldom recorded, and a row
# that grew slower over several merges showed up first on someone else's
# pull request.
name: Benchmarks

on:
  workflow_call:
    inputs:
      # The cache ci.yml's ports job left for the run (ADR 0560), and the
      # start of the keys to fall back on; this workflow's own nightly run
      # names the cache itself.
      ports-key:
        type: string
        default: ""
      ports-prefix:
        type: string
        default: ""
      # The rust-std port's stamp, which keys the Rust cache (ADR 0560).
      std-stamp:
        type: string
        default: ""
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Linux parity
    runs-on: ubuntu-24.04
    outputs:
      close: ${{ steps.gate.outputs.close }}
    steps:
      - uses: actions/checkout@v4

      - name: Ready the runner
        uses: ./.github/actions/bench-setup
        with:
          ports-key: ${{ inputs.ports-key }}
          ports-prefix: ${{ inputs.ports-prefix }}
          std-stamp: ${{ inputs.std-stamp }}

      # A gate over only at rows close to parity passes here and names
      # them in out/bench/close.txt; the next job runs the gate again on
      # another runner and decides (ADR 0559).
      - name: ./ob bench
        id: gate
        run: |
          ./ob bench --gate --defer-close --summary "$GITHUB_STEP_SUMMARY"
          if [ -s out/bench/close.txt ]; then
            echo "::warning::Over the gate only by a little, at: $(paste -sd ';' out/bench/close.txt). Running the gate again on another runner"
            echo "close=true" >> "$GITHUB_OUTPUT"
          fi

      # How open and close scale with 1, 4 and 8 workers at once on 4
      # CPUs, next to Linux: every row held to Linux's time, as the
      # operations above are (ADR 0409).
      - name: ./ob bench --scaling --gate
        if: ${{ !cancelled() }}
        run: ./ob bench --scaling --gate --summary "$GITHUB_STEP_SUMMARY"

      # What the desktop's everyday work costs, beside labwc on Linux
      # (ADR 0724): a look in the summary, measured once. Nothing is
      # gated on it, and the Linux desktop's packages come from Ubuntu's
      # archive, so a failure here fails no pull request.
      - name: ./ob bench --desktop
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./ob bench --desktop --runs 1 --summary "$GITHUB_STEP_SUMMARY"

      # The lab's net boot of real machines, end to end in QEMU (ADR
      # 0429): the disk writer runs on the pinned Linux restored above,
      # and this job has KVM.
      - name: ./ob test lab-writer
        if: ${{ !cancelled() }}
        run: ./ob test lab-writer

      - name: Upload the benchmark numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            out/bench/report.md
            out/bench/results.json
            out/bench/boot-bench.log
            out/bench/boot-posix-bench.log
            out/bench/boot-linux.log
            out/bench/desktop.md
            out/bench/boot-desktop-bench.log
            out/bench/boot-linux-desktop.log
            out/bench-scaling/report.md
            out/bench-scaling/boot-scaling-radix.log
            out/bench-scaling/boot-scaling-linux.log
            out/lab-writer-check/serial-*.log
          if-no-files-found: ignore
          retention-days: 90

  # The gate once more, on a runner of its own, when the first passed it
  # on to another because the only rows over were close to parity (ADR
  # 0559). A host that slows one side of a row in every run is one
  # machine's; a loss of Radix's is on every machine, so it fails here
  # too. This run's verdict is the gate's, with no second hand-on.
  again:
    name: Linux parity, on another runner
    needs: bench
    if: needs.bench.outputs.close == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Ready the runner
        uses: ./.github/actions/bench-setup
        with:
          ports-key: ${{ inputs.ports-key }}
          ports-prefix: ${{ inputs.ports-prefix }}
          std-stamp: ${{ inputs.std-stamp }}

      - name: ./ob bench --gate
        run: ./ob bench --gate --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the benchmark numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-again
          path: |
            out/bench/report.md
            out/bench/results.json
            out/bench/boot-bench.log
            out/bench/boot-posix-bench.log
            out/bench/boot-linux.log
          if-no-files-found: ignore
          retention-days: 90
