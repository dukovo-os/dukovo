# The cost of system calls, IPC round trips, files, POSIX calls, the
# network and disks on Radix, held to Linux in the same kind of virtual
# machine (ADR 0039), each operation's fastest of three runs on each side
# (ADR 0046), measured again while one is over (ADR 0107), and once more
# on another runner when the only rows still over are close to parity
# (ADR 0559). The report goes into the job's summary and the numbers into
# an artifact.
#
# CI runs it on every pull request and merge to main. It also runs every
# night on main (ADR 0290): a merge cancels the run of the merge before
# it, so without this main's own numbers were seldom recorded, and a row
# that grew slower over several merges showed up first on someone else's
# pull request.
name: Benchmarks

on:
  workflow_call:
    inputs:
      # The cache ci.yml's ports job left for the run (ADR 0560), and the
      # start of the keys to fall back on; this workflow's own nightly run
      # names the cache itself.
      ports-key:
        type: string
        default: ""
      ports-prefix:
        type: string
        default: ""
      # The rust-std port's stamp, which keys the Rust cache (ADR 0560).
      std-stamp:
        type: string
        default: ""
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Experiment: the two-CPU round trips on one Intel 6975P-C runner, each
  # vCPU pinned to a core, main (with the switch request in its own line)
  # against two variants, legs alternating so that a drift of the host's
  # speed falls on all three alike.
  #   a: main with #600
  #   w: a, and a thread woken for an idle CPU handed to it (wake list)
  #   t: w, and a thread's wake-up fields packed into two cache lines
  bench:
    name: Linux parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Intel 6975P-C runners only
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p')
          echo "CPU: $model"
          case "$model" in
            *6975P-C*) ;;
            *) echo "::error::Not an Intel 6975P-C runner ($model): dispatch again"; exit 1 ;;
          esac

      - name: Ready the runner
        uses: ./.github/actions/bench-setup
        with:
          ports-key: ${{ inputs.ports-key }}
          ports-prefix: ${{ inputs.ports-prefix }}
          std-stamp: ${{ inputs.std-stamp }}

      - name: Round trips, a w t a w t
        run: |
          set -o pipefail
          mkdir -p out/ab
          leg() {
            git checkout -q -- kernel
            if [ -n "$2" ]; then git apply "tools/experiments/$2"; fi
            ./ob bench --runs 3 $3 > "out/ab/$1.log" 2>&1 || true
            cp out/bench/report.md "out/ab/$1.md" || true
            echo "--- $1 ($(date -u +%H:%M:%S))"
            grep -h "pinned vCPUs\|not pinned" "out/ab/$1.log" | head -2 || true
            grep "two CPUs\|each CPU at once" "out/ab/$1.md" | cut -d'|' -f2-4 || true
          }
          leg a1 "" ""
          leg w1 wakelist.diff --no-linux
          leg t1 wakelist-layout.diff --no-linux
          leg a2 "" --no-linux
          leg w2 wakelist.diff --no-linux
          leg t2 wakelist-layout.diff --no-linux

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round-trips-ab
          path: out/ab
          if-no-files-found: ignore
          retention-days: 30
