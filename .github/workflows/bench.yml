# The cost of system calls, IPC round trips, files, POSIX calls, the
# network and disks on Radix, held to Linux in the same kind of virtual
# machine (ADR 0039), each operation's fastest of three runs on each side
# (ADR 0046), measured again while one is over (ADR 0107), and once more
# on another runner when the only rows still over are close to parity
# (ADR 0559). The report goes into the job's summary and the numbers into
# an artifact.
#
# CI runs it on every pull request and merge to main. It also runs every
# night on main (ADR 0290): a merge cancels the run of the merge before
# it, so without this main's own numbers were seldom recorded, and a row
# that grew slower over several merges showed up first on someone else's
# pull request.
name: Benchmarks

on:
  workflow_call:
    inputs:
      # The cache ci.yml's ports job left for the run (ADR 0560), and the
      # start of the keys to fall back on; this workflow's own nightly run
      # names the cache itself.
      ports-key:
        type: string
        default: ""
      ports-prefix:
        type: string
        default: ""
      # The rust-std port's stamp, which keys the Rust cache (ADR 0560).
      std-stamp:
        type: string
        default: ""
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Experiment, on one Intel 6975P-C runner, legs alternating so that a
  # drift of the host's speed falls on all variants alike.
  bench:
    name: Linux parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Intel 6975P-C runners only
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p')
          echo "CPU: $model"
          case "$model" in
            *6975P-C*) ;;
            *) echo "::error::Not an Intel 6975P-C runner ($model): dispatch again"; exit 1 ;;
          esac

      - name: Ready the runner
        uses: ./.github/actions/bench-setup
        with:
          ports-key: ${{ inputs.ports-key }}
          ports-prefix: ${{ inputs.ports-prefix }}
          std-stamp: ${{ inputs.std-stamp }}

      # Where a forked process's own thread loses time before its first
      # sleep (586 against 512 ns an open and close after it), on Intel:
      # sched_yield, open and close, a chain of SSE adds and one of
      # integer multiplies, timed in the child before and after it sleeps
      # a millisecond, and which vector state components it holds in use.
      - name: Scaling, probes before and after a sleep, twice
        run: |
          set -o pipefail
          mkdir -p out/ab
          git apply tools/experiments/scaling-px.diff
          for round in 1 2; do
            ./ob bench --scaling --runs 3 --no-linux > "out/ab/s-pp$round.log" 2>&1 || true
            cp out/bench-scaling/report.md "out/ab/s-pp$round.md" || true
            echo "--- pp$round ($(date -u +%H:%M:%S))"
            grep "^| [148] \(threads\|processes\) |" "out/ab/s-pp$round.md" || true
            grep -h "probe\|xinuse" out/bench-scaling/*.log | sed 's/.*posix-bench: //' || true
          done
          git checkout -q -- userspace/posix

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round-trips-ab
          path: out/ab
          if-no-files-found: ignore
          retention-days: 30
