# Go's own tests of its standard library, run on Dukovo with the go command
# of the Go bundle (`ob test go-suite`): `go test -short` of every package
# that has tests, in a machine with 4 CPUs and 6 GiB, which is thought to
# take an hour or more with KVM. That is too long for a boot test's shard, so it is a job of
# its own: ci.yml calls it for a pull request that changes the Go port, its
# bundle, the Go programs or the code that builds and runs them, and anyone
# may start it by hand. The script's whole log is kept as an artifact.
#
# A nightly schedule is to be added when scheduled runs are turned back on.
name: Go test suite

on:
  workflow_call:
    inputs:
      # The cache ci.yml's ports job left for the run (ADR 0560), and the
      # start of the keys to fall back on; a run by hand names the cache
      # itself.
      ports-key:
        type: string
        default: ""
      ports-prefix:
        type: string
        default: ""
      # The rust-std port's stamp, which keys the Rust cache (ADR 0560).
      std-stamp:
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  go-suite:
    name: Go's tests on Dukovo
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Allow QEMU to use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Install host packages
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            qemu-system-x86 ovmf gcc flex gawk
            xorriso mtools dosfstools exfatprogs gdisk fdisk sleuthkit btrfs-progs e2fsprogs ntfs-3g dislocker libbde-utils scdoc mandoc
            udftools udfclient genisoimage
            clang-20 lld-20 llvm-20 libclang-rt-20-dev meson ninja-build cmake bison pkgconf autoconf zlib1g-dev

      # GRUB, which ./ob builds from its pinned source for the images
      # (ADR 0306): built once for each change to its recipe.
      - name: Cache GRUB
        uses: actions/cache@v4
        with:
          path: .cache/grub
          key: grub-${{ hashFiles('tools/xtask/src/grub.rs') }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ inputs.std-stamp && format('std-{0}', inputs.std-stamp) || '' }}
          save-if: false

      - name: Note the port toolchain's version
        id: ports-key
        run: echo "clang=$(clang-20 --version | head -n1 | tr -c 'A-Za-z0-9.\n' -)" >> "$GITHUB_OUTPUT"

      # The ports as ci.yml's ports job left them, or, for a run by hand,
      # the newest that main saved.
      - name: Restore the built ports
        uses: actions/cache/restore@v4
        with:
          path: |
            out/sysroot
            out/toolchain
            out/ports
            target/ports/sources
          key: ${{ inputs.ports-key || format('ports-host-{0}-{1}', steps.ports-key.outputs.clang, hashFiles('ports/**', 'abi/**', 'tools/**', 'rust-toolchain.toml')) }}
          restore-keys: ${{ inputs.ports-prefix || format('ports-host-{0}-', steps.ports-key.outputs.clang) }}

      # The ports on their own, so that building them again, after a
      # change every port builds on, does not eat into the suite's time.
      - name: ./ob ports
        timeout-minutes: 45
        run: ./ob ports

      - name: ./ob test go-suite
        timeout-minutes: 240
        run: ./ob test go-suite

      - name: Upload the suite's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-suite
          path: |
            out/test/go-suite.log
            out/test/boot-go-suite.log
            out/test/go-suite.ppm
          if-no-files-found: ignore
          retention-days: 30
