name: Feature request
description: Suggest something Dukovo should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you suggest
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
