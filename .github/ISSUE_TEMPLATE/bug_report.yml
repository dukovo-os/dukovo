name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ./ob run
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The output of `uname -a` in Dukovo, or the git commit you built.
    validations:
      required: true
  - type: textarea
    id: machine
    attributes:
      label: Machine
      description: QEMU (with its command line) or the real hardware model.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The serial log or panic report. Remove anything private.
      render: text
