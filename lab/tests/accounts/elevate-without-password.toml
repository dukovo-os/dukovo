about = "An administrator put in the elevate-without-password group, as a cloud machine's account is, elevates with no password asked, and taken out of it is asked again (ADR 0328)"
time = "2m"

# Asked for a password first, as every administrator is.
[[step]]
run = "elevate -n true"
exit = 1
expect = "a password is needed"
[[step]]
run = "user set --elevate-without-password lab"
root = true
expect = "lab is changed: elevates without a password."
[[step]]
run = "groups"
expect = ["admins", "elevate-without-password"]
[[step]]
run = "elevate -n id -u"
expect = "0"
# authd's audit names it.
[[step]]
run = "log -s authd"
root = true
expect = "no password needed"
[[step]]
run = "user set --elevate-with-password lab"
root = true
expect = "lab is changed: elevates with its password."
[[step]]
run = "elevate -n true"
exit = 1
expect = "a password is needed"
# Out of the group again.
[[step]]
run = "groups"
expect_not = "elevate-without-password"
