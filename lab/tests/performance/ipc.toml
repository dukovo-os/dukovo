about = "Pipes, signals, poll, event queues and futexes take no longer than on Linux"
time = "10m"

# Both systems run at the base clock for the rows (ADR 0557): the
# benchmark profile holds Dukovo's CPUs there, and the Linux kit holds
# the twin's own. The balanced profile is back at the end, since a
# passed test shares its boot with the next test.
[[step]]
run = "tune set benchmark"
root = true
expect = "the profile is benchmark"

# The POSIX benchmarks: the C program `ob bench` runs on both systems
# (userspace/posix/bench.c), here on the machine under test, against the
# same program built for Linux in the Linux kit. Every row is held to
# parity, as `ob bench --gate` holds it.
[[step]]
bench = "/system/tests/posix/bench"
rows = [
    "posix_pipe_mib",
    "posix_signal",
    "posix_poll",
    "posix_events_idle",
    "posix_poll_idle",
    "posix_futex_same_cpu",
    "posix_futex_cross_cpu",
    "posix_futex_shared_same_cpu",
    "posix_futex_shared_cross_cpu",
]

[[step]]
run = "tune set balanced"
root = true
expect = "the profile is balanced"
