about = "Diagnostic only: the memory types, interrupts and CPU speed behind the POSIX benchmarks on a real machine"
time = "20m"

[[step]]
run = "sh -c 'dmesg | grep -E \"Memory types|^\\[ *[0-9.]*\\]   0x|Time:|CPU frequency|Scheduler:|Paging:\"'"
root = true

[[step]]
run = "cat /processes/stat"

# The benchmarks alone, every line they print.
[[step]]
run = "/system/tests/posix/bench --network"

[[step]]
run = "cat /processes/stat"

# The same again, with each CPU's speed read every second meanwhile
# (each read measures every CPU for 10 ms, so these numbers are not the
# ones above).
[[step]]
run = "sh -c 'p=/kernel/devices/system/cpu/cpufreq; (i=0; while [ $i -lt 90 ]; do echo \"speed $i: $(cat $p/policy0/scaling_cur_freq) $(cat $p/policy1/scaling_cur_freq) $(cat $p/policy2/scaling_cur_freq) $(cat $p/policy3/scaling_cur_freq)\"; sleep 1; i=$((i + 1)); done) & /system/tests/posix/bench --network; wait'"

[[step]]
run = "cat /processes/stat"
