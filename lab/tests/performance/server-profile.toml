# A diagnosis, not a parity row: serverbench's nginx, PHP-FPM, PostgreSQL
# and idle-events rows with SERVERBENCH_PROFILE=raw, which samples the
# code of the whole machine, the kernel's by function, through
# /processes/profile during each measured pass and prints where the
# samples fell as BENCHPROF lines, in the test's log, with the
# processor's counts of TLB page walks, cache misses, instructions and
# cycles in user and kernel mode and the kernel's counts of TLB switches
# and flushes. Linux's side comes from a Linux kit whose kit.toml
# command line has the word linux-bench.profile=raw: its BENCHPROF lines
# are in the twin's linux-boot log of any performance test with a bench
# step. Run it by name.

about = "serverbench's nginx, PHP-FPM and PostgreSQL rows with a profile of the machine's user code, for finding where the servers' time goes"
time = "45m"
only_by_name = true
host_needs = ["scp", "ssh"]

# nginx from the lab's catalog, as every lab test has it
# (services/lab-catalog.sh); PHP and PostgreSQL from their files.
[[step]]
host = "sh {here}/../services/lab-catalog.sh {machine} {machine-port:22}"
expect = "copied: the test catalog"
[[step]]
run = "sh /users/lab/lab-catalog-add.sh"
root = true
expect = "added catalog labtest, which lists"
[[step]]
host = "sh {here}/../services/copy-bundle.sh net.php.php {machine} {machine-port:22}"
expect = "copied: net.php.php"
[[step]]
host = "sh {here}/../services/copy-bundle.sh org.postgresql.postgresql {machine} {machine-port:22}"
expect = "copied: org.postgresql.postgresql"
# From nothing: a run before may have left them installed.
[[step]]
run = "sh -c 'bundle remove --for-everyone --purge org.nginx.nginx > /dev/null 2>&1; bundle install --for-everyone --yes org.nginx.nginx --from labtest | tail -1'"
root = true
expect = "installed org.nginx.nginx"
[[step]]
run = "sh -c 'bundle remove --for-everyone --purge net.php.php > /dev/null 2>&1; bundle install --for-everyone --yes /users/lab/net.php.php.dkv | tail -1'"
root = true
expect = "installed net.php.php"
[[step]]
run = "sh -c 'bundle remove --for-everyone --purge org.postgresql.postgresql > /dev/null 2>&1; bundle install --for-everyone --yes /users/lab/org.postgresql.postgresql.dkv | tail -1'"
root = true
expect = "installed org.postgresql.postgresql"
# At the base clock, as the parity rows run (ADR 0557).
[[step]]
run = "tune set benchmark"
root = true
expect = "the profile is benchmark"
[[step]]
run = "sh -c 'SERVERBENCH_PROFILE=raw /system/tests/posix/serverbench poll events php nginx postgresql 2>&1'"
expect = "serverbench: done"
[[step]]
run = "tune set balanced"
root = true
expect = "the profile is balanced"
[[step]]
run = "bundle remove --for-everyone --purge org.nginx.nginx"
root = true
expect = "removed org.nginx.nginx"
[[step]]
run = "bundle remove --for-everyone --purge net.php.php"
root = true
expect = "removed net.php.php"
[[step]]
run = "bundle remove --for-everyone --purge org.postgresql.postgresql"
root = true
expect = "removed org.postgresql.postgresql"
