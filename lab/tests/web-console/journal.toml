# The web console's journal of what changed, as a hand edit goes through it,
# in each engine (ADR 0516): the service file of diskhealth is changed at
# the machine as root, which no console change explains, and the console's
# round that looks every 30 seconds finds it and shows it as a row made by
# hand, with its diff and the person whose elevated command named the file.
# An administrator signs in, reads the row and marks it seen with Keep it,
# which a locked session may not do and a second Keep it leaves as it was,
# and puts it back, which runs `admin put-back` as root, says that Spark
# reads the file when the service next starts, and has a row of its own that
# Keep it refuses. A change that is not there is refused by all three
# routes. admind is the service that answers.
#
# A browser script cannot run commands on the machine, so a root step
# first saves copies of three service files, and a root step each then adds
# a comment line naming an engine to one of them (diskhealth's for Chromium,
# nfsd's for Firefox, smbd's for WebKit). The edits are 45 seconds apart, so
# that the round finds each alone and each is a row of its own, and each
# waits after its command starts, so that no file's time is before the
# second authd's audit gives the command, which is how the row knows the
# command named the file. Each edit is a command of its own, short enough
# that its audit line names the whole path: the kernel's log keeps 200 bytes
# of a line, and a path past them is not in the line. Each engine then
# reads, keeps and puts back its own. A last root step leaves the files as the image has them,
# also when an engine the lab PC lacks was skipped, and removes the copies.
# The account is one this test makes and removes, so no script needs the
# lab's password.
about = "A service file changed by hand shows in the web console's journal with its diff and who changed it, is marked seen with Keep it and put back, in each engine"
time = "25m"
host_needs = ["curl"]

[[step]]
run = "sh -c 'echo lab-console-password | user add --admin wc-journal'"
root = true
expect = "Made wc-journal"
# The console answers within seconds of the boot; its last answer is shown
# so that a console that refuses this address, as a wrong port does, says
# so in the failure.
[[step]]
host = "sh -c 'i=0; while [ $i -lt 60 ] && ! curl -sk --max-time 5 -o /dev/null https://{machine}:{machine-port:9090}/api/1/health; do sleep 1; i=$((i + 1)); done; curl -sk --max-time 5 https://{machine}:{machine-port:9090}/api/1/health'"
expect = '{"ok":true}'
[[step]]
run = "sh -c 'mkdir -p /tmp/lab-journal && cp /system/settings/spark/services/diskhealth.toml /system/settings/spark/services/nfsd.toml /system/settings/spark/services/smbd.toml /tmp/lab-journal/'"
root = true
[[step]]
run = "sh -c 'sleep 1; echo \"# lab journal chromium\" >> /system/settings/spark/services/diskhealth.toml'"
root = true
[[step]]
run = "sh -c 'sleep 45; echo \"# lab journal firefox\" >> /system/settings/spark/services/nfsd.toml'"
root = true
[[step]]
run = "sh -c 'sleep 45; echo \"# lab journal webkit\" >> /system/settings/spark/services/smbd.toml'"
root = true
[[step]]
browser = "journal.mjs"
port = 9090
[[step]]
run = "sh -c 'for name in diskhealth nfsd smbd; do cmp -s /tmp/lab-journal/$name.toml /system/settings/spark/services/$name.toml || cp /tmp/lab-journal/$name.toml /system/settings/spark/services/$name.toml || exit 1; done; rm -r /tmp/lab-journal'"
root = true
[[step]]
run = "user remove --delete-home --yes wc-journal"
root = true
expect = "wc-journal is removed"
