<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab browser test page with a flaw</title>
<style>
  :root { color-scheme: light dark; }
  body { background: #ffffff; color: #1a1a1a; font: 1.125rem/1.5 sans-serif; margin: 2rem; }
  button { font: inherit; padding: 0.5rem 1rem; color: #1a1a1a; background: #e8e8e8; border: 2px solid #1a1a1a; }
  @media (prefers-color-scheme: dark) {
    body { background: #121212; color: #f2f2f2; }
    button { color: #f2f2f2; background: #2b2b2b; border-color: #f2f2f2; }
  }
</style>
</head>
<body>
<main>
  <h1>The lab can see this page</h1>
  <button type="button">Press me</button>
  <p aria-live="polite" id="state"></p>
  <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
</main>
<script>
  document.querySelector("button").addEventListener("click", function () {
    document.getElementById("state").textContent = "Pressed";
  });
</script>
</body>
</html>
