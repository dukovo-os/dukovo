# The Snapshots and backups page of the web console in each engine (design 5):
# the banner of a backup that failed and the need it makes on the Overview,
# What is protected held to what `snap list` and `backup list` say, Take a
# snapshot now, Browse and Restore N chosen with the browser in
# America/New_York, an administrator's restore of another account's file and a
# reader's restore of their own, Add a backup place on a USB stick with the
# recovery key shown once and saved as a file, Back up now, Check now, Show it
# again after the console was locked, Restore files… from the backup, Remove…,
# a reader's view and a phone at 390 by 844. Each look is dark, light, high
# contrast, forced colours and less motion, checked by axe.
#
# This test's first steps make the two accounts, a named snapshot of /users
# with two files of the reader's in it (the files are deleted after, so that
# the snapshot is the only place they are), and a backup place to an SSH
# address that does not answer: `backup add` checks that it can write where it
# is told, so the place is added to a folder and its file is changed to name
# the address, and a first `backup run` fails. The address is a port of this
# machine that nothing listens on, so that the failure comes at once and not
# when a network gives up. The stick is made a Btrfs and mounted under /volumes,
# which is where the page offers a disk. The steps after the browser look at
# what the page did on the machine: the files that Restore N chosen put beside
# the reader's folder's, the named snapshot that Take a snapshot now made, and
# the places that were added and removed. The last steps put the machine back:
# the places and their keys removed, the snapshots deleted, the stick unplugged
# and the accounts removed. The script runs each engine one after the other,
# so that an engine the lab PC lacks is skipped within it and the steps after
# it still run.
about = "The web console's Snapshots and backups page in each engine: a failed backup's banner and the Overview's need, What is protected, Take a snapshot now, Browse and Restore beside with the label in the browser's zone, an administrator's restore of another account's file, Add a backup place on a stick with the recovery key shown once and saved as a file, Back up now, Check now, Show it again, Restore files from a backup, Remove, a reader, and the phone"
time = "30m"
host_needs = ["curl"]

[[step]]
run = "sh -c 'echo lab-console-password | user add --admin wc-snap && echo lab-console-password | user add wc-snap-reader && user set --console --yes wc-snap-reader'"
root = true
expect = ["Made wc-snap", "Made wc-snap-reader", "wc-snap-reader is changed"]

# Two files of the reader's, kept in a snapshot with a name and then deleted:
# the page restores them beside where they were.
[[step]]
run = "sh -c 'echo notes first > /users/wc-snap-reader/notes.txt && echo plans first > /users/wc-snap-reader/plans.txt && chown wc-snap-reader /users/wc-snap-reader/notes.txt /users/wc-snap-reader/plans.txt && snap create --name lab-before /users && rm /users/wc-snap-reader/notes.txt /users/wc-snap-reader/plans.txt && echo kept-in-snapshot'"
root = true
expect = ["/snapshots/users/lab-before", "kept-in-snapshot"]
# What the page will read of that folder, as the command gives it.
[[step]]
run = "snap browse /users lab-before /users/wc-snap-reader --json"
root = true
expect = ["notes.txt", "plans.txt"]

# A backup place that does not answer: added to a folder, and its file made to
# name a server at a port that nothing listens on.
[[step]]
run = '''sh -c 'mkdir -p /tmp/lab-snap-dead && backup add --every day --verify never lab-nas /tmp/lab-snap-dead > /dev/null && printf "to = \"ssh://backup@127.0.0.1:1/srv/dukovo\"\nevery = \"day\"\nverify = \"never\"\n" > /system/settings/backup/lab-nas.toml && echo made-lab-nas' '''
root = true
expect = "made-lab-nas"
[[step]]
run = "sh -c 'backup run lab-nas; echo ended'"
root = true
expect = "ended"
[[step]]
run = "backup list"
root = true
expect = ["lab-nas", "127.0.0.1"]

# A USB stick of 1 GB with a Btrfs on it, mounted where the page finds a disk.
[[step]]
usb = "plug"
blank = "1G"
[[step]]
wait = "5s"
[[step]]
run = "lsblk -dbn -o NAME,SIZE,TYPE | awk '$2 == \"1073741824\" && $3 == \"disk\" { print $1 }' > ~/lab-stick && cat ~/lab-stick"
expect = "sd"
[[step]]
run = '''sh -c 'printf "g\nn\n\n\n\nw\n" | rdisk /devices/$(cat /users/lab/lab-stick) || exit 1' '''
root = true
expect = ["Partition 1 is added", "The kernel has read it"]
[[step]]
run = "sh -c 'b=$(cat /users/lab/lab-stick); mkfs-btrfs -f -L LABBACKUP /devices/${b}1 && mkdir -p /volumes/LABBACKUP && mount /devices/${b}1 /volumes/LABBACKUP && echo mounted'"
root = true
expect = "mounted"

# The console answers within seconds of the boot; its last answer is shown so
# that a console that refuses this address says so in the failure.
[[step]]
host = "sh -c 'i=0; while [ $i -lt 60 ] && ! curl -sk --max-time 5 -o /dev/null https://{machine}:{machine-port:9090}/api/1/health; do sleep 1; i=$((i + 1)); done; curl -sk --max-time 5 https://{machine}:{machine-port:9090}/api/1/health'"
expect = '{"ok":true}'
[[step]]
browser = "snapshots.mjs"
port = 9090

# What the page did, read on the machine. Take a snapshot now made a named
# snapshot of each place.
[[step]]
run = "sh -c 'snap list /users; snap list /shared; snap list /system/settings'"
expect = ["lab-page-take", "named"]
# Restore N chosen put a copy of each of the two files beside where it was,
# with the snapshot's time in its name, and nothing was written over.
[[step]]
run = "ls /users/wc-snap-reader"
root = true
expect = ["notes (", "plans (", "M).txt"]
[[step]]
run = "sh -c 'grep -h first /users/wc-snap-reader/*.txt'"
root = true
expect = ["notes first", "plans first"]
# The place on the stick was added with the key beside it, and was backed up.
[[step]]
run = "backup list"
root = true
expect = ["lab-stick", "/volumes/LABBACKUP"]
[[step]]
run = "backup show lab-stick"
root = true
expect = ["users:", "shared:", "settings:"]
# Remove… forgot the place that did not answer.
[[step]]
run = "sh -c 'backup list | grep -c lab-nas || true'"
root = true
expect = "0"

# The machine as it was: the places and their keys, the snapshots, the stick
# and the accounts.
[[step]]
run = '''sh -c 'backup remove lab-stick; for p in /users /shared /system/settings; do snap delete $p lab-page-take; done; snap delete /users lab-before; for s in /snapshots/users/restored-*; do [ -d "$s" ] && snap delete /users ${s##*/}; done; rm -rf /tmp/lab-snap-dead; echo cleaned' '''
root = true
expect = "cleaned"
[[step]]
run = "sh -c 'umount /volumes/LABBACKUP && rmdir /volumes/LABBACKUP; rm -f /users/lab/lab-stick; echo unmounted'"
root = true
expect = "unmounted"
[[step]]
usb = "unplug"
[[step]]
run = "sh -c 'for name in wc-snap wc-snap-reader; do user remove --delete-home --yes $name || exit 1; done'"
root = true
expect = ["wc-snap is removed", "wc-snap-reader is removed"]
