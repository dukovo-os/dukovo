# The Websites pages of the web console in each engine: the list at /websites
# held to what `website list --json` says, which `GET /api/1/websites` runs,
# Add a website at /websites/add and one site's page at /websites/{name}, each
# as the machine has it. Add a website shows what happens before anything is
# done: its plan is `website add --dry-run` (`GET /api/1/websites/plan/{name}`),
# and Preview the files first shows the files the command would write. Pressing
# Add the website runs the steps (`POST /api/1/websites/add`, a task): a static site with this
# machine's own certificate, and a PHP site that asks Let's Encrypt for a
# certificate, which cannot be got here, so the site stays live on HTTP and its
# page has Get the certificate. The page turns HTTPS on and off
# (`POST /api/1/websites/{name}/https`, a task) and removes a site, with its
# folder or without it, with its name typed first (`POST
# /api/1/websites/{name}/remove`, a task). Check the sites asks nginx to check
# the sites as they are (`GET /api/1/websites/check`). A site's file changed by
# hand is shown as changed and kept, and with a broken line in it nginx's check
# fails, nginx's own line is shown, and the page refuses to change a site until
# it passes (WEB-103). The list has the size of each site's folder and its visits
# of yesterday, and a site's page a chart of its last 30 days: dashes and "Not
# counted yet" before the logs are counted, then the numbers, which are what
# `website list --json` says. A site whose certificate could not be got is kept
# for certd to ask again, which its page says in place of Get a certificate, and
# Forget on the Certificates page stops. A reader sees it all and has no button
# that works, and a phone at 390 by 844 shows the list, a site and Add a
# website. Each look is dark, light, high contrast, forced colours and less
# motion, checked by axe.
#
# websites.mjs runs three times for each engine, with the machine in the state
# its word says, which the step before it writes to /tmp/lab-websites-machine
# with the machine's address and the lab PC's ports for its port 80 and 443:
# a, a machine with no site, where the script adds, changes and removes sites;
# b, where the first site's file has a line added by hand; and c, where that
# file has a line that nginx does not know. websites.sh makes the hand edits,
# counts the logs of the sites that phase a made (`website count --now`, as the
# daily count does for yesterday) before b, takes sites away, and says what is
# left.
#
# The Let's Encrypt order itself is not made here: `certificate.get` orders
# from Let's Encrypt and from nowhere else, so no lab machine can have it reach
# Pebble, and the machine's resolver, which leads every name to the machine
# itself, makes it fail at once, which is what the page must show. The
# certificate that the PHP site then uses is one that Pebble, Let's Encrypt's own
# test authority, made as services/acme.toml makes them, with `cert get
# --directory` and its TXT records added the way a person adds them: it names
# the PHP site's two names, and the page offers it as one that is here. nginx
# and PHP-FPM are installed for everyone and on, since the catalog's
# install step of Add a website needs the update server, which a lab has not.
# The resolver, the authorities and the accounts are put back by the last steps.
# The accounts are two that this test makes and removes, an administrator and a
# reader, so no script needs the lab's password.
about = "The web console's Websites pages in each engine: the list from website list, Add a website with what happens and Preview the files first, a static site with this machine's certificate, a PHP site whose certificate step fails and leaves it live on HTTP with Get the certificate after, a certificate that is here, HTTPS on and off, the order that certd is left to try again and Forget, the size and visits of each site before and after they are counted with the chart of the days, a site's file changed by hand and kept, Check the sites with a broken file, Remove with and without the folder, a reader, and the phone"
time = "45m"
fresh = true
host_needs = ["curl", "scp", "ssh", "openssl", "nc"]

[[step]]
run = "sh -c 'echo lab-console-password | user add --admin wc-websites && echo lab-console-password | user add wc-websites-reader && user set --console --yes wc-websites-reader'"
root = true
expect = ["Made wc-websites", "Made wc-websites-reader", "wc-websites-reader is changed"]
# The console answers within seconds of the boot; its last answer is shown
# so that a console that refuses this address says so in the failure.
[[step]]
host = "sh -c 'i=0; while [ $i -lt 60 ] && ! curl -sk --max-time 5 -o /dev/null https://{machine}:{machine-port:9090}/api/1/health; do sleep 1; i=$((i + 1)); done; curl -sk --max-time 5 https://{machine}:{machine-port:9090}/api/1/health'"
expect = '{"ok":true}'
[[step]]
host = "sh {here}/../services/copy-bundle.sh org.nginx.nginx {machine} {machine-port:22}"
expect = "copied: org.nginx.nginx"
[[step]]
host = "sh {here}/../services/copy-bundle.sh net.php.php {machine} {machine-port:22}"
expect = "copied: net.php.php"
[[step]]
host = "sh {here}/../services/copy-file.sh {here}/websites.sh {machine} {machine-port:22}"
expect = "copied: websites.sh"

# nginx and PHP-FPM, from nothing: a run before may have left either installed,
# with sites. Both are turned on, as the page leaves a machine that has them.
[[step]]
run = "sh -c 'sh /users/lab/websites.sh reset > /dev/null 2>&1; service php-fpm disable > /dev/null 2>&1; service nginx disable > /dev/null 2>&1; bundle remove --for-everyone --purge net.php.php > /dev/null 2>&1; bundle remove --for-everyone --purge org.nginx.nginx > /dev/null 2>&1; bundle install --for-everyone --yes /users/lab/org.nginx.nginx.dkv | tail -1'"
root = true
expect = "installed org.nginx.nginx"
[[step]]
run = "sh -c 'bundle install --for-everyone --yes /users/lab/net.php.php.dkv | tail -1'"
root = true
expect = "installed net.php.php"
[[step]]
run = "sh -c 'service nginx enable; service php-fpm enable'"
root = true
# Spark starts both at once; each shows as running when its process does,
# which takes seconds on a slow machine.
[[step]]
run = "sh -c 'i=0; while [ $i -lt 60 ] && ! service nginx status > /dev/null; do sleep 1; i=$((i + 1)); done; service nginx status'"
root = true
expect = "Active: active (running)"
[[step]]
run = "sh -c 'i=0; while [ $i -lt 60 ] && ! service php-fpm status > /dev/null; do sleep 1; i=$((i + 1)); done; service php-fpm status'"
root = true
expect = "Active: active (running)"

# Pebble and its DNS server, on the lab PC, and the machine trusting Pebble's
# authority and asking that DNS server, as services/acme.toml has it.
[[step]]
host = "sh {here}/../services/acme-pebble.sh {port:acme} {port:acmeman} {port:dns} {port:chall} {machine-port:80} {peer} {machine}"
background = true
ready = "pebble ready"
[[step]]
host = "sh {here}/../services/copy-file.sh ca.pem {machine} {machine-port:22}"
expect = "copied: ca.pem"
# The authority Pebble signs certificates with is not the one its own HTTPS
# has (ca.pem): it is made anew each time Pebble starts, and its management
# port gives it. The machine trusts both, so that website's check of a site
# over HTTPS trusts the certificate Pebble gave it.
[[step]]
host = "sh -c 'curl -fsS --noproxy \"*\" --cacert ca.pem https://127.0.0.1:{port:acmeman}/roots/0 > issuer.pem && grep -c \"BEGIN CERTIFICATE\" issuer.pem'"
expect = "1"
[[step]]
host = "sh {here}/../services/copy-file.sh issuer.pem {machine} {machine-port:22}"
expect = "copied: issuer.pem"
[[step]]
run = '''sh -c 'cp /system/settings/resolved /users/lab/wc-web-resolved.orig && cd /system/settings/ssl/certs && cat /system/resources/certificates/ca-certificates.crt /users/lab/ca.pem /users/lab/issuer.pem > roots.new && mv roots.new ca-certificates.crt && echo trusted' '''
root = true
expect = "trusted"
[[step]]
run = "sh -c 'cat > /system/settings/resolved && service resolved reload && echo resolver-set'"
root = true
input = "servers = {peer}:{port:dns}\ndns-over-tls = no\n"
expect = "resolver-set"
[[step]]
run = '''sh -c 'i=0; while [ $i -lt 20 ] && ! resolvectl query standalone.acme-lab.example > /dev/null 2>&1; do sleep 1; i=$((i + 1)); done; resolvectl query standalone.acme-lab.example' '''
expect = "standalone.acme-lab.example"

# The certificate the PHP site is given by the page when Let's Encrypt cannot be
# reached: Pebble's, for the names of the site and a name of its own, proved by
# DNS, so that nginx's port 80 is not needed.
[[step]]
run = '''sh -c 'cert remove site.acme-lab.example > /dev/null 2>&1; (cert get site.acme-lab.example --name site.acme-lab.example --name php.acme-lab.example --name www.php.acme-lab.example --dns --yes --directory https://{peer}:{port:acme}/dir --agree-terms --profile default > /users/lab/wc-web-dns.out 2>&1 < /dev/null &); echo started' '''
root = true
expect = "started"
[[step]]
host = "sh {here}/../services/acme-dns.sh {machine} {machine-port:22} {port:chall} /users/lab/wc-web-dns.out"
expect = ["TXT added: _acme-challenge.site.acme-lab.example.", "TXT added: _acme-challenge.php.acme-lab.example.", "TXT added: _acme-challenge.www.php.acme-lab.example.", "records shown: 3"]
[[step]]
run = '''sh -c 'service resolved reload; i=0; while [ $i -lt 90 ] && ! grep -q "installed" /users/lab/wc-web-dns.out; do sleep 2; i=$((i + 1)); done; grep installed /users/lab/wc-web-dns.out' '''
root = true
expect = "site.acme-lab.example installed: site.acme-lab.example, php.acme-lab.example, www.php.acme-lab.example, runs out "

# Chromium. From a machine with no site: the script adds a static site with this
# machine's certificate, a PHP site, and a plain site that it removes with and
# without its folder. Then a line is added to the first site's file by hand, and
# a line that nginx does not know.
[[step]]
run = "sh /users/lab/websites.sh reset"
root = true
expect = "reset"
[[step]]
host = '''sh -c 'printf "%s\n%s\n%s\n%s\n" {machine} {machine-port:80} {machine-port:443} a > /tmp/lab-websites-machine && echo phase-a' '''
expect = "phase-a"
[[step]]
browser = "websites.mjs"
engines = ["chromium"]
port = 9090
[[step]]
run = "sh /users/lab/websites.sh state"
root = true
expect = "sites: 2, php site: there, folders left of the removed: 0"
# The logs hold the requests that phase a made; they are counted as the daily
# count counts yesterday's, for today so far.
[[step]]
run = "sh /users/lab/websites.sh count"
root = true
expect = "counted"
[[step]]
run = "sh /users/lab/websites.sh edit"
root = true
expect = "edited "
[[step]]
host = '''sh -c 'printf "%s\n%s\n%s\n%s\n" {machine} {machine-port:80} {machine-port:443} b > /tmp/lab-websites-machine && echo phase-b' '''
expect = "phase-b"
[[step]]
browser = "websites.mjs"
engines = ["chromium"]
port = 9090
[[step]]
run = "sh /users/lab/websites.sh state"
root = true
expect = "sites: 2, php site: there, folders left of the removed: 0"
[[step]]
run = "sh /users/lab/websites.sh break"
root = true
expect = "broken "
[[step]]
host = '''sh -c 'printf "%s\n%s\n%s\n%s\n" {machine} {machine-port:80} {machine-port:443} c > /tmp/lab-websites-machine && echo phase-c' '''
expect = "phase-c"
[[step]]
browser = "websites.mjs"
engines = ["chromium"]
port = 9090
[[step]]
run = "sh /users/lab/websites.sh state"
root = true
expect = "sites: 2, php site: there, folders left of the removed: 0"
[[step]]
run = "sh /users/lab/websites.sh repair"
root = true
expect = "repaired "
[[step]]
run = "sh /users/lab/websites.sh reset"
root = true
expect = "reset"
[[step]]
run = "sh /users/lab/websites.sh gone"
root = true
expect = "gone"

