# The machine as it was: no site, nginx and PHP-FPM gone, the certificate that
# Pebble made gone, the resolver and the authorities the system's, and the
# accounts gone.
[[step]]
run = '''sh -c 'cert remove site.acme-lab.example > /dev/null 2>&1; service php-fpm disable > /dev/null 2>&1; service nginx disable > /dev/null 2>&1; bundle remove --for-everyone --purge net.php.php > /dev/null 2>&1; bundle remove --for-everyone --purge org.nginx.nginx > /dev/null 2>&1; cp /users/lab/wc-web-resolved.orig /system/settings/resolved && service resolved reload; ln -sf /system/resources/certificates/ca-certificates.crt /system/settings/ssl/certs/ca-certificates.crt; rm -f /users/lab/wc-web-* /users/lab/ca.pem /users/lab/issuer.pem /users/lab/websites.sh /users/lab/org.nginx.nginx.dkv /users/lab/net.php.php.dkv; rm -rf /shared/www/sites; echo restored' '''
root = true
expect = "restored"
[[step]]
run = "sh -c 'for name in wc-websites wc-websites-reader; do user remove --delete-home --yes $name || exit 1; done'"
root = true
expect = ["wc-websites is removed", "wc-websites-reader is removed"]
