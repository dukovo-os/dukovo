# A person's preferences of the web console (ADR 0516), in each engine: an
# account that is new has the defaults, the colours, the size of the text,
# whether things move and no time zone; a value of each kind that the
# route takes is changed and read back, from a session that is still
# locked, since the preferences are the person's own file; a value that the
# console does not know is refused with the name of its key and changes
# nothing; and the defaults are put back. admind is the service that
# answers. Each engine has an administrator of its own, which this test
# makes and removes, so no script needs the lab's password.
about = "A web console account that is new has the default preferences, changes one value of each kind and reads it back, is refused a value the console does not know, and puts the defaults back"
time = "5m"
host_needs = ["curl"]

[[step]]
run = "sh -c 'for engine in chromium firefox webkit; do echo lab-console-password | user add --admin wc-preferences-$engine || exit 1; done'"
root = true
expect = ["Made wc-preferences-chromium", "Made wc-preferences-firefox", "Made wc-preferences-webkit"]
# The console answers within seconds of the boot; its last answer is shown
# so that a console that refuses this address, as a wrong port does, says
# so in the failure.
[[step]]
host = "sh -c 'i=0; while [ $i -lt 60 ] && ! curl -sk --max-time 5 -o /dev/null https://{machine}:{machine-port:9090}/api/1/health; do sleep 1; i=$((i + 1)); done; curl -sk --max-time 5 https://{machine}:{machine-port:9090}/api/1/health'"
expect = '{"ok":true}'
[[step]]
browser = "preferences.mjs"
port = 9090
[[step]]
run = "sh -c 'for engine in chromium firefox webkit; do user remove --delete-home --yes wc-preferences-$engine || exit 1; done'"
root = true
expect = ["wc-preferences-chromium is removed", "wc-preferences-firefox is removed", "wc-preferences-webkit is removed"]
