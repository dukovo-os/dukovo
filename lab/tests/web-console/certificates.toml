# The Certificates page of the web console in each engine: the list held to
# `cert list --json` (`GET /api/1/certificates`, and each certificate's panel
# from `cert show`, `GET /api/1/certificates/{name}`) and what happened to
# them held to `cert history` (`GET /api/1/certificates/history/all`); the
# form that gets one, whose checks are `cert get --check`
# (`GET /api/1/certificates/check/{names}`) and whose Open port 80 is a
# trial of the firewall (`POST /api/1/firewall/add`, kept or undone with
# `POST /api/1/firewall/trial/keep` and `POST /api/1/firewall/trial/undo`); an
# order that cannot finish, which the page tells (`POST
# /api/1/certificates/{name}/get`); Renew now, Revoke and Remove of a
# certificate that Pebble, Let's Encrypt's own test authority, made
# (`POST /api/1/certificates/{name}/renew`, `POST
# /api/1/certificates/{name}/revoke`, `POST /api/1/certificates/{name}/remove`),
# and the one that was proved by DNS, which certd cannot renew; Upload your
# own, with its key sent once as a secret and nowhere kept (`POST
# /api/1/certificates/{name}/add`); the order that cannot finish, which
# certd is left to ask for again every hour: its row in the list (`GET
# /api/1/certificates/wanted/all`, `cert wanted --json`), seen by a reader with
# no button, and Forget, which asks first and stops it (`POST
# /api/1/certificates/{name}/forget`, `cert forget`); Use for this console,
# refused for a certificate that does not name the address the browser comes
# by, tried for five minutes for one that does, kept after the page came back
# on it and undone (`POST /api/1/console/certificate`, `POST
# /api/1/console/trial/keep`, `POST /api/1/console/trial/undo`, and
# `GET /api/1/console/fresh/{trial}`); and the machine's name changed with the
# page asking for nothing after the answer (`GET /api/1/machine/name`, `POST
# /api/1/machine/name`, `hostnamectl status`). A reader, who sees it all and
# no button, and a phone at 390 by 844. Each look is dark, light, high
# contrast, forced colours and less motion, checked by axe.
#
# The Let's Encrypt order itself is not made here: `certificate.get` orders
# from Let's Encrypt and from nowhere else, so no lab machine can have it
# reach Pebble, and no step may need the internet. The certificates Pebble
# made are made as services/acme.toml makes them, with `cert get --directory`
# (an HTTP-01 one, and one proved by DNS with its TXT records added the way a
# person adds them), and the page then renews, revokes and removes them: a
# renewal asks the authority the certificate came from. What the page does
# with an order is what it does without the authority: the checks, Open port
# 80 as a trial, and an order that cannot finish, since the machine's
# resolver leads every name, Let's Encrypt's too, to the machine itself. That
# order fails after it began, so it is kept for certd to ask again, which is
# the record the page shows.
# The machine's own name, its firewall, its console's certificate, its
# resolver and the record of the order that did not finish are put back by the
# steps before each engine and at the end. The accounts are two that this test
# makes and removes, an administrator and a reader, so no script needs the
# lab's password.
about = "The web console's Certificates page in each engine: the list held to cert list and cert show, the history, the checks of a name and Open port 80 as a trial of the firewall kept or undone, an order that cannot finish, which certd is left to try again and Forget stops, Renew now, Revoke and Remove of certificates Pebble made, the one proved by DNS and its Renew by DNS, Upload your own with its key sent once, Use for this console refused, tried, kept and undone, the machine's name changed with the page asking for nothing after it, a reader, and the phone"
time = "40m"
fresh = true
host_needs = ["curl", "scp", "ssh", "openssl", "nc"]

[[step]]
run = "sh -c 'echo lab-console-password | user add --admin wc-cert && echo lab-console-password | user add wc-cert-reader && user set --console --yes wc-cert-reader'"
root = true
expect = ["Made wc-cert", "Made wc-cert-reader", "wc-cert-reader is changed"]
# The console answers within seconds of the boot; its last answer is shown
# so that a console that refuses this address says so in the failure.
[[step]]
host = "sh -c 'i=0; while [ $i -lt 60 ] && ! curl -sk --max-time 5 -o /dev/null https://{machine}:{machine-port:9090}/api/1/health; do sleep 1; i=$((i + 1)); done; curl -sk --max-time 5 https://{machine}:{machine-port:9090}/api/1/health'"
expect = '{"ok":true}'
# The machine's name, kept to put back, and what the page will show of it.
# A machine that was never named has no hostname file and goes by the name
# it was built with, which is written to the file first, so that the steps
# after can see it kept.
[[step]]
run = "sh -c '[ -e /system/settings/hostname ] || hostnamectl set-hostname \"$(uname -n)\"; cp /system/settings/hostname /users/lab/wc-cert-name && hostnamectl status --json'"
root = true
expect = ["\"name\"", "\"local\""]

# Pebble and its DNS server, on the lab PC, and the machine trusting
# Pebble's authority and asking that DNS server, as services/acme.toml has it.
[[step]]
host = "sh {here}/../services/acme-pebble.sh {port:acme} {port:acmeman} {port:dns} {port:chall} {machine-port:80} {peer} {machine}"
background = true
ready = "pebble ready"
[[step]]
host = "sh {here}/../services/copy-file.sh ca.pem {machine} {machine-port:22}"
expect = "copied: ca.pem"
[[step]]
run = '''sh -c 'cp /system/settings/resolved /users/lab/wc-cert-resolved.orig && cd /system/settings/ssl/certs && cat /system/resources/certificates/ca-certificates.crt /users/lab/ca.pem > roots.new && mv roots.new ca-certificates.crt && echo trusted' '''
root = true
expect = "trusted"
[[step]]
run = "sh -c 'cat > /system/settings/resolved && service resolved reload && echo resolver-set'"
root = true
input = "servers = {peer}:{port:dns}\ndns-over-tls = no\n"
expect = "resolver-set"
[[step]]
run = '''sh -c 'i=0; while [ $i -lt 20 ] && ! resolvectl query standalone.acme-lab.example > /dev/null 2>&1; do sleep 1; i=$((i + 1)); done; resolvectl query standalone.acme-lab.example' '''
expect = "standalone.acme-lab.example"

# Chromium. From a machine with two certificates from Pebble, one proved on
# port 80 and one proved by DNS, and port 80 closed.
[[step]]
run = '''sh -c 'for name in standalone dns; do cert remove $name.acme-lab.example > /dev/null 2>&1; done; cert forget fails.acme-lab.example > /dev/null 2>&1; sed -i "/^allow tcp 80$/d" /system/settings/firewall; firewall load > /dev/null; firewall allow tcp 80 && cert get standalone.acme-lab.example --directory https://{peer}:{port:acme}/dir --agree-terms --email lab@acme-lab.example --profile default; status=$?; sed -i "/^allow tcp 80$/d" /system/settings/firewall; firewall load > /dev/null; exit $status' '''
root = true
expect = "standalone.acme-lab.example installed: standalone.acme-lab.example, runs out "
[[step]]
run = '''sh -c '(cert get dns.acme-lab.example --name dns.acme-lab.example --name "*.dns.acme-lab.example" --dns --yes --directory https://{peer}:{port:acme}/dir --agree-terms --profile default > /users/lab/wc-cert-dns.out 2>&1 < /dev/null &); echo started' '''
root = true
expect = "started"
[[step]]
host = "sh {here}/../services/acme-dns.sh {machine} {machine-port:22} {port:chall} /users/lab/wc-cert-dns.out"
expect = ["TXT added: _acme-challenge.dns.acme-lab.example.", "records shown: 2"]
[[step]]
run = '''sh -c 'service resolved reload; i=0; while [ $i -lt 90 ] && ! grep -q "installed" /users/lab/wc-cert-dns.out; do sleep 2; i=$((i + 1)); done; grep installed /users/lab/wc-cert-dns.out; firewall list | grep -c "tcp 80"; true' '''
root = true
expect = ["dns.acme-lab.example installed: dns.acme-lab.example, *.dns.acme-lab.example, runs out ", "0"]
# The name the page orders from Let's Encrypt leads to a public address no
# machine answers on (TEST-NET-1, RFC 5737), so that its checks pass and the
# order itself is what cannot finish. Pebble's DNS gives every other name
# this machine's address, which in the lab is a private one that a public
# authority's checks refuse (CRT-102).
[[step]]
host = '''sh -c 'printf "\173\"host\":\"fails.acme-lab.example.\",\"addresses\":[\"192.0.2.10\"]\175" | curl -fsS --noproxy "*" -X POST --data-binary @- http://127.0.0.1:{port:chall}/add-a && echo address-set' '''
expect = "address-set"
[[step]]
browser = "certificates.mjs"
engines = ["chromium"]
port = 9090
# What the page left: the machine has its own name, no rule for port 80 and
# no certificate the test made; the page's renewal and its refusal are in
# the history.
[[step]]
run = "sh -c 'test \"$(cat /system/settings/hostname)\" = \"$(cat /users/lab/wc-cert-name)\" && echo name-kept; firewall list | grep -c \"tcp 80\"; cert list | grep -Ec \"wc-cert-|acme-lab.example\"; true'"
root = true
expect = ["name-kept", "0"]
[[step]]
run = "cert history"
root = true
expect = ["standalone.acme-lab.example", "dns.acme-lab.example"]

# Firefox, from the two certificates again.
[[step]]
run = '''sh -c 'for name in standalone dns; do cert remove $name.acme-lab.example > /dev/null 2>&1; done; cert forget fails.acme-lab.example > /dev/null 2>&1; sed -i "/^allow tcp 80$/d" /system/settings/firewall; firewall load > /dev/null; firewall allow tcp 80 && cert get standalone.acme-lab.example --directory https://{peer}:{port:acme}/dir --agree-terms --email lab@acme-lab.example --profile default; status=$?; sed -i "/^allow tcp 80$/d" /system/settings/firewall; firewall load > /dev/null; exit $status' '''
root = true
expect = "standalone.acme-lab.example installed: standalone.acme-lab.example, runs out "
[[step]]
run = '''sh -c '(cert get dns.acme-lab.example --name dns.acme-lab.example --name "*.dns.acme-lab.example" --dns --yes --directory https://{peer}:{port:acme}/dir --agree-terms --profile default > /users/lab/wc-cert-dns.out 2>&1 < /dev/null &); echo started' '''
root = true
expect = "started"
[[step]]
host = "sh {here}/../services/acme-dns.sh {machine} {machine-port:22} {port:chall} /users/lab/wc-cert-dns.out"
expect = ["TXT added: _acme-challenge.dns.acme-lab.example.", "records shown: 2"]
[[step]]
run = '''sh -c 'service resolved reload; i=0; while [ $i -lt 90 ] && ! grep -q "installed" /users/lab/wc-cert-dns.out; do sleep 2; i=$((i + 1)); done; grep installed /users/lab/wc-cert-dns.out; firewall list | grep -c "tcp 80"; true' '''
root = true
expect = ["dns.acme-lab.example installed: dns.acme-lab.example, *.dns.acme-lab.example, runs out ", "0"]
[[step]]
browser = "certificates.mjs"
engines = ["firefox"]
port = 9090
[[step]]
run = "sh -c 'test \"$(cat /system/settings/hostname)\" = \"$(cat /users/lab/wc-cert-name)\" && echo name-kept; firewall list | grep -c \"tcp 80\"; cert list | grep -Ec \"wc-cert-|acme-lab.example\"; true'"
root = true
expect = ["name-kept", "0"]

# WebKit, from the two certificates again.
[[step]]
run = '''sh -c 'for name in standalone dns; do cert remove $name.acme-lab.example > /dev/null 2>&1; done; cert forget fails.acme-lab.example > /dev/null 2>&1; sed -i "/^allow tcp 80$/d" /system/settings/firewall; firewall load > /dev/null; firewall allow tcp 80 && cert get standalone.acme-lab.example --directory https://{peer}:{port:acme}/dir --agree-terms --email lab@acme-lab.example --profile default; status=$?; sed -i "/^allow tcp 80$/d" /system/settings/firewall; firewall load > /dev/null; exit $status' '''
root = true
expect = "standalone.acme-lab.example installed: standalone.acme-lab.example, runs out "
[[step]]
run = '''sh -c '(cert get dns.acme-lab.example --name dns.acme-lab.example --name "*.dns.acme-lab.example" --dns --yes --directory https://{peer}:{port:acme}/dir --agree-terms --profile default > /users/lab/wc-cert-dns.out 2>&1 < /dev/null &); echo started' '''
root = true
expect = "started"
[[step]]
host = "sh {here}/../services/acme-dns.sh {machine} {machine-port:22} {port:chall} /users/lab/wc-cert-dns.out"
expect = ["TXT added: _acme-challenge.dns.acme-lab.example.", "records shown: 2"]
[[step]]
run = '''sh -c 'service resolved reload; i=0; while [ $i -lt 90 ] && ! grep -q "installed" /users/lab/wc-cert-dns.out; do sleep 2; i=$((i + 1)); done; grep installed /users/lab/wc-cert-dns.out; firewall list | grep -c "tcp 80"; true' '''
root = true
expect = ["dns.acme-lab.example installed: dns.acme-lab.example, *.dns.acme-lab.example, runs out ", "0"]
[[step]]
browser = "certificates.mjs"
engines = ["webkit"]
port = 9090
[[step]]
run = "sh -c 'test \"$(cat /system/settings/hostname)\" = \"$(cat /users/lab/wc-cert-name)\" && echo name-kept; firewall list | grep -c \"tcp 80\"; cert list | grep -Ec \"wc-cert-|acme-lab.example\"; true'"
root = true
expect = ["name-kept", "0"]

# The machine as it was: the console serves its own certificate, the name is
# the one it had, the firewall has no rule for port 80, the resolver and the
# authorities are the system's, and the accounts are gone.
[[step]]
run = '''sh -c 'admin certificate this-machine > /dev/null 2>&1; hostnamectl set-hostname "$(cat /users/lab/wc-cert-name)" --apply > /dev/null 2>&1; for name in standalone dns; do cert remove $name.acme-lab.example > /dev/null 2>&1; done; cert forget fails.acme-lab.example > /dev/null 2>&1; sed -i "/^allow tcp 80$/d" /system/settings/firewall; firewall load; cp /users/lab/wc-cert-resolved.orig /system/settings/resolved && service resolved reload; ln -sf /system/resources/certificates/ca-certificates.crt /system/settings/ssl/certs/ca-certificates.crt; rm -f /users/lab/wc-cert-* /users/lab/ca.pem; echo restored' '''
root = true
expect = "restored"
[[step]]
run = "sh -c 'for name in wc-cert wc-cert-reader; do user remove --delete-home --yes $name || exit 1; done'"
root = true
expect = ["wc-cert is removed", "wc-cert-reader is removed"]
