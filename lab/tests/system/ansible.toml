# Ansible's collection dukovo.system manages an installed system from the
# lab PC, over SSH as the lab account through elevate, with the playbooks
# `ob test boot --case ansible` runs in QEMU (tools/xtask/src/test/ansible);
# ansible.sh beside this file makes ansible-core's environment and installs
# the collection that tools/xtask/src/test/ansible.lock pins, a release of
# dukovo-os/ansible fetched once. Without Python 3.13 or later on the lab PC,
# which ansible-core 2.22 needs, the test is skipped.
#
# Python, which the system has none of, comes by python.yml, with
# ansible.builtin.raw, from the lab's catalog (services/lab-catalog.sh).
# site.yml then runs each module once: facts, feature, service, bundle,
# snapshot and the channel of update; run again it must report changed=0.
# The lab's catalog lists no ripgrep, so ripgrep, which site.yml installs
# from the boot test's catalog, is installed from its file first, and the
# playbook finds it there. With the feature removed here, --check --diff
# must say it would be added, as the JSON of its state before and after,
# and leave it not added. update.yml follows the stable channel and stages
# the update the lab's update server offers, restarts the machine into it
# with reboot: true as the reboot module does, and checks that sysupdate
# status names the new version as running, as online.toml's machine does
# (ADRs 0466 and 0467).
about = "Ansible's dukovo.system manages the machine from the lab PC over SSH: python.yml installs Python with ansible.builtin.raw; site.yml runs facts, feature, service, bundle, snapshot and update's channel through elevate, and run again reports changed=0; with the feature removed, --check --diff reports it as JSON before and after and changes nothing; update.yml stages the update the lab's update server offers with reboot: true, and the machine comes back on the new version, which sysupdate status and the facts name as running (skipped without Python 3.13 or later on the lab PC)"
time = "60m"
fresh = true
host_needs = ["python3", "ssh", "ssh-keyscan", "sha256sum", "scp", "curl"]

# The update server, which the lab PC serves as online.toml's does, and the
# machine pointed at it, with a start proved in 10 seconds. The release is
# paused on its first day, so the machine is a canary, which takes it
# (ADR 0469).
[[step]]
host = "sh {here}/../updates/update-server.sh serve {port:updates}"
background = true
ready = "serving updates"
[[step]]
run = '''sh -c 'printf "stable = 10\n" > /system/settings/sysupdate/health.toml && printf "server = \"http://{peer}:{port:updates}/system/\"\ncanary = true\n" > /system/settings/sysupdate/updates.toml && echo "set: $((6 * 7))"' '''
root = true
expect = "set: 42"

# What site.yml turns on is off, and what it installs is there already,
# from its file.
[[step]]
run = "sh -c 'service discoverd disable; service --status-all | grep discoverd'"
root = true
expect = " [ - ]  discoverd"
[[step]]
host = "sh {here}/../services/copy-bundle.sh io.github.burntsushi.ripgrep {machine} {machine-port:22}"
expect = "copied: io.github.burntsushi.ripgrep"
[[step]]
run = "sh -c 'bundle remove --for-everyone --purge io.github.burntsushi.ripgrep > /dev/null 2>&1; bundle install --for-everyone --yes /users/lab/io.github.burntsushi.ripgrep.dkv | tail -1'"
root = true
expect = "installed io.github.burntsushi.ripgrep"
[[step]]
host = "sh {here}/../services/lab-catalog.sh {machine} {machine-port:22}"
expect = "copied: the test catalog"
[[step]]
run = "sh /users/lab/lab-catalog-add.sh"
root = true
expect = "added catalog labtest, which lists"

# Python, by raw: the one task that changes is the install.
[[step]]
host = "sh {here}/ansible.sh {machine} {machine-port:22} python.yml -e '{\"dukovo_python_from\": \"org.python.python --from labtest\"}'"
input = "{password}\n"
expect = ["changed: 1", "unreachable: 0", "failed: 0"]

# The modules, once: something changed, and everything did well.
[[step]]
host = "sh {here}/ansible.sh {machine} {machine-port:22} site.yml"
input = "{password}\n"
expect = ["unreachable: 0", "failed: 0"]
expect_not = "changed: 0"
# And again: nothing changes.
[[step]]
host = "sh {here}/ansible.sh {machine} {machine-port:22} site.yml"
input = "{password}\n"
expect = ["changed: 0", "unreachable: 0", "failed: 0"]

# What the modules did, read as the commands say it, as JSON (ADR 0541).
[[step]]
run = "sysupdate status --json"
root = true
expect = ["{\"format\":1,", "\"channel\":\"beta\""]
[[step]]
run = "feature list --json"
expect = ["{\"format\":1,", "\"id\":\"file-sharing\"", "\"state\":\"added\""]
[[step]]
run = "bundle list --json"
expect = ["{\"format\":1,", "\"id\":\"io.github.burntsushi.ripgrep\""]
[[step]]
run = "snap list /users --json"
root = true
expect = ["{\"format\":1,", "\"name\":\"ansible\""]

# A change here, and --check --diff says what it would do and does none.
[[step]]
run = "feature remove file-sharing"
root = true
expect = "File sharing is removed."
[[step]]
host = "sh {here}/ansible.sh {machine} {machine-port:22} site.yml --check --diff"
input = "{password}\n"
expect = ["changed: 1", "unreachable: 0", "failed: 0", "\"file-sharing\": \"not added\"", "\"file-sharing\": \"added\""]
[[step]]
run = "feature list"
expect = "file-sharing  not added  File sharing"

# The update: the stable channel, staged from the lab's server, the machine
# restarted into it by the module, and the new version running.
[[step]]
host = "sh {here}/ansible.sh {machine} {machine-port:22} update.yml -v"
input = "{password}\n"
expect = ["\"rebooted\": true", "unreachable: 0", "failed: 0"]
[[step]]
wait = "ready"
# The new start is an update being tried until its services have run steadily
# for the stable period (10 seconds, set above), which ends some time after the
# machine is ready, so status is asked again, for up to 3 minutes, until the
# update is the default.
[[step]]
run = '''sh -c 'i=0; while [ $i -lt 180 ] && ! sysupdate status | grep -q -e "-test.bridge, the default"; do sleep 2; i=$((i + 2)); done; sysupdate status' '''
root = true
expect = ["Running:  slot B", "-test.bridge, the default"]
