# What keeps a person's files safe, told as two people on one server live it.
# An administrator and a reader each make files of known content, over SSH as
# themselves, and the sums are kept. A USB stick becomes a backup place, and a
# second place is a folder on the machine's own disk; the first backup goes to
# both, and a snapshot of /users is taken and named. Files are then deleted and
# written over. The administrator brings theirs back from the snapshot and the
# reader theirs from the stick's backup, each with `snap restore`, and each
# folder matches its sums again. The reader cannot restore the administrator's
# files, over SSH or in the console. The stick is checked, unmounted and
# pulled out. Then the reader makes a large file, a backup to the folder on the
# disk is started and the power cord is pulled in the middle of writing it. The
# machine starts again: every Btrfs scrubs clean, every file reads back by its
# sum, the earlier backups restore by `backup verify --restore`, the backup
# that was cut off is not among them, and the console says what the machine
# knows: the last good backup is the earlier one, the stick is not plugged in,
# and nothing shows as running. The next round of backups then finishes and
# restores the large file whole.
#
# A stick plugged in while QEMU runs is gone with the QEMU that the cord pull
# ends, so the interrupted backup goes to the folder on the disk, which a cord
# pull leaves as it found it on every machine. The stick is pulled out before,
# as its owner would take it with them; on a real machine a person plugs and
# pulls it, which marks the steps that do so as steps for a person.
#
# /tmp/lab-journey-data-safety holds the keys of the two accounts and the
# facts the browser script reads; the first step makes it and the last takes it
# away.
about = "Two people's files kept safe: files of known sums, a USB stick and a folder as backup places, a snapshot, files deleted and written over, restored from the snapshot and from the backup and matched by sum, a reader refused another's files, then the cord pulled in the middle of a backup after which the filesystems are clean, the earlier backups restore, and the console reports the last good backup and nothing running"
time = "10m"
fresh = true
host_needs = ["ssh", "ssh-keygen", "scp"]

[[step]]
host = '''sh -c 'rm -rf /tmp/lab-journey-data-safety && mkdir -p /tmp/lab-journey-data-safety && cd /tmp/lab-journey-data-safety && ssh-keygen -q -t ed25519 -N "" -C journey-alice -f journey-alice && ssh-keygen -q -t ed25519 -N "" -C journey-bob -f journey-bob && printf "alice=journey-alice\nalice_password=lab-journey-password-1\nbob=journey-bob\nbob_password=lab-journey-password-2\n" > info && echo journey-ready' '''
expect = "journey-ready"
[[step]]
host = "sh {here}/../services/copy-file.sh /tmp/lab-journey-data-safety/journey-alice.pub {machine} {machine-port:22}"
expect = "copied: journey-alice.pub"
[[step]]
host = "sh {here}/../services/copy-file.sh /tmp/lab-journey-data-safety/journey-bob.pub {machine} {machine-port:22}"
expect = "copied: journey-bob.pub"
# An administrator and a reader, each with the key that signs them in over SSH.
[[step]]
run = '''sh -c 'echo lab-journey-password-1 | user add --admin journey-alice && echo lab-journey-password-2 | user add journey-bob && user set --console --yes journey-bob && user key add journey-alice "$(cat /users/lab/journey-alice.pub)" && user key add journey-bob "$(cat /users/lab/journey-bob.pub)"' '''
root = true
expect = ["Made journey-alice", "Made journey-bob"]

# Files of known content in each person's home.
[[step]]
host = "sh -c 'sh {here}/ssh-as.sh /tmp/lab-journey-data-safety journey-alice {machine} {machine-port:22} \"sh -s make\" < {here}/data-safety-files.sh'"
expect = "5"
[[step]]
host = "sh -c 'sh {here}/ssh-as.sh /tmp/lab-journey-data-safety journey-bob {machine} {machine-port:22} \"sh -s make\" < {here}/data-safety-files.sh'"
expect = "5"

# A USB stick, found as the disk that is new, is made a Btrfs and mounted where
# the console looks for a disk. The disks before it are listed first, so a
# stick of any size does: the lab's real sticks are 64 GB.
[[step]]
run = "lsblk -dn -o NAME,TYPE | awk '$2 == \"disk\" { print $1 }' > ~/lab-disks-before && echo listed"
expect = "listed"
[[step]]
usb = "plug"
blank = "1G"
[[step]]
wait = "5s"
[[step]]
run = "lsblk -dn -o NAME,TYPE | awk '$2 == \"disk\" { print $1 }' | grep -vxF -f ~/lab-disks-before > ~/lab-stick; cat ~/lab-stick"
expect = "sd"
[[step]]
run = "sh -c 'mkfs-btrfs -f -L JOURNEY /devices/$(cat /users/lab/lab-stick) && mkdir -p /volumes/JOURNEY && mount /devices/$(cat /users/lab/lab-stick) /volumes/JOURNEY && echo mounted'"
root = true
expect = "mounted"
# Backed up by hand, so that a round runs when the test says. The shelf is a
# folder of the machine's own disk outside the places that are backed up.
[[step]]
run = "backup add --every hand --verify never stick /volumes/JOURNEY"
root = true
expect = ["Added stick", "AGE-SECRET-KEY-1"]
[[step]]
run = "sh -c 'mkdir -p /system/state/journey-shelf && backup add --every hand --verify never shelf /system/state/journey-shelf'"
root = true
expect = ["Added shelf", "AGE-SECRET-KEY-1"]
[[step]]
run = "backup run"
root = true
expect = ["backup: stick: done", "backup: shelf: done", "(whole)"]
[[step]]
run = "backup list"
root = true
expect = ["stick", "shelf", "/volumes/JOURNEY", "/system/state/journey-shelf"]

# A snapshot with a name, taken after the backup and before the changes.
[[step]]
run = "snap create --name journey-before /users"
root = true
expect = "/snapshots/users/journey-before"

# Files are deleted and written over, by each person.
[[step]]
host = "sh -c 'sh {here}/ssh-as.sh /tmp/lab-journey-data-safety journey-alice {machine} {machine-port:22} \"sh -s change\" < {here}/data-safety-files.sh'"
expect = ["docs/numbers.txt", "docs/report.csv"]
expect_not = "notes.txt"
[[step]]
host = "sh -c 'sh {here}/ssh-as.sh /tmp/lab-journey-data-safety journey-bob {machine} {machine-port:22} \"sh -s change\" < {here}/data-safety-files.sh'"
expect = ["docs/numbers.txt", "docs/report.csv"]
[[step]]
host = "sh -c 'sh {here}/ssh-as.sh /tmp/lab-journey-data-safety journey-alice {machine} {machine-port:22} \"sh -s check\" < {here}/data-safety-files.sh'"
expect = ["matching: 0", "FAILED"]

# The administrator's files come back from the snapshot, as the administrator.
[[step]]
host = "sh -c 'sh {here}/ssh-as.sh /tmp/lab-journey-data-safety journey-alice {machine} {machine-port:22} \"sh -s restore journey-before\" < {here}/data-safety-files.sh'"
expect = ["Restored /users/journey-alice/docs/notes.txt", "Restored /users/journey-alice/docs/photos"]
[[step]]
host = "sh -c 'sh {here}/ssh-as.sh /tmp/lab-journey-data-safety journey-alice {machine} {machine-port:22} \"sh -s check\" < {here}/data-safety-files.sh'"
expect = "matching: 5"
expect_not = "FAILED"

# The reader's come back from the stick's backup: a restore of /users from it
# makes a snapshot of its own, which the reader copies from.
[[step]]
run = "backup restore --place /users stick"
root = true
expect = "Restored the backup of users at "
[[step]]
host = "sh -c 'sh {here}/ssh-as.sh /tmp/lab-journey-data-safety journey-bob {machine} {machine-port:22} \"sh -s restore-backup\" < {here}/data-safety-files.sh'"
expect = ["restoring from restored-", "Restored /users/journey-bob/docs/notes.txt"]
[[step]]
host = "sh -c 'sh {here}/ssh-as.sh /tmp/lab-journey-data-safety journey-bob {machine} {machine-port:22} \"sh -s check\" < {here}/data-safety-files.sh'"
expect = "matching: 5"
expect_not = "FAILED"

# The reader cannot take the administrator's files, from the snapshot or from
# the backup, and the administrator's folder is as it was.
[[step]]
host = "sh -c 'sh {here}/ssh-as.sh /tmp/lab-journey-data-safety journey-bob {machine} {machine-port:22} \"snap restore --from journey-before --to /users/journey-bob/taken.txt /users/journey-alice/docs/notes.txt; echo status=\\$?; ls /users/journey-bob\"'"
expect = ["status=1"]
expect_not = ["Restored", "taken.txt"]
[[step]]
host = "sh -c 'sh {here}/ssh-as.sh /tmp/lab-journey-data-safety journey-bob {machine} {machine-port:22} \"snap browse /users journey-before /users/journey-alice/docs; echo status=\\$?\"'"
expect = "status=1"
expect_not = "notes.txt"

# The stick is left clean, unmounted and pulled out, as its owner takes it away.
[[step]]
run = "sh -c 'umount /volumes/JOURNEY && fsck-btrfs /devices/$(cat /users/lab/lab-stick)'"
root = true
expect = "no error found"
[[step]]
usb = "unplug"

# The reader's large file, and the sums of everything on disk before the
# backup that is cut off.
[[step]]
host = "sh -c 'sh {here}/ssh-as.sh /tmp/lab-journey-data-safety journey-bob {machine} {machine-port:22} \"sh -s big\" < {here}/data-safety-files.sh'"
expect = "300000000"
[[step]]
run = "sh -c 'backup list --json | tr \",\" \"\\n\" | grep done_ms > /users/lab/journey-done-before; backup show --json shelf | tr \",\" \"\\n\" | grep at_ms > /users/lab/journey-backups-before; cat /users/lab/journey-done-before; wc -l < /users/lab/journey-backups-before; sync'"
root = true
expect = "done_ms"
# The round runs in the background, and the cord is pulled as soon as the
# shelf holds a file that is not yet whole, which a backup names when it is.
[[step]]
run = '''sh -c 'sh -c "$0" < /dev/null > /dev/null 2>&1 &' 'backup run shelf > /users/lab/journey-cut.out 2>&1' '''
root = true
[[step]]
run = '''sh -c 'i=0; while [ $i -lt 600 ] && ! find /system/state/journey-shelf -name "*.partial" | grep -q partial; do sleep 0.2; i=$((i + 1)); done; find /system/state/journey-shelf -name "*.partial"' '''
root = true
expect = ".partial"
[[step]]
power = "cut"
[[step]]
power = "on"
[[step]]
wait = "ready"

# The machine after the cord: every Btrfs is clean, every file reads back by its
# sum, and the cut-off file of the shelf is still where it was left.
[[step]]
run = "sh -c 'for place in /users /shared /system/settings; do scrub start -B -r $place || exit 1; done'"
root = true
expect = ["Status:           finished", "no errors found"]
[[step]]
host = "sh -c 'sh {here}/ssh-as.sh /tmp/lab-journey-data-safety journey-alice {machine} {machine-port:22} \"sh -s check\" < {here}/data-safety-files.sh'"
expect = "matching: 5"
expect_not = "FAILED"
[[step]]
host = "sh -c 'sh {here}/ssh-as.sh /tmp/lab-journey-data-safety journey-bob {machine} {machine-port:22} \"sh -s check\" < {here}/data-safety-files.sh'"
expect = "matching: 5"
expect_not = "FAILED"
[[step]]
host = "sh -c 'sh {here}/ssh-as.sh /tmp/lab-journey-data-safety journey-bob {machine} {machine-port:22} \"sh -s bigcheck\" < {here}/data-safety-files.sh'"
expect = "big.bin: OK"
# What the machine says of the backups: the last good one is the one before,
# and the earlier backups restore whole.
[[step]]
run = "sh -c 'backup list --json | tr \",\" \"\\n\" | grep done_ms > /users/lab/journey-done-after; cmp /users/lab/journey-done-before /users/lab/journey-done-after && echo last-good-unchanged'"
root = true
expect = "last-good-unchanged"
# The backups the shelf lists are the ones it listed before: a backup that was
# cut off is not one of them, whether or not it left a file.
[[step]]
run = "sh -c 'backup show --json shelf | tr \",\" \"\\n\" | grep at_ms > /users/lab/journey-backups-after; cmp /users/lab/journey-backups-before /users/lab/journey-backups-after && echo same-backups'"
root = true
expect = "same-backups"
[[step]]
run = "backup list"
root = true
expect = ["shelf", "stick", "failed: it was cut off"]
[[step]]
run = "backup verify --restore shelf"
root = true
expect = ["every chain whole", "files and folders as they were"]

# The console, with the stick away: the administrator sees the places and the
# last good backups, and the reader cannot restore the administrator's files.
[[step]]
host = "sh -c 'i=0; while [ $i -lt 60 ] && ! curl -sk --max-time 5 -o /dev/null https://{machine}:{machine-port:9090}/api/1/health; do sleep 1; i=$((i + 1)); done; curl -sk --max-time 5 https://{machine}:{machine-port:9090}/api/1/health'"
expect = '{"ok":true}'
[[step]]
browser = "data-safety-console.mjs"
engines = ["chromium"]
port = 9090

# The reader's refused restore left nothing in the administrator's folder.
[[step]]
run = "ls -a /users/journey-alice/docs"
root = true
expect = "numbers.txt"
expect_not = "taken"

# The next round removes what the cut left, finishes, and has the large file
# whole in what it restores.
[[step]]
run = "backup run shelf"
root = true
expect = "backup: shelf: done"
[[step]]
run = "sh -c 'find /system/state/journey-shelf -name \"*.partial\" | grep -c partial; true'"
root = true
expect = "0"
[[step]]
run = "backup verify --restore shelf"
root = true
expect = ["every chain whole", "files and folders as they were"]
[[step]]
run = "backup restore --place /users shelf"
root = true
expect = "Restored the backup of users at "
[[step]]
run = "sh -c 'cd $(ls -d /snapshots/users/restored-* | tail -n 1)/journey-bob/docs && sha256sum -c /users/journey-bob/.big.sum'"
root = true
expect = "big.bin: OK"

# The machine as it was.
[[step]]
run = '''sh -c 'backup remove stick; backup remove shelf; rm -rf /system/state/journey-shelf; for snapshot in journey-before; do snap delete /users $snapshot; done; for s in /snapshots/users/restored-*; do [ -d "$s" ] && snap delete /users ${s##*/}; done; rm -f /volumes/JOURNEY; rmdir /volumes/JOURNEY; for name in journey-alice journey-bob; do user remove --delete-home --yes $name || exit 1; done; rm -f /users/lab/journey-* /users/lab/lab-stick /users/lab/lab-disks-before; echo restored' '''
root = true
expect = ["journey-bob is removed", "restored"]
[[step]]
host = "sh -c 'rm -rf /tmp/lab-journey-data-safety; echo gone'"
expect = "gone"
