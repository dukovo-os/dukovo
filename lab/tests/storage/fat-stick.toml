about = "A USB stick formatted FAT holds a file through unmounting, and its check finds no fault"
time = "4m"

[[step]]
usb = "plug"
blank = "64M"
[[step]]
wait = "5s"
# Find the stick by its size, which no system disk has, and keep its name
# for the steps below. Nothing is formatted unless one was found.
[[step]]
run = "lsblk -dn | awk '$2 == \"64M\" && $4 == \"disk\" { print $1 }' > /tmp/stick && cat /tmp/stick"
expect = "sd"
[[step]]
run = "sh -c 'mkfs-fat -n LABSTICK /devices/$(cat /tmp/stick)'"
root = true
expect = ["made FAT16", "label LABSTICK"]
[[step]]
run = "sh -c 'mkdir -p /volumes/lab-stick && mount /devices/$(cat /tmp/stick) /volumes/lab-stick && echo on-the-stick > /volumes/lab-stick/hello.txt'"
root = true
[[step]]
run = "findmnt /volumes/lab-stick"
expect = ["vfat", "rw"]
# What was written is still there after unmounting and mounting again.
[[step]]
run = "sh -c 'umount /volumes/lab-stick && mount /devices/$(cat /tmp/stick) /volumes/lab-stick && cat /volumes/lab-stick/hello.txt && umount /volumes/lab-stick'"
root = true
expect = "on-the-stick"
[[step]]
run = "sh -c 'fsck-fat -n /devices/$(cat /tmp/stick)'"
root = true
expect = "1 files"
[[step]]
run = "sh -c 'blkid /devices/$(cat /tmp/stick)'"
root = true
expect = ["LABEL=\"LABSTICK\"", "TYPE=\"vfat\""]
[[step]]
usb = "unplug"
