about = "A USB stick formatted exFAT holds a file through unmounting"
time = "4m"

# The disks there before the stick, so the stick is the one that is new
# and a stick of any size does (the lab's real sticks are 64 GB).
[[step]]
run = "lsblk -dn -o NAME,TYPE | awk '$2 == \"disk\" { print $1 }' > ~/lab-disks-before && echo listed"
expect = "listed"
[[step]]
usb = "plug"
blank = "64M"
[[step]]
wait = "5s"
# Find the stick, the disk that is new, and keep its name
# in the lab's home for the steps below, which root runs: each account has
# a /tmp of its own. Nothing is formatted unless a stick was found.
[[step]]
run = "lsblk -dn -o NAME,TYPE | awk '$2 == \"disk\" { print $1 }' | grep -vxF -f ~/lab-disks-before > ~/lab-stick; cat ~/lab-stick"
expect = "sd"
[[step]]
run = "sh -c 'mkfs-exfat -L LABEX /devices/$(cat /users/lab/lab-stick)'"
root = true
expect = ["made exFAT", "label LABEX"]
[[step]]
run = "sh -c 'mkdir -p /volumes/lab-stick && mount /devices/$(cat /users/lab/lab-stick) /volumes/lab-stick && echo on-the-stick > /volumes/lab-stick/hello.txt'"
root = true
[[step]]
run = "findmnt /volumes/lab-stick"
expect = ["exfat", "rw"]
[[step]]
run = "sh -c 'umount /volumes/lab-stick && mount /devices/$(cat /users/lab/lab-stick) /volumes/lab-stick && cat /volumes/lab-stick/hello.txt && umount /volumes/lab-stick'"
root = true
expect = "on-the-stick"
[[step]]
run = "sh -c 'blkid /devices/$(cat /users/lab/lab-stick)'"
root = true
expect = ["LABEL=\"LABEX\"", "TYPE=\"exfat\""]
[[step]]
usb = "unplug"
