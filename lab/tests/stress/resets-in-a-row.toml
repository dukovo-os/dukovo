about = "Three resets in a row, each one once the system is up: it boots back every time"
time = "15m"

[[step]]
power = "reset"
[[step]]
wait = "ready"
[[step]]
power = "reset"
[[step]]
wait = "ready"
[[step]]
power = "reset"
[[step]]
wait = "ready"
[[step]]
run = "uname -a"
expect = "Dukovo"
