# Sets of lab tests to run together: `./ob lab run --preset <name>`, or
# the preset list on the runner page (`./ob lab ui`). Tests are named as
# `run` takes them: by id or by category. The lab's docs/test-files.md
# describes the file.

[[preset]]
name = "quick"
title = "Quick check"
about = "A few minutes on QEMU: boots, signs in over SSH, runs commands, pulls the cable"
tests = ["boot/reaches-ready", "ssh/commands", "network/link-pull"]

[[preset]]
name = "journeys"
title = "User journeys"
about = "About forty minutes on QEMU with KVM: a new server's first weeks, a person's files kept safe through a power cut, an update and a bad one from the console, and a day of two people and an SSH session at once"
tests = ["journeys"]
