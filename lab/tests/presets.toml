# Sets of lab tests to run together: `./ob lab run --preset <name>`, or
# the preset list on the runner page (`./ob lab ui`). Tests are named as
# `run` takes them: by id or by category. The lab's docs/test-files.md
# describes the file.

[[preset]]
name = "quick"
title = "Quick check"
about = "A few minutes on QEMU: boots, signs in over SSH, runs commands, pulls the cable"
tests = ["boot/reaches-ready", "ssh/commands", "network/link-pull"]

[[preset]]
name = "journeys"
title = "User journeys"
about = "About forty minutes on QEMU with KVM: a new server's first weeks, a person's files kept safe through a power cut, an update and a bad one from the console, and a day of two people and an SSH session at once"
tests = ["journeys"]

[[preset]]
name = "redteam"
title = "Red team"
about = "The security range's own attacker, the red-team kit, probing the machine: a port scan, nmap's vulnerability and crypto scripts, password guessing against SSH and the console, nuclei, sqlmap and ffuf against the console's API, and a connection flood with slowloris"
tests = [
    "security/attacker-stays-in",
    "security/port-scan",
    "security/nmap-vulns",
    "security/password-attacks",
    "security/web-attacks",
    "security/flood",
]

# Storage is named test by test, to leave out the audio CD, disc burning,
# floppy, CompactFlash, memory card reader and SD slot tests, whose media a
# server has none of. The optical drive's own test stays. The week-long
# soak, stress/server-week, runs only when a run names it.
[[preset]]
name = "server"
title = "Server release"
about = "What a server release is held to: every category but sound, and the storage tests a server has the media for (not audio CDs, disc burning, floppies, CompactFlash or card readers), the server benchmarks among them; the week-long soak runs on its own, by name"
tests = [
    "boot",
    "install",
    "updates",
    "startup",
    "hardware",
    "processes",
    "network",
    "ssh",
    "services",
    "bundles",
    "monitoring",
    "reports",
    "system",
    "time",
    "accounts",
    "commands",
    "console",
    "web-console",
    "stress",
    "security",
    "performance",
    "sharing",
    "journeys",
    "storage/backup",
    "storage/block-devices",
    "storage/btrfs-maintenance",
    "storage/btrfs-stick",
    "storage/disk-info",
    "storage/exfat-stick",
    "storage/fat-stick",
    "storage/grow-partition",
    "storage/idle-read",
    "storage/io-weight",
    "storage/machine-restore",
    "storage/make-and-identify",
    "storage/mount-read-only",
    "storage/ntfs-resize",
    "storage/optical",
    "storage/restic-backup",
    "storage/root-filesystem",
    "storage/send-receive",
    "storage/snapshot-stick",
    "storage/swap",
    "storage/trim-and-scrub",
]
