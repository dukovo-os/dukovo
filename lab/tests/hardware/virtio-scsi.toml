about = "The disks of a virtio SCSI adapter, as Google Cloud and Proxmox attach them, are sd disks that say their model and serial number, and writes reach them. Needs a virtual machine with a virtio SCSI disk"
time = "2m"
hardware = ["virtio-scsi"]

# The kernel found a disk on the adapter, at a target and logical unit.
[[step]]
run = "sh -c 'dmesg | grep \"on the virtio SCSI adapter\" | head -1'"
root = true
expect = ["Disk: sd", "target", "LUN"]
# Each says what it is, as a SATA disk does.
[[step]]
run = "sh -c 'for d in $(dmesg | grep -o \"Disk: sd[a-z]* is a SCSI disk\" | cut -d\" \" -f2); do echo $d $(cat /kernel/block/$d/device/model) serial=$(cat /kernel/block/$d/device/serial); done'"
root = true
expect = ["sd", "serial=lab-scsi-disk"]
# Writes reach the disk and read back the same.
[[step]]
run = "sh -c 'for d in $(dmesg | grep -o \"Disk: sd[a-z]* is a SCSI disk\" | cut -d\" \" -f2); do [ \"$(cat /kernel/block/$d/device/serial)\" = lab-scsi-disk ] && disk=$d; done; head -c 4194304 /devices/urandom > /tmp/lab-scsi && dd if=/tmp/lab-scsi of=/devices/$disk bs=1M conv=fsync 2>/dev/null && dd if=/devices/$disk of=/tmp/lab-scsi-back bs=1M count=4 2>/dev/null && cmp /tmp/lab-scsi /tmp/lab-scsi-back && echo \"$disk rea\"\"d back the same\"; rm -f /tmp/lab-scsi /tmp/lab-scsi-back'"
root = true
expect = "read back the same"
