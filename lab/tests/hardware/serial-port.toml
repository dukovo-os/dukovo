about = "The first serial port, COM1, is the terminal /devices/ttyS0 at 115200 baud, the speed GRUB and the kernel log run: stty reads its speed and sets another, and serial-console, the console a computer with no screen uses, stays stopped when the kernel has no console= flag and the firmware names no console port. Needs a machine with COM1 that is not its console"
time = "2m"

# A machine whose console is COM1 (the lab's real machines, started
# with console=ttyS0) runs serial-console on it instead: not this test.
[[step]]
run = "cat /kernel/cmdline"
expect_not = "console=ttyS0"
or_skip = "the kernel was started with console=ttyS0, so COM1 is the serial console"
# The kernel made the terminal when it found COM1, at the log's speed.
[[step]]
run = "sh -c 'dmesg | grep -q \"is the terminal /devices/ttyS0, at 115200 baud\" && echo \"ma\"\"de: yes\"'"
root = true
expect = "made: yes"
[[step]]
run = "stty -F /devices/ttyS0 -a"
root = true
expect = "speed 115200 baud"

# Another speed takes, and the line goes back to the log's own at once.
[[step]]
run = "sh -c 'stty -F /devices/ttyS0 9600; echo \"no\"\"w: $(stty -F /devices/ttyS0 -a | head -n 1)\"; stty -F /devices/ttyS0 115200'"
root = true
expect = "now: speed 9600 baud"
[[step]]
run = "stty -F /devices/ttyS0 -a"
root = true
expect = "speed 115200 baud"

# With no console= flag and no port the firmware sends its console to
# (ACPI SPCR, ADR 0481), the serial console has nothing to do: Spark
# started it, it ended with 0, and it stays stopped.
[[step]]
run = "serial-console"
expect = "no console= flag and no firmware console port: no serial console"
[[step]]
run = "service serial-console status"
root = true
exit = 3
expect = ["serial-console - Serial console", "Active: inactive (dead)", "Last: ended with wait status 0x0"]
