about = "The PCI devices are found and named: a network card, a USB controller and a storage controller, SATA or NVMe"
time = "2m"

# A machine's disk sits on a SATA controller (the OptiPlex, QEMU) or an
# NVMe one (the M75q), which lspci names "SATA controller" or
# "Non-Volatile memory controller".
[[step]]
run = "sh -c 'lspci; lspci | grep -q -e \"SATA controller\" -e \"Non-Volatile memory controller\" && echo \"storage controller: found\"'"
expect = ["Ethernet controller", "USB controller", "storage controller: found"]
[[step]]
run = "lspci -nn"
expect = "]: "
