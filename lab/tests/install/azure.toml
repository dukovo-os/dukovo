about = "On Azure, cloud-setup set the machine up from Azure's instance metadata service, its name and the admin account with its SSH key, and told Azure's wire server the machine is ready, at each boot; Azure's portal shows the machine running and its deployment succeeded (ADR 0423). Needs an Azure machine made from the cloud image's .vhd, of the Standard security type, without accelerated networking, with an admin account and an SSH key; the portal is checked by hand"
time = "3m"

# Where the machine's data came from, and the report.
[[step]]
run = "log -s cloud-setup"
root = true
expect = [
    "from Azure's instance metadata service",
    "making an administrator's account",
    "told Azure instance",
    "is ready",
]
expect_not = ["Azure's wire server answered", "telling Azure the machine is ready:"]
# The instance kept is Azure's machine ID.
[[step]]
run = "cat /system/state/cloud-setup/instance"
root = true
expect = "-"
# The machine is named as Azure named it.
[[step]]
run = "sh -c 'log -s cloud-setup | grep \"naming the machine\"'"
root = true
expect = "cloud-setup: naming the machine "
# The root grew over Azure's disk, 30 GiB or more, from the image's
# 580 MiB.
[[step]]
run = "sh -c 'df -m /system | tail -1 | awk \"{ print (\\$2 > 4096) ? \\\"grown\\\" : \\\"not grown\\\" }\"'"
expect = "grown"
expect_not = "not grown"
