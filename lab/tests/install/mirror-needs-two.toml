about = "The installer's Disk page offers Mirror two disks (Btrfs RAID1), and with one disk besides the stick says it needs a second and cannot be chosen; nothing is written. The install onto two disks, and starting with either gone, is the install-mirror boot test's under QEMU, as a lab test gets one disk"
time = "5m"
boot = "stick"
disk = "8G"

# The stick's menu starts the installer by itself; the first two pages
# keep their answers.
[[step]]
serial = "consoled: install: the installer's screens on tty1"
[[step]]
screen = ["Step 1 of 6", "How do you want to install?"]
[[step]]
keys = ["ret"]
[[step]]
screen = ["Step 2 of 6", "Network cards found:"]
[[step]]
keys = ["ret"]

# Disk: the mirror is offered, and needs a disk the lab machine lacks.
[[step]]
screen = ["Step 3 of 6", "Erase the disk", "Mirror two disks (Btrfs RAID1)", "needs a second disk"]
[[step]]
screen_gone = "Mirror onto"
[[step]]
screenshot = "mirror-needs-two"
