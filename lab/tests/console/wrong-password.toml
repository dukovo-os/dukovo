about = "A wrong password at the console's sign-in is refused, logged and leaves no one signed in; the right one then works"
time = "5m"

[[step]]
screen = "Name:"
[[step]]
type = "lab\n"
[[step]]
screen = "Password:"
[[step]]
type = "not-the-lab-password\n"
[[step]]
screen = "The name or the password is wrong."
[[step]]
serial = "authd: a wrong password for lab"
# The sign-in asks again, and the right password signs in.
[[step]]
type = "lab\n"
[[step]]
screen = "Password:"
[[step]]
type = "{password}\n"
[[step]]
serial = "authd: lab signed in on pts/"
[[step]]
screen = "lab@dukovo ~ $"

# Sign out, which brings the sign-in back for the next test.
[[step]]
type = "exit\n"
[[step]]
serial = "authd: lab signed out on pts/"
[[step]]
screen = "Name:"
