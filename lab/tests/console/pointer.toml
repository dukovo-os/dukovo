about = "A USB pointer reaches /devices/mouse: where it points, scaled to the screen, and each button going down and up"
time = "5m"

# Sign in as the lab account, at the console.
[[step]]
screen = "Name:"
[[step]]
type = "lab\n"
[[step]]
screen = "Password:"
[[step]]
type = "{password}\n"
[[step]]
serial = "authd: lab signed in on pts/"
[[step]]
screen = "lab@dukovo ~ $"
# Three Motion records of 40 bytes (radix-input(2)): pointing at the bottom
# right corner of the screen, whatever its size, the left button down, then
# up.
[[step]]
type = "elevate head -c 120 /devices/mouse | hexdump -Cv\n"
[[step]]
screen = "[elevate] Password for lab"
[[step]]
type = "{password}\n"
[[step]]
serial = "authd: lab elevated on pts/"
[[step]]
wait = "3s"
[[step]]
point = [-1, -1]
[[step]]
click = "left"
# Each record's x and y are 65535, the screen's far edge, at bytes 24 to
# 31; the second record's buttons, at 72, hold the left one.
[[step]]
screen = ["00000010  00 00 00 00 00 00 00 00  ff ff 00 00 ff ff 00 00", "00000040  ff ff 00 00 ff ff 00 00  01 00 00 00 01 00 00 00", "00000078"]

# Sign out, which brings the sign-in back for the next test.
[[step]]
type = "exit\n"
[[step]]
serial = "authd: lab signed out on pts/"
[[step]]
screen = "Name:"
