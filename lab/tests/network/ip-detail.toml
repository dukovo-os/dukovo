about = "ip shows a single link in full, the links in brief, and the IPv6 routes (network/router checks the router's)"
time = "2m"

[[step]]
run = "ip link show net0"
expect = ["net0", "mtu 1500", "state UP", "link/ether"]
# -br is one line a link: its name, state, address and flags.
[[step]]
run = "ip -br link"
expect = ["lo", "net0", "UP", "LOWER_UP"]
[[step]]
run = "ip -6 route"
expect = "dev net0"
