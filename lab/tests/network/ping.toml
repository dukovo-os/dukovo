about = "ping reaches the loopback and the default gateway, counting its packets and timing each, as iputils does"
time = "3m"

[[step]]
run = "ping -c 3 127.0.0.1"
expect = [
    "PING 127.0.0.1 (127.0.0.1)",
    "bytes from 127.0.0.1: icmp_seq=",
    "3 packets transmitted, 3 received, 0% packet loss",
    "rtt min/avg/max/mdev =",
]
[[step]]
run = "ping -c 2 ::1"
expect = ["PING ::1 (::1)", "bytes from ::1: icmp_seq=", "0% packet loss"]
# The gateway's address differs from machine to machine, so take it from
# the default route rather than naming one.
[[step]]
run = "ping -c 2 \"$(ip -4 route | awk '/^default/ { print $3; exit }')\""
expect = ["bytes from ", "2 packets transmitted, 2 received, 0% packet loss"]
