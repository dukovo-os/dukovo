about = "netcheck passes every layer of the lab machine's network, and with --internet the update server's name, port and certificate too"
time = "5m"

# The machine has only just started, so its clock may not have been set
# by a time server yet, which is a warning (exit status 2) and not a
# failure: the loop asks again for a minute until no layer has failed.
# A lab network that gives no router fails the gateway layer at once
# (NET-121), which asking again does not change. The output is shown
# whatever the status.
[[step]]
run = '''sh -c 'i=0; while [ $i -lt 30 ]; do netcheck > /tmp/netcheck.out; s=$?; [ $s -le 2 ] && break; grep -q NET-121 /tmp/netcheck.out && break; sleep 2; i=$((i + 1)); done; cat /tmp/netcheck.out; [ $s -le 2 ] || grep -q NET-121 /tmp/netcheck.out' '''
expect = ["link      passed", "address   passed"]
# netcheck checks nothing past a gateway it does not have: on a lab
# network whose DHCP server gives no router, as a lab PC that routes
# nothing does for its real machines, the rest of the test is skipped,
# and the layers below the gateway have passed.
[[step]]
run = "grep -c 'gateway   passed' /tmp/netcheck.out"
or_skip = "the lab network gives no router (NET-121), so netcheck checks nothing past the address"
[[step]]
run = "cat /tmp/netcheck.out"
expect = [
    "gateway   passed",
    "dns       passed",
    "mtu       passed",
    "internet  not checked",
]
expect_not = "FAILED"
# Beyond the local network: the update server this system follows
# resolves, answers on its port and has a certificate the system trusts.
[[step]]
run = '''sh -c 'netcheck --internet > /tmp/netcheck.out; s=$?; cat /tmp/netcheck.out; [ $s -le 2 ]' '''
expect = ["dns       passed", "internet  passed", "its certificate is trusted"]
expect_not = ["FAILED", "not checked"]
