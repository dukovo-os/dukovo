about = "The network card has an IPv4 address from DHCP and an IPv6 link-local address, and nic lists it as up (network/router checks what a router gives)"
time = "2m"

[[step]]
run = "ip -br addr"
expect = ["lo", "127.0.0.1", "net0", "UP"]
[[step]]
run = "ip -4 addr show net0"
expect = "inet "
[[step]]
run = "ip -6 addr show net0"
expect = ["inet6 ", "scope link"]
[[step]]
run = "ip route"
expect = "dev net0"
[[step]]
run = "nic"
expect = ["net0", "yes"]
