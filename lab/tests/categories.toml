# The lab's categories, in the order the runner page's left side and
# `./ob lab list` show them. Each is a folder of tests here; a new folder
# needs its entry. The lab's docs/test-files.md describes the file.

[[category]]
name = "boot"
title = "Boot and power"
about = "Starting up, restarting and turning off, cleanly and not"

[[category]]
name = "install"
title = "Installing"
about = "The install stick: its menu, the installer's screens, and the installed system's first boot"

[[category]]
name = "updates"
title = "Updates"
about = "Updates staged in the spare slot, tried, proved and rolled back, the boot menu and fallbacks that keep a machine starting, and the snapshots files come back from"

[[category]]
name = "hardware"
title = "Hardware and drivers"
about = "The devices found and working: controllers, disks, USB, CPUs and memory"

[[category]]
name = "sound"
title = "Sound"
about = "The sound outputs and their volume: audio and audiod"

[[category]]
name = "processes"
title = "Processes and monitors"
about = "The running processes and the tools that show them: ps, top, kill, free, who and the rest"

[[category]]
name = "storage"
title = "Disks and filesystems"
about = "The root's Btrfs, and filesystems made, written and read back on sticks"

[[category]]
name = "network"
title = "Network"
about = "Addresses, routes, ports, the firewall, the cable, and WireGuard tunnels to the lab PC"

[[category]]
name = "ssh"
title = "SSH"
about = "Signing in and running commands over SSH, and SSH's own tools"

[[category]]
name = "services"
title = "Services and logs"
about = "Spark's services: listed, stopped and started, and what they log; and the catalog's services, such as nginx"

[[category]]
name = "monitoring"
title = "Monitoring and alerts"
about = "The machine's history and its Prometheus endpoint, read by the lab PC's promtool and checked against free, df and ps, and what reaches the owner: alerts by email and to webhooks, and the early warning of a disk filling"

[[category]]
name = "time"
title = "Time and date"
about = "The clock, the time zone, and keeping time by NTP"

[[category]]
name = "accounts"
title = "Accounts and elevate"
about = "Accounts made and removed, groups, running as root, the keyring, and Kerberos tickets from the lab PC's KDC"

[[category]]
name = "commands"
title = "Commands"
about = "The command-line tools: files, text, archives, git, the shell and help"

[[category]]
name = "console"
title = "The console"
about = "Signing in at the machine's own screen and keyboard, consoles and typing"

[[category]]
name = "web-console"
title = "Web console"
about = "The admin console in real browsers: pages, actions, sign-in and accessibility"

[[category]]
name = "stress"
title = "Stress and soak"
about = "Power cut mid-write and mid-boot, resets in a row, a full disk, many processes, a flapping cable, a stick pulled mid-copy, and long runs that must not leak"

[[category]]
name = "security"
title = "Security"
about = "Probing the machine from a private network only an attacker shares with it: open ports, and SSH's sign-in and crypto"

[[category]]
name = "performance"
title = "Performance against Linux"
about = "Dukovo's time for each operation, held to Linux's on the same machine"

[[category]]
name = "sharing"
title = "File sharing"
about = "SMB and NFS shares, both ways, with the lab PC's Samba and NFS server"
