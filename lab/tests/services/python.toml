# Python from the catalog runs CPython's whole test suite on real hardware
# (ADR 0495): installed for everyone, its interpreter runs the suite with
# a worker for each processor, leaving out only the tests that
# python-skips.txt lists, each with the reason it fails on Dukovo. The
# suite runs the program by its path, as a script or Ansible does, so no
# question is asked; its network tests stay off, as on Python's own
# buildbots without the network resource.
about = "Python from the catalog passes CPython's test suite, but for the tests python-skips.txt lists with their reasons (ADR 0495)"
time = "90m"
host_needs = ["scp", "ssh"]

[[step]]
host = "sh {here}/lab-catalog.sh {machine} {machine-port:22}"
expect = "copied: the test catalog"
[[step]]
run = "sh /users/lab/lab-catalog-add.sh"
root = true
expect = "added catalog labtest, which lists"
[[step]]
host = "sh {here}/copy-file.sh {here}/python-skips.txt {machine} {machine-port:22}"
expect = "copied: python-skips.txt"
# From nothing: a run before may have left it installed.
[[step]]
run = "sh -c 'bundle remove --for-everyone --purge org.python.python > /dev/null 2>&1; bundle install --for-everyone --yes org.python.python --from labtest | tail -1'"
root = true
expect = "installed org.python.python"
[[step]]
run = "/applications/org.python.python/bin/python3 -c 'import sys; print(sys.platform, sys.version_info[:2])'"
expect = "radix (3, 15)"
# The list without its comments, as --ignorefile reads every line as a
# pattern. The suite's result is last, after the files that failed, the
# line each one's worker ended with and what the worker printed after it,
# which shows a crash, a time out or an uncaught exception as well as a
# failed test, and each failed test's traceback, which -W (--verbose3) has
# the suite print with the output of a test that fails, without running
# it again.
[[step]]
run = '''sh -c 'grep -v -e "^#" -e "^$" /users/lab/python-skips.txt > /tmp/python-skips; cd /tmp && /applications/org.python.python/bin/python3 -m test -j0 -W --timeout 1200 --ignorefile /tmp/python-skips > /tmp/python-suite.log 2>&1; grep -A12 -E "tests? failed( again)?:" /tmp/python-suite.log; grep -A40 -E "\] test[^ ]* (failed|worker|timed out|process crashed|interrupted)" /tmp/python-suite.log | head -n 300; grep -A25 -E "^(FAIL|ERROR): " /tmp/python-suite.log | head -n 400; tail -n 1 /tmp/python-suite.log' '''
expect = "Result: SUCCESS"
[[step]]
run = "bundle remove --for-everyone --purge org.python.python"
root = true
expect = "removed org.python.python"
