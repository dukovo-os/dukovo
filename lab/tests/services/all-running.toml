about = "Spark has every default service running; the off-by-default ones stay off"
time = "2m"

# Anyone may read the list: `show` goes to Spark's read socket, which
# answers everyone (ADR 0515); only root sees what the services' output
# said, and only root changes a service.
[[step]]
run = "service --status-all"
expect = ["[ + ]  logd", "[ + ]  sshd"]
[[step]]
run = "service --status-all"
root = true
expect = [
    "[ + ]  logd",
    "[ + ]  authd",
    "[ + ]  bundled",
    "[ + ]  consoled",
    "[ + ]  netd",
    "[ + ]  resolved",
    "[ + ]  timed",
    "[ + ]  discoverd",
    "[ + ]  sshd",
    "[ + ]  volumed",
    "[ + ]  diskhealth",
    "[ + ]  snap",
    "[ + ]  notifyd",
    "[ + ]  audiod",
    "[ + ]  updated",
    # Sharing folders is off until someone turns it on.
    "[ - ]  nfsd",
    "[ - ]  smbd",
]
[[step]]
run = "service sshd status"
root = true
expect = ["sshd - Sign-in over SSH", "Active: active (running)"]
