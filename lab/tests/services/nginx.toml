# nginx from the catalog, on the machine's own network card (ADR 0491):
# installed for everyone and enabled, it serves the lab PC over HTTP and,
# with the machine's own certificate, which certd keeps and Spark gives it
# (ADR 0512), over HTTPS to a client that trusts that certificate alone,
# with no -k; the lab PC then keeps 16 requests at a time coming for 20
# seconds while the machine has nginx reload its settings five times, and
# again while the machine makes the certificate anew twice, 10 seconds
# apart, and no request may go without its page. The certificate nginx
# serves afterwards is the new one.
about = "nginx from the catalog serves the lab PC over HTTP and, with the machine's own certificate from certd, over HTTPS to a client that trusts it; reloads and renewals of the certificate under load lose no request (ADRs 0491, 0512)"
time = "6m"
host_needs = ["curl", "scp", "ssh", "openssl"]

[[step]]
host = "sh {here}/copy-bundle.sh org.nginx.nginx {machine} {machine-port:22}"
expect = "copied: org.nginx.nginx"
# From nothing: a run before may have left it installed.
[[step]]
run = "sh -c 'bundle remove --for-everyone --purge org.nginx.nginx > /dev/null 2>&1; bundle install --for-everyone --yes /users/lab/org.nginx.nginx.dkv | tail -1'"
root = true
expect = "installed org.nginx.nginx"
[[step]]
run = "service nginx enable"
root = true
# Spark counts it ready once it listens (ADR 0470), which takes seconds
# on a slow machine.
[[step]]
run = "sh -c 'i=0; while [ $i -lt 60 ] && ! service nginx status > /dev/null; do sleep 1; i=$((i + 1)); done; service nginx status'"
root = true
expect = "Active: active (running)"
[[step]]
host = "curl -s http://{machine}:{machine-port:80}/"
expect = "Welcome to nginx!"
# The machine's own certificate, which certd made, named in nginx's service
# file, and the HTTPS server its settings hold turned on, as their comments
# say; a restart has Spark copy the certificate for nginx.
[[step]]
run = '''sh -c 'sed -i "/^secrets = /a certificates = [\"this-machine\"]" /system/settings/spark/services/nginx.toml && cd /shared/services/org.nginx.nginx/nginx/conf && sed -i "/^    #server {/,/^    #}/s/^    #/    /" nginx.conf && service nginx restart && echo restarted' '''
root = true
expect = "restarted"
[[step]]
run = "sh -c 'i=0; while [ $i -lt 60 ] && ! service nginx status > /dev/null; do sleep 1; i=$((i + 1)); done; service nginx status'"
root = true
expect = "Active: active (running)"
# The lab PC trusts that certificate and no other, and the machine's name.
[[step]]
host = "sh {here}/nginx-cert.sh trust {machine} {machine-port:22} {machine-port:443}"
expect = "Welcome to nginx!"
# Five reloads, two seconds apart, by a shell of the machine's own so that
# the step returns, while the lab PC asks.
[[step]]
run = "sh -c '(for i in 1 2 3 4 5; do sleep 2; service nginx reload; done) > /dev/null 2>&1 &'"
root = true
[[step]]
host = "sh {here}/nginx-load.sh {machine} {machine-port:80} {machine-port:443}"
expect = "lost 0"
# Its log is the system's, with a line for each request.
[[step]]
run = '''sh -c 'log nginx | grep -q "\"GET /?n=" && echo requests-logged' '''
root = true
expect = "requests-logged"
# Two renewals of the certificate, 10 seconds apart, by a shell of the
# machine's own, while the lab PC asks: Spark has nginx read the new
# certificate on SIGHUP, which loses no request. The machine's own
# certificate is the one nginx serves afterwards.
[[step]]
run = "sh -c '(sleep 3; cert renew this-machine; sleep 10; cert renew this-machine) > /dev/null 2>&1 &'"
root = true
[[step]]
host = "sh {here}/nginx-load.sh {machine} {machine-port:80} {machine-port:443}"
expect = "lost 0"
# The second SIGHUP comes 10 seconds after the first: wait for it, which
# polls the fingerprint nginx serves up to a bound.
[[step]]
host = "sh -c 'i=0; while [ $i -lt 30 ]; do sh {here}/nginx-cert.sh served {machine} {machine-port:22} {machine-port:443} && exit 0; sleep 2; i=$((i + 1)); done; sh {here}/nginx-cert.sh served {machine} {machine-port:22} {machine-port:443}'"
expect = "serving the fingerprint cert show gives"
[[step]]
run = "bundle remove --for-everyone --purge org.nginx.nginx"
root = true
expect = "removed org.nginx.nginx"
