# A service's own log files, turned over (ADR 0478): logturn turns the
# files a service names, keeps three, compresses the older ones, and no
# line is lost between them. The boot test log-turnover covers the same
# with a service that writes each second.
about = "logturn turns over the log file a service names, keeps three turned files with the older ones compressed, and the numbers in them stay in order with none twice (ADR 0478)"
time = "6m"

[[step]]
run = '''sh -c 'service lab-turn disable; cd /system/settings/spark/services && rm -f lab-turn.toml && printf "service_version = 1\ndescription = \"Lab log\"\nprogram = \"/system/commands/sh\"\narguments = [\"-c\", \"i=0; while :; do i=\$((i+1)); echo \$i >> /system/state/lab-turn/logs/x.log; sleep 1; done\"]\nrestart = \"on-failure\"\n[logs]\nfiles = [\"logs/*.log\"]\nkeep = 3\n[permissions]\nfiles.read-write = [\"/system/state/lab-turn\"]\n" > lab-turn.toml && mkdir -p /system/state/lab-turn/logs && service lab-turn enable && echo installed' '''
root = true
expect = "installed"
[[step]]
run = "sh -c 'for t in 1 2 3 4 5; do sleep 4; logturn --now lab-turn || exit 1; done; cd /system/state/lab-turn/logs; sleep 2; ls x.log* | tr \"\\n\" \" \"'"
root = true
expect = "x.log x.log.1 x.log.2.zst x.log.3.zst"
[[step]]
# Each file's first and last number, and any number found twice, so that
# a failure shows where.
run = "sh -c 'cd /system/state/lab-turn/logs; for f in x.log.3.zst x.log.2.zst; do echo \"$f: $(zstd -dc $f | head -n 1) to $(zstd -dc $f | tail -n 1)\"; done; for f in x.log.1 x.log; do echo \"$f: $(head -n 1 $f) to $(tail -n 1 $f)\"; done; (zstd -dc x.log.3.zst; zstd -dc x.log.2.zst; cat x.log.1 x.log) > /tmp/all; echo \"twice: $(uniq -d /tmp/all | tr \"\\n\" \" \")\"; sort -n -c /tmp/all && echo \"sorted $(uniq -d /tmp/all | wc -l)\"'"
root = true
expect = "sorted 0"
[[step]]
run = "sh -c 'service lab-turn disable; rm -r /system/settings/spark/services/lab-turn.toml /system/state/lab-turn /tmp/all; echo removed'"
root = true
expect = "removed"
