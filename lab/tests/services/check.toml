# service check (ADR 0471) says where a file is wrong as a compiler does:
# its path, the line and the place in it, the line with carets and what
# to do; the same for a mistake in the override that sets keys over a
# file, with the file it is set over; as one line with --brief. For a
# file that reads it says what putting it to use would do: the restart of
# a service that runs, and nothing to apply once it has restarted. service
# edit says the same of a copy that does not read, then offers to edit it
# again.
about = "service check says where a service file or its override is wrong, with the line, the place in it and a fix, in full and in one line; a change to a service that runs says what its restart does, and nothing once restarted; service edit says it of a copy that does not read (ADR 0471)"
time = "3m"
host_needs = ["scp"]

[[step]]
host = "sh {here}/copy-file.sh {here}/lab-try.service {machine} {machine-port:22}"
expect = "copied: lab-try.service"
# From nothing: a run before may have left them.
[[step]]
run = "sh -c 'cd /system/settings/spark/services && rm -rf lab-check.toml lab-try.toml settings.d/lab-check.toml && cp /users/lab/lab-try.service lab-try.toml && printf \"service_version = 1\\nprogram = \\\"/system/commands/true\\\"\\ndiscription = \\\"x\\\"\\n\" > lab-check.toml && echo installed'"
root = true
expect = "installed"

# A mistake in a file: the line, the place, the caret and the fix.
[[step]]
run = "sh -c 'service check lab-check 2>&1'"
exit = 1
expect = [
    "/system/settings/spark/services/lab-check.toml:3:1: `discription` is not a setting here",
    "3 | discription = \"x\"",
    "| ^^^^^^^^^^^",
    "= fix: did you mean `description`?",
]
[[step]]
run = "sh -c 'service check --brief lab-check 2>&1'"
exit = 1
expect = "/system/settings/spark/services/lab-check.toml:3:1: `discription` is not a setting here; service.toml(5) lists them: did you mean `description`?"

# The same in the override: its path, its line and what it is set over.
[[step]]
run = "sh -c 'cd /system/settings/spark/services && sed -i /discription/d lab-check.toml && mkdir -p settings.d && printf \"# a typo\\ndiscription = \\\"x\\\"\\n\" > settings.d/lab-check.toml && service check lab-check 2>&1'"
root = true
exit = 1
expect = [
    "/system/settings/spark/services/settings.d/lab-check.toml:2:1: `discription` is not a setting here",
    "2 | discription = \"x\"",
    "= fix: did you mean `description`?",
    "= note: set over /system/settings/spark/services/lab-check.toml",
]

# A change to a service that runs says what its restart does, and once
# it has restarted, nothing.
[[step]]
run = "service lab-try start"
root = true
expect = "started lab-try ("
[[step]]
run = "sh -c 'sed -i s/Tried/Changed/ /system/settings/spark/services/lab-try.toml && service check lab-try'"
root = true
expect = "lab-try runs an older copy: description differs; `service lab-try restart` applies the change: it restarts lab-try"
[[step]]
run = "service lab-try restart"
root = true
[[step]]
run = "service check lab-try"
root = true
expect = "/system/settings/spark/services/lab-try.toml: ok"
expect_not = "older copy"

# An edit that makes a mistake says where, and is answered with x: the
# file is as it was.
[[step]]
run = "sh -c 'printf \"x\\n\" | EDITOR=\"sed -i s/^enabled/discription/\" service edit lab-try 2>&1'"
root = true
expect = [
    "/system/settings/spark/services/lab-try.toml:",
    "`discription` is not a setting here",
    "= fix: did you mean `description`?",
    "/system/settings/spark/services/lab-try.toml is as it was",
]
[[step]]
run = "grep -c ^enabled /system/settings/spark/services/lab-try.toml"
expect = "1"
[[step]]
run = "sh -c 'service lab-try stop; cd /system/settings/spark/services && rm -f lab-try.toml lab-check.toml settings.d/lab-check.toml /users/lab/lab-try.service; echo cleaned'"
root = true
expect = "cleaned"
