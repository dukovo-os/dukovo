about = "SSH's key exchange, host key and cipher are modern and strong, and the server offers nothing with SHA-1, CBC or MD5"
time = "6m"
fresh = true

# `ssh -vv` prints the algorithms the two sides settled on before it tries
# to sign in (and it never does: keys only). The key exchange is SHA-256
# based, the host key is Ed25519, and the cipher is ChaCha20-Poly1305;
# nothing settled on uses SHA-1. `grep` leaves only the `kex:` lines, and
# its match makes the step's exit status, so the failed sign-in does not.
[[step]]
attack = "sh -c 'ssh -vv -o BatchMode=yes -o StrictHostKeyChecking=no lab@{target} true 2>&1 | grep -i \"kex:\"'"
expect = ["sha256", "ssh-ed25519", "chacha20-poly1305@openssh.com"]
expect_not = "sha1"
# What was settled on is what this client prefers. What the server would
# accept from any client is its own offer, which `ssh -vv` prints as the
# peer server's KEXINIT proposal: sed keeps that part alone (the client's
# own proposal comes first, and may list weaker ones). The server offers
# no SHA-1 key exchange, host key signature or MAC, no CBC cipher and no
# MD5.
[[step]]
attack = "sh -c 'ssh -vv -o BatchMode=yes -o StrictHostKeyChecking=no lab@{target} true 2>&1 | sed -n \"/peer server KEXINIT proposal/,/first_kex_follows/p\"'"
expect = ["peer server KEXINIT proposal", "KEX algorithms:", "host key algorithms:", "ciphers ctos:", "MACs ctos:"]
expect_not = ["sha1", "-cbc", "md5", "ssh-rsa", "ssh-dss", "arcfour", "3des"]
