about = "With PasswordAuthentication yes and a reload, a person's password signs them in over SSH and a wrong one is refused and shown by lastb; with the setting taken back, passwords are refused again (ADR 0348)"
time = "4m"

[[step]]
run = "sh -c 'umask 077 && cat > ~/lab-password && printf \"#!/bin/sh\\ncat /users/lab/lab-password\\n\" > ~/lab-askpass && chmod 700 ~/lab-askpass && printf \"#!/bin/sh\\necho not-the-password\\n\" > ~/lab-askpass-wrong && chmod 700 ~/lab-askpass-wrong && echo ready'"
input = "{password}\n"
expect = "ready"
[[step]]
run = "sh -c 'cp /system/settings/ssh/sshd_config /users/lab/lab-sshd_config && printf \"PasswordAuthentication yes\\n\" >> /system/settings/ssh/sshd_config && sshd -t && service sshd reload && sleep 2 && sshd -T'"
root = true
expect = "PasswordAuthentication yes"
[[step]]
run = "sh -c 'SSH_ASKPASS=/users/lab/lab-askpass SSH_ASKPASS_REQUIRE=force ssh -o PubkeyAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR lab@127.0.0.1 echo in-with-a-password < /dev/null'"
expect = "in-with-a-password"
[[step]]
run = "sh -c 'SSH_ASKPASS=/users/lab/lab-askpass-wrong SSH_ASKPASS_REQUIRE=force ssh -o PubkeyAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR lab@127.0.0.1 echo let-in < /dev/null; echo status=$?'"
expect = ["Permission denied", "status=255"]
expect_not = "let-in\n"
[[step]]
run = "lastb -n 3"
root = true
expect = ["lab ", "127.0.0.1"]
[[step]]
run = "sh -c 'cp /users/lab/lab-sshd_config /system/settings/ssh/sshd_config && rm /users/lab/lab-sshd_config && service sshd reload && sleep 2 && sshd -T'"
root = true
expect = "PasswordAuthentication no"
[[step]]
run = "sh -c 'SSH_ASKPASS=/users/lab/lab-askpass SSH_ASKPASS_REQUIRE=force ssh -o PubkeyAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR lab@127.0.0.1 echo let-in < /dev/null; echo status=$?'"
expect = ["Permission denied", "status=255"]
expect_not = "let-in\n"
[[step]]
run = "sh -c 'rm -f ~/lab-password ~/lab-askpass ~/lab-askpass-wrong; echo cleaned'"
expect = "cleaned"
