about = "A fresh disk boots to the sign-in prompt, and the lab signs in over SSH"
time = "5m"
fresh = true

# The boot itself, which the runner starts this test with, waits for the
# kernel's "Boot complete." and then for SSH. These check what came between.
[[step]]
serial = "Radix"
[[step]]
run = "cat /system/settings/issue"
expect = "Test image of the Dukovo Lab"
[[step]]
run = "whoami"
expect = "lab"
