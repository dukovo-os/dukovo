# startup (ADR 0474): once the health check has seen the first start
# through and its services have settled, its record has the times, and
# startup says each step from the
# kernel to the services settling, the chain of services that set when
# they settled and the slowest, in words and as JSON. A fresh disk has
# no earlier good start, so --compare says there is none to compare with.
about = "startup says the steps of a start from the firmware to the sign-in, the chain of services that set when they settled and the slowest, in words and as JSON, and says when no earlier good start is kept to compare with (ADR 0474)"
time = "5m"
fresh = true

[[step]]
serial = "spark: started slot a, @system.a"
[[step]]
serial = "is seen through"
[[step]]
serial = "sysupdate: kept the times of start "
[[step]]
run = "startup"
expect = [
    "slot A: good",
    "firmware",
    "boot loader",
    "kernel",
    "services",
    "sign-in",
    "From the computer starting to the services settling:",
    "The chain that set when the services settled",
    "The slowest services, from started to ready:",
]
[[step]]
run = "startup --json"
expect = ['"steps":', '"chain":', '"slowest":']
[[step]]
run = "startup --compare"
exit = 1
expect = "no good start with times is kept to compare with"
[[step]]
run = "startup --start 999"
exit = 1
expect = "no record of start 999 is kept"
