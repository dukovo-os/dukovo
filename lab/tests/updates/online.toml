# An update from an update server over a real network (ADR 0466): the lab
# PC serves the test update server `ob lab` builds (update-server.sh
# beside this file), a year of a server's life whose timestamp and
# snapshot keys were replaced since the root the machine trusts. Its
# stable channel offers a release that updates only from a bridge, so
# the machine checks, is told the bridge comes first, fetches only the
# files its slot lacks, stages the bridge, and proves it at the restart.
about = "The machine checks a real update server's stable channel over the lab network, is told a bridge release comes first, fetches only the files it lacks, stages the bridge and proves it at the restart (ADR 0466)"
time = "15m"
fresh = true
host_needs = ["python3"]

[[step]]
host = "sh {here}/update-server.sh serve {port:updates}"
background = true
ready = "serving updates"
[[step]]
run = '''sh -c 'printf "stable = 10\n" > /system/settings/sysupdate/health.toml && printf "server = \"http://{peer}:{port:updates}/system/\"\n" > /system/settings/sysupdate/updates.toml && echo "set: $((6 * 7))"' '''
root = true
expect = "set: 42"
[[step]]
run = "sysupdate check"
root = true
expect = ["sysupdate: the stable channel offers Dukovo ", "-test.year; this system runs Dukovo ", "-test.bridge comes first", "files this system lacks"]
[[step]]
run = "sysupdate download"
root = true
expect = "sysupdate: fetched "
[[step]]
run = "sysupdate stage"
root = true
expect = ["fetching 0 files of Dukovo ", "-test.bridge in slot B: it starts at the next restart"]
[[step]]
run = "sh -c '(sleep 2; reboot) > /dev/null 2>&1 &'"
root = true
[[step]]
serial = "asked to restart the machine"
[[step]]
serial = "spark: started slot b, @system.b"
[[step]]
serial = "proved itself: it is now the default"
[[step]]
wait = "ready"
[[step]]
run = "cat /system/resources/test-update/notes.txt"
expect = "bridge"
[[step]]
run = "sysupdate status"
root = true
expect = ["Running:  slot B", "-test.bridge, the default"]
