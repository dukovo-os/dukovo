about = "The power cord pulled during an update's first try costs it one of its three tries: the menu shows at the next start, the second try starts, and the update proves itself (ADR 0452)"
time = "15m"
fresh = true

[[step]]
host = "sh {here}/copy-update.sh good {machine} {machine-port:22}"
expect = "copied: good"
[[step]]
run = '''sh -c 'printf "stable = 10\n" > /system/settings/sysupdate/health.toml' '''
root = true
[[step]]
run = "sysupdate stage /users/lab/update-good"
root = true
expect = "-test.good in slot B: it starts at the next restart"
[[step]]
run = "sh -c '(sleep 2; reboot) > /dev/null 2>&1 &'"
root = true
[[step]]
serial = "asked to restart the machine"
# The cord comes out as the try starts, long before it can prove itself.
[[step]]
serial = "spark: started slot b, @system.b"
[[step]]
power = "cut"
[[step]]
power = "on"
[[step]]
serial = "(update, second try)'"
[[step]]
serial = "spark: started slot b, @system.b"
[[step]]
serial = "proved itself: it is now the default"
[[step]]
wait = "ready"
[[step]]
run = "sysupdate status"
root = true
expect = ["Running:  slot B", "the default", "Next start: slot B"]
