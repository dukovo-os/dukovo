about = "A start cut short before the health check saw it through makes GRUB show its menu at the next start, then start Dukovo by itself; GRUB writes the slot state on the machine's own EFI system partition (ADR 0452)"
time = "10m"
fresh = true

# A health check of 60 seconds, so that the start is seen through a
# minute after its services run: on a fast machine they run within a
# second of Spark's first line, and the cord comes out later than that.
[[step]]
run = '''printf '[[check]]\nname = "wait"\ncommand = ["sleep", "60"]\nrequired = true\ntimeout = 120\n' > /users/lab/health.toml'''
[[step]]
run = "cp /users/lab/health.toml /system/settings/sysupdate/health.toml"
root = true
[[step]]
power = "reset"
[[step]]
serial = "spark: started slot a, @system.a"
[[step]]
power = "cut"
[[step]]
power = "on"
# The menu shows, and its Dukovo entry starts once its time is up.
[[step]]
serial = "Booting `Dukovo Server"
[[step]]
serial = "spark: started slot a, @system.a"
[[step]]
serial = "is seen through"
[[step]]
wait = "ready"
[[step]]
run = "sh -c 'rm /system/settings/sysupdate/health.toml /users/lab/health.toml && sysupdate status'"
root = true
expect = "Next start: slot A"
expect_not = "Not seen through"
