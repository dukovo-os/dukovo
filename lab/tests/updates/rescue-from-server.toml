# Rescue reinstalls from a real update server over the lab network (ADR
# 0543): the lab PC serves the test update server `ob lab` builds
# (update-server.sh beside this file), whose stable channel offers a
# release that updates only from a bridge. The machine follows that
# server, three starts are cut short, and in Rescue the slot is deleted,
# so no slot can start; Rescue turns networking on with the root's
# settings, reads the channel against the root's trust, is told the
# bridge comes first, fetches every file of it onto the root's disk, and
# builds slot A, checking each. The bridge then starts and is seen
# through, the lab account's file kept, and Rescue follows it.
about = "With no slot left to start, Rescue reinstalls from a real update server over the lab network, reading the channel against the root's trust, taking the bridge release the root's release needs first, and the system that then starts keeps the lab account's files; Rescue then follows the bridge (ADR 0543)"
time = "40m"
fresh = true
host_needs = ["python3"]

[[step]]
host = "sh {here}/update-server.sh serve {port:updates}"
background = true
ready = "serving updates"
[[step]]
run = "sh -c 'echo \"kept by Rescue\" > /users/lab/rescue-keep.txt'"
[[step]]
run = '''sh -c 'printf "[[check]]\nname = \"wait\"\ncommand = [\"sleep\", \"600\"]\nrequired = true\ntimeout = 600\n" > /system/settings/sysupdate/health.toml && printf "server = \"http://{peer}:{port:updates}/system/\"\n" > /system/settings/sysupdate/updates.toml && echo "set: $((6 * 7))"' '''
root = true
expect = "set: 42"
[[step]]
run = "sync"
[[step]]
power = "reset"
[[step]]
serial = "spark: started slot a, @system.a"
[[step]]
power = "cut"
[[step]]
power = "on"
[[step]]
serial = "spark: started slot a, @system.a"
[[step]]
power = "cut"
[[step]]
power = "on"
[[step]]
serial = "spark: started slot a, @system.a"
[[step]]
power = "cut"
[[step]]
power = "on"
[[step]]
serial = "spark: this is Rescue"
[[step]]
screen = "Rescue needs one of this computer's administrators."
[[step]]
type = "lab\n"
[[step]]
screen = "Password:"
[[step]]
type = "{password}\n"
[[step]]
screen = "Choose 0 to 13:"
# No slot left: the health check's wait goes, and so does slot A.
[[step]]
type = "10\n"
[[step]]
type = "clear; rm /volumes/*/@settings/sysupdate/health.toml && subvolume delete /volumes/*/@system.a && echo \"gone\"\": $((40 + 2))\"\n"
[[step]]
screen = "gone: 42"
[[step]]
type = "exit\n"
[[step]]
screen = "Back in Rescue."
[[step]]
type = "3\n"
[[step]]
screen = "or the folder or file:"
[[step]]
type = "server\n"
[[step]]
screen = "It comes from http://"
[[step]]
screen = "-test.bridge into slot A?"
[[step]]
type = "yes\n"
[[step]]
screen = "is back in slot A, every file checked"
[[step]]
type = "12\n"
[[step]]
serial = "spark: started slot a, @system.a"
[[step]]
serial = "is seen through"
[[step]]
wait = "ready"
[[step]]
run = "cat /system/resources/test-update/notes.txt /users/lab/rescue-keep.txt"
expect = ["bridge", "kept by Rescue"]
[[step]]
run = "sysupdate status"
root = true
expect = ["Running:  slot A", "-test.bridge, the default", "Next start: slot A"]
# Rescue follows the bridge, from what the reinstall kept of the server.
[[step]]
run = "sh -c 'while service sysupdate-stage status > /dev/null; do sleep 2; done; sysupdate status | grep Rescue:'"
root = true
expect = "-test.bridge"
[[step]]
run = "rm /users/lab/rescue-keep.txt"
