# Phase 16's commands, services, console pages and API routes, each with
# the lab tests that cover it, by category and name (lab/tests/CATEGORY/
# NAME.toml). `./ob lab coverage` prints the table; with --check, as CI
# runs it, it fails while something the tree has that is not in
# lab/before-phase-16.txt has no entry here, an entry names no test or a
# test that is not there, a test never names what it covers, or an entry
# is of something the tree no longer has. The handbook's Lab tests
# chapter, Coverage, says more.

# A command is covered by a test that runs it: a bundle's by its path, as
# a script runs it, or by its own name where the program does what its
# name says.
[commands]
admind = ["web-console/csrf", "web-console/passkeys", "web-console/sign-in", "web-console/unlock"]
alertd = ["monitoring/alerts-email", "monitoring/alerts-webhook", "monitoring/early-warning-disk"]
alerts = ["monitoring/alerts-email", "monitoring/alerts-webhook", "monitoring/early-warning-disk"]
"alerts test" = ["monitoring/alerts-email", "monitoring/alerts-webhook"]
"alerts raise" = ["monitoring/alerts-email", "monitoring/alerts-webhook"]
"alerts clear" = ["monitoring/alerts-email", "monitoring/alerts-webhook"]
at = ["services/crontab"]
atq = ["services/crontab"]
atrm = ["services/crontab"]
batch = ["services/crontab"]
cert = ["services/acme", "services/certificates", "services/nginx"]
"cert get" = ["services/acme"]
"cert revoke" = ["services/acme"]
certd = ["services/acme", "services/certificates"]
"changes bisect" = ["startup/bisect"]
crontab = ["services/crontab"]
dukovo-check = ["security/dukovo-check"]
dumps = ["hardware/crash-dump"]
"dumps test" = ["hardware/crash-dump"]
"firewall blocked" = ["security/blocking"]
"firewall never-block" = ["security/blocking"]
"firewall unblock" = ["security/blocking"]
hardware = ["hardware/check"]
"hardware check" = ["hardware/check"]
help-session = ["security/help-session"]
"help-session start" = ["security/help-session"]
"help-session end" = ["security/help-session"]
"help-session log" = ["security/help-session"]
"help-session allow-elevate" = ["security/help-session"]
"hardware last" = ["hardware/check"]
hostnamectl = ["services/admin-commands"]
logforward = ["services/log-forward"]
logturn = ["services/log-turnover"]
metrics = ["monitoring/metrics-scrape"]
metricsd = ["monitoring/metrics-scrape"]
netcheck = ["network/netcheck"]
"netd leases" = ["network/dhcp-server"]
nginx = ["services/nginx"]
php = ["services/php"]
php-fpm = ["services/php-fpm"]
pip = ["services/python-commands"]
pip3 = ["services/python-commands"]
python = ["services/python-commands"]
python3 = ["services/python", "services/python-commands"]
report = ["reports/crash-report", "reports/phone-download"]
"report crash" = ["reports/phone-download"]
"report delete" = ["reports/crash-report"]
"report list" = ["reports/crash-report", "reports/phone-download"]
"report status" = ["reports/crash-report"]
reportd = ["reports/crash-report"]
sendmail = ["services/admin-commands"]
serial = ["console/serial-command", "hardware/serial-ports"]
service = ["services/check", "services/command", "services/explain", "services/graph", "services/health-giveup", "services/limits", "services/offered-sockets", "services/sockets", "services/timers", "services/try", "services/views", "storage/io-weight"]
sqlite3 = ["services/sqlite"]
startup = ["boot/startup"]
systemctl = ["services/admin-commands"]
timerd = ["services/timers"]
troubleshoot = ["boot/troubleshoot"]
tune = ["system/tune"]
valkey-benchmark = ["services/valkey"]
valkey-check-aof = ["services/valkey"]
valkey-check-rdb = ["services/valkey"]
valkey-cli = ["services/valkey"]

[services]
admind = ["web-console/csrf", "web-console/passkeys", "web-console/sign-in", "web-console/unlock"]
alertd = ["monitoring/alerts-email", "monitoring/alerts-webhook", "monitoring/early-warning-disk"]
certd = ["services/acme", "services/certificates"]
dukovo-check = ["security/dukovo-check"]
dumps = ["hardware/crash-dump"]
logforward = ["services/log-forward"]
logturn = ["services/log-turnover"]
metricsd = ["monitoring/metrics-scrape"]
nginx = ["services/command", "services/graph", "services/nginx", "services/sockets"]
php-fpm = ["services/php-fpm"]
reportd = ["reports/crash-report"]
sysupdate-stage = ["updates/updater"]
timerd = ["services/timers"]
tune = ["system/tune"]
valkey = ["services/valkey"]

# The admin console's pages, by their path (thread C), and admind's
# routes, as METHOD /path.
[pages]

[routes]
"GET /api/1/health" = ["web-console/sign-in"]
"GET /api/1/fingerprint" = ["web-console/sign-in"]
"POST /api/1/sign-in" = ["web-console/csrf", "web-console/sign-in"]
"POST /api/1/sign-in/code" = ["web-console/csrf", "web-console/sign-in"]
"POST /api/1/sign-in/passkey/options" = ["web-console/csrf", "web-console/passkeys"]
"POST /api/1/sign-in/passkey" = ["web-console/csrf", "web-console/passkeys"]
"GET /api/1/session" = ["web-console/sign-in", "web-console/unlock"]
"POST /api/1/sign-out" = ["web-console/csrf", "web-console/sign-in", "web-console/unlock"]
"POST /api/1/unlock" = ["web-console/csrf", "web-console/passkeys", "web-console/unlock"]
"POST /api/1/unlock/passkey/options" = ["web-console/csrf", "web-console/passkeys"]
"POST /api/1/unlock/extend" = ["web-console/csrf", "web-console/unlock"]
"POST /api/1/lock" = ["web-console/csrf", "web-console/unlock"]
"GET /api/1/events" = ["web-console/unlock"]
"GET /api/1/account/second-step" = ["web-console/passkeys", "web-console/sign-in"]
"POST /api/1/account/second-step/app/begin" = ["web-console/csrf", "web-console/sign-in"]
"POST /api/1/account/second-step/app/confirm" = ["web-console/csrf", "web-console/sign-in"]
"POST /api/1/account/second-step/app/remove" = ["web-console/csrf", "web-console/sign-in"]
"POST /api/1/account/second-step/passkey/begin" = ["web-console/csrf", "web-console/passkeys"]
"POST /api/1/account/second-step/passkey/add" = ["web-console/csrf", "web-console/passkeys"]
"POST /api/1/account/second-step/passkey/remove" = ["web-console/csrf", "web-console/passkeys"]
"POST /api/1/account/second-step/passkey/rename" = ["web-console/csrf", "web-console/passkeys"]
"POST /api/1/account/second-step/codes" = ["web-console/csrf", "web-console/sign-in"]
"POST /api/1/account/second-step/trusted/forget" = ["web-console/csrf", "web-console/sign-in"]
"POST /api/1/account/tokens/add" = ["web-console/csrf"]
"POST /api/1/account/tokens/remove" = ["web-console/csrf"]
