# Phase 16's commands, services, console pages and API routes, each with
# the lab tests that cover it, by category and name (lab/tests/CATEGORY/
# NAME.toml). `./ob lab coverage` prints the table; with --check, as CI
# runs it, it fails while something the tree has that is not in
# lab/before-phase-16.txt has no entry here, an entry names no test or a
# test that is not there, a test never names what it covers, or an entry
# is of something the tree no longer has. The handbook's Lab tests
# chapter, Coverage, says more.

# A command is covered by a test that runs it: a bundle's by its path, as
# a script runs it, or by its own name where the program does what its
# name says.
[commands]
alertd = ["monitoring/alerts-email", "monitoring/alerts-webhook", "monitoring/early-warning-disk"]
alerts = ["monitoring/alerts-email", "monitoring/alerts-webhook", "monitoring/early-warning-disk"]
"alerts test" = ["monitoring/alerts-email", "monitoring/alerts-webhook"]
"alerts raise" = ["monitoring/alerts-email", "monitoring/alerts-webhook"]
"alerts clear" = ["monitoring/alerts-email", "monitoring/alerts-webhook"]
cert = ["services/certificates", "services/nginx"]
certd = ["services/certificates"]
dumps = ["hardware/crash-dump"]
"dumps test" = ["hardware/crash-dump"]
logforward = ["services/log-forward"]
metrics = ["monitoring/metrics-scrape"]
metricsd = ["monitoring/metrics-scrape"]
"netd leases" = ["network/dhcp-server"]
nginx = ["services/nginx"]
php = ["services/php"]
php-fpm = ["services/php-fpm"]
pip = ["services/python-commands"]
pip3 = ["services/python-commands"]
python = ["services/python-commands"]
python3 = ["services/python", "services/python-commands"]
serial = ["console/serial-command", "hardware/serial-ports"]
service = ["services/check", "services/command", "services/explain", "services/graph", "services/health-giveup", "services/try"]
sqlite3 = ["services/sqlite"]
valkey-benchmark = ["services/valkey"]
valkey-check-aof = ["services/valkey"]
valkey-check-rdb = ["services/valkey"]
valkey-cli = ["services/valkey"]

[services]
alertd = ["monitoring/alerts-email", "monitoring/alerts-webhook", "monitoring/early-warning-disk"]
certd = ["services/certificates"]
dumps = ["hardware/crash-dump"]
logforward = ["services/log-forward"]
metricsd = ["monitoring/metrics-scrape"]
nginx = ["services/command", "services/graph", "services/nginx"]
php-fpm = ["services/php-fpm"]
valkey = ["services/valkey"]

# The admin console's pages, by their path (thread C), and admind's
# routes, as METHOD /path.
[pages]

[routes]
