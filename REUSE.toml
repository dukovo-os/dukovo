# SPDX-FileCopyrightText: 2026 The Dukovo contributors
# SPDX-License-Identifier: Apache-2.0 OR MIT

# Copyright and license information for files that cannot carry an SPDX
# header of their own (https://reuse.software/spec-3.3/). Every other file
# starts with SPDX-FileCopyrightText and SPDX-License-Identifier lines, and
# CI runs `reuse lint`. See CONTRIBUTING.md and ADR 0026.

version = 1

# Generated by Cargo, which would drop a header.
[[annotations]]
path = [
    "Cargo.lock",
    "kernel/Cargo.lock",
    "userspace/Cargo.lock",
    "userspace/programs/Cargo.lock",
    "userspace/programs/host/Cargo.lock",
]
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# JSON has no comments.
[[annotations]]
path = ["kernel/targets/*.json", "userspace/targets/*.json"]
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The catalog's keys and signed TUF metadata (ADR 0381), and the system
# releases' (ADR 0467): JSON, signed as written, so a header could not be
# added even if JSON had comments.
[[annotations]]
path = [
  "catalog/keys/*.json",
  "catalog/metadata/*.json",
  "releases/keys/*.json",
  "releases/metadata/*.json",
]
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# Spleen 2.1.0 by Frederic Cambus, https://github.com/fcambus/spleen, unmodified
# (ADR 0015). Its license file is fonts/LICENSE-spleen.
[[annotations]]
path = "kernel/lib/fbcon/fonts/*.psfu"
SPDX-FileCopyrightText = "2018-2024 Frederic Cambus"
SPDX-License-Identifier = "BSD-2-Clause"

# The Developer Certificate of Origin 1.1, https://developercertificate.org/,
# verbatim. Its own notice allows verbatim copies only.
[[annotations]]
path = "DCO"
SPDX-FileCopyrightText = "2004, 2006 The Linux Foundation and its contributors"
SPDX-License-Identifier = "LicenseRef-DCO"

# musl 1.2.5's COPYRIGHT file, https://musl.libc.org, verbatim: the notice
# of the musl code ports/mlibc/musl keeps (ADR 0072).
[[annotations]]
path = "ports/mlibc/musl/COPYRIGHT"
SPDX-FileCopyrightText = "2005-2020 Rich Felker, et al."
SPDX-License-Identifier = "MIT"

# xkeyboard-config 2.48's COPYING file, https://gitlab.freedesktop.org/xkeyboard-config/xkeyboard-config,
# verbatim: the notices of the layouts the consoles' keymaps are made from
# (ADR 0149). Its notices are MIT's and others like it.
[[annotations]]
path = "userspace/programs/keymap/keymaps/COPYING-xkeyboard-config"
SPDX-FileCopyrightText = "1996-2025 The xkeyboard-config contributors"
SPDX-License-Identifier = "MIT"

# boringtun 0.7.1's LICENSE.md, https://github.com/cloudflare/boringtun,
# verbatim: its notice, which its crates.io package leaves out (ADR 0340).
[[annotations]]
path = "userspace/programs/systools/notices/LICENSE-boringtun.md"
SPDX-FileCopyrightText = "2019 Cloudflare, Inc."
SPDX-License-Identifier = "BSD-3-Clause"

# What the shell's test scripts must write: bash's and dash's output,
# compared byte for byte, which a header would change.
[[annotations]]
path = "userspace/programs/nukesh/tests/cases/*.out"
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The system's default user and group lists (ADR 0090) and the console
# greeting (consoled(8)), whose formats have no comments.
[[annotations]]
path = ["userspace/defaults/group", "userspace/defaults/issue", "userspace/defaults/passwd"]
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# Zstandard frames of generated data, made by the zstd program, which the
# Btrfs decoder's tests read (kernel/fs/btrfs/src/tests/compressed.rs).
[[annotations]]
path = "kernel/fs/btrfs/src/tests/zstd/*.zst"
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# Btrfs disks Linux and Radix left with a log of fsyncs to replay, and
# Linux's lists of them, made by `ob fixture btrfs-log` and `ob fixture
# btrfs-radix-log`, which the Btrfs tests read
# (kernel/fs/btrfs/src/tests/log.rs and fsync.rs).
[[annotations]]
path = "kernel/fs/btrfs/src/tests/fixtures/*"
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The sectors of an exFAT volume exfat-fuse wrote, which the exFAT
# driver's tests read (kernel/fs/exfat/src/tests.rs).
[[annotations]]
path = "kernel/fs/exfat/src/fixtures/*.sectors"
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The sectors of an ext4 volume Linux's ext4 wrote, its journal not yet
# replayed, which the ext4 driver's tests read (kernel/fs/ext4/src/tests.rs).
[[annotations]]
path = "kernel/fs/ext4/src/fixtures/*.sectors"
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The sectors of an NTFS volume ntfs-3g filled, which the NTFS driver's
# tests and the ntfs boot test read (kernel/fs/ntfs/src/tests.rs).
[[annotations]]
path = "kernel/fs/ntfs/src/fixtures/*.sectors"
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The disc image the lab's optical drive test puts in the machine's drive
# (lab/tests/storage/optical.toml), made by xorriso: an ISO 9660 with
# Rock Ridge and Joliet, labelled LABDISC, holding hello.txt.
[[annotations]]
path = "lab/tests/storage/optical.iso"
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The samples of the lab's music CD (lab/tests/storage/audio-cd.toml), which
# audio-cd.cue beside it names: tones and silence, made by a few lines of
# Python, as the cue sheet says.
[[annotations]]
path = "lab/tests/storage/audio-cd.bin"
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The floppy disk image the lab's floppy drive test puts in the machine's
# drive, write-protected (lab/tests/storage/floppy.toml), made by
# mkfs.fat and mtools: a 720 KB FAT12 labelled LAB720, holding hello.txt.
[[annotations]]
path = "lab/tests/storage/floppy.img"
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The packages the lab's browser steps drive web pages with, and npm's lock
# of them (lab/browsers). JSON has no comments, and npm writes the lock
# file itself.
[[annotations]]
path = ["lab/browsers/package.json", "lab/browsers/package-lock.json"]
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# uACPI 7.0.0 at commit c0edece, https://github.com/uACPI/uACPI, unmodified
# but for the build files left out: the AML interpreter the kernel links
# (ADR 0200). Its files carry no headers; its license file is
# vendor/LICENSE.
[[annotations]]
path = "kernel/lib/uacpi/vendor/**"
SPDX-FileCopyrightText = "2022-2026 Daniil Tatianin"
SPDX-License-Identifier = "MIT"

# The ACPI tables iasl compiles from src/tests/*.asl, which radix-uacpi's
# tests run (kernel/lib/uacpi/src/tests.rs), and from
# tools/xtask/src/acpi/*.asl, which boot tests give QEMU.
[[annotations]]
path = ["kernel/lib/uacpi/src/tests/*.aml", "tools/xtask/src/acpi/*.aml"]
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The security design's worked examples of bundle manifests, which the
# manifest crate's tests read (userspace/programs/manifest/src/bundle/tests.rs).
# JSON has no comments.
[[annotations]]
path = "userspace/programs/manifest/src/bundle/examples/*.json"
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The answers file the install tests install by (ADR 0309). JSON has no
# comments.
[[annotations]]
path = "userspace/programs/installer/tests/install/*.json"
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The facts of the faults troubleshoot's tests plant, one folder each
# (userspace/programs/systools/src/troubleshoot.rs), and the lab test's
# copy of one (ADR 0474). JSON has no comments.
[[annotations]]
path = [
    "userspace/programs/systools/tests/troubleshoot-faults/*/facts.json",
    "lab/tests/boot/lab-disk-errors.json",
]
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The test certificates, keys and signatures OpenSSL made for tls-test
# (testdata/make.sh), the message it signed, and the sealed messages'
# hashes (testdata/aead.py), which tls-test reads (ADR 0192).
[[annotations]]
path = [
    "userspace/programs/tls-test/testdata/*.pem",
    "userspace/programs/tls-test/testdata/*.key",
    "userspace/programs/tls-test/testdata/*.sig",
    "userspace/programs/tls-test/testdata/*.txt",
]
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The certificates and key OpenSSL made for netservices-test's servers
# (testdata/make.sh), which it serves DNS over TLS, HTTPS and NTS with
# (ADRs 0193 and 0194).
[[annotations]]
path = [
    "userspace/programs/netservices-test/testdata/*.pem",
    "userspace/programs/netservices-test/testdata/*.key",
]
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "Apache-2.0 OR MIT"

# The Dukovo logo, for the README. The name and logo are the project's
# marks: they identify Dukovo and are not covered by the code license.
[[annotations]]
path = "docs/images/dukovo-logo-*.svg"
SPDX-FileCopyrightText = "2026 The Dukovo contributors"
SPDX-License-Identifier = "LicenseRef-Dukovo-Marks"
